# Parallel test execution is opt-in: tests run on the same thread unless the class or method is annotated
# with @Execution(ExecutionMode.CONCURRENT). Classes sharing global state (DataManager singleton, H2, Solr)
# are serialized via @ResourceLock on the Abstract*Test base classes.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
