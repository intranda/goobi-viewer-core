<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('user__upload_content', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('admin__user_profile', request.contextPath.concat('/user/'), 1)}" />
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.addStaticLinkToBreadcrumb('user__upload_content', 2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <ui:fragment rendered="#{userBean.loggedIn and configurationBean.contentUploadEnabled}">
            <div
                id="userContentUploadWrap"
                class="user-content-upload page-wrapp">
                <h1>#{msg.user__upload_content}</h1>
                <p>#{msg.user__upload_content_info}</p>
                <div
                    id="userContentUpload"
                    class="user-content-upload__table-wrapper">
                    <h:form
                        id="userUploadJobsForm"
                        prependId="false">
                        <!-- OVERVIEW -->
                        <h2>#{msg.viewOverview}</h2>

                        <!-- UPLOAD JOBS -->
                        <div class="data-table">
                            <!-- TABLE -->
                            <div
                                id="userUploadJobsTable"
                                class="data-table__table"
                                role="table"
                                aria-label="#{msg.overview}">
                                <!-- HEADER ROW -->
                                <div
                                    class="data-table__row -head"
                                    role="row">
                                    <div
                                        class="data-table__cell"
                                        role="columnheader">
                                        #{msg.title}
                                    </div>
                                    <div
                                        class="data-table__cell"
                                        role="columnheader">
                                        #{msg.date}
                                    </div>
                                    <div
                                        class="data-table__status"
                                        role="columnheader">
                                        #{msg.status}
                                    </div>
                                </div>

                                <!-- ROWS -->
                                <ui:repeat
                                    var="job"
                                    value="#{uploadBean.lazyModelUploadJobs.paginatorList}">
                                    <div
                                        class="data-table__row"
                                        role="row">
                                        <!-- TITLE -->
                                        <div
                                            class="data-table__cell -main"
                                            role="cell">
                                            <h:outputText
                                                rendered="#{!job.online}"
                                                value="#{job.title}" />
                                            <ui:fragment rendered="#{job.online}">
                                                <a
                                                    href="#{navigationHelper.applicationUrl}#{job.recordUrl}"
                                                    target="_blank">
                                                    <util:icon-text
                                                        icon="external-link"
                                                        text="#{job.title}" />
                                                </a>
                                            </ui:fragment>
                                        </div>

                                        <!-- DATE -->
                                        <div
                                            class="data-table__cell -date"
                                            role="cell">
                                            <h:outputText value="#{job.dateCreated}">
                                                <f:converter converterId="localDateTimeConverter" />
                                                <f:attribute
                                                    name="pattern"
                                                    value="#{navigationHelper.dateTimePattern}" />
                                            </h:outputText>
                                        </div>

                                        <!-- STATUS -->
                                        <div
                                            class="data-table__status #{job.status eq 'READY' ? '-success' : (job.status eq 'ERROR' ? '-danger' : '-muted')}"
                                            role="cell">
                                            <ui:fragment rendered="#{job.status eq 'WAITING'}">
                                                <util:icon
                                                    icon="hourglass-high"
                                                    ariaLabel="#{msg.waiting}" />
                                            </ui:fragment>
                                            <ui:fragment rendered="#{job.status eq 'READY'}">
                                                <util:icon
                                                    icon="circle-check"
                                                    ariaLabel="#{msg.ready}" />
                                            </ui:fragment>
                                            <ui:fragment rendered="#{job.status eq 'ERROR'}">
                                                <span
                                                    title="#{job.message}"
                                                    data-placement="bottom">
                                                    <util:icon
                                                        icon="circle-x"
                                                        ariaLabel="#{msg.error}" />
                                                </span>
                                            </ui:fragment>
                                        </div>
                                    </div>
                                </ui:repeat>
                            </div>

                            <!-- NO UPLOAD JOBS -->
                            <ui:fragment rendered="#{uploadBean.lazyModelUploadJobs.sizeOfDataList eq 0}">
                                <p class="data-table__empty">#{msg.hitsZero}</p>
                            </ui:fragment>

                            <!-- FOOTER -->
                            <viewerComponent:dataTableFooter tableValues="#{uploadBean.lazyModelUploadJobs}" />
                        </div>
                    </h:form>
                </div>
            </div>
        </ui:fragment>
    </ui:define>

    <ui:define name="sidebar">
        <ui:fragment rendered="#{userBean.loggedIn and configurationBean.contentUploadEnabled}">
            <div
                id="widgetSidebar"
                class="widget widget-user-content-upload">
                <div class="widget__topbar widget-user-content-upload__topbar">
                    <h2 class="widget__title widget-user-content-upload__title">#{msg.user__upload_content__sidebar_label}</h2>
                </div>
                <div class="widget__body widget-user-content-upload__body">
                    <h:outputText value="#{msg.user__upload_content__sidebar_desc}" />
                    <div class="d-flex justify-content-center mt-3">
                        <button
                            class="btn btn--full"
                            data-toggle="modal"
                            data-target="#contentUploadModal">
                            #{msg.user__upload_content}
                        </button>
                    </div>
                </div>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
