<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <!-- MESSAGES -->
    <div class="messages">
        <h:messages
            id="messages"
            globalOnly="false"
            infoClass="alert alert-success"
            errorClass="alert alert-danger" />
    </div>

    <!-- ADMIN TOPBAR FRONTEND -->
    <viewerComponent:frontEndAdminTopBar />

    <!-- ARCHIVES -->
    <div
        id="archives"
        class="archives #{archiveBean.databaseState == 'ARCHIVES_LOADED' ? '-archivesLoaded' : '-archivesNotLoaded'}">
        <!-- ARCHIVES HEADER BOX -->
        <header
            id="header"
            class="archives__top-wrapper">
            <div class="archives__header">
                <!-- LOGO OF INSTITUTION -->
                <div class="archives__header-brand">
                    <a
                        href="#{request.contextPath}/"
                        title="{msg.home}">
                        <viewerComponent:themeLogo
                            variant="fullscreen"
                            defaultUrl="images/template/fullscreen_logo.png"
                            darkDefaultUrl="images/template/fullscreen_logo_dark.png"
                            width="300"
                            height="40"
                            alt="#{adminThemesBean.getThemeLabel(configurationBean.name)} Logo" />
                    </a>
                </div>

                <!-- ARCHIVE TITLE -->
                <div class="archives__top-title">
                    <a
                        href="#{request.contextPath}/"
                        title="{msg.home}"
                        target="_self"
                        rel="noopener">
                        #{msg.home}
                    </a>
                    <util:icon icon="chevron-right" />
                    <a
                        href="#{request.contextPath}/archives"
                        target="_self"
                        rel="noopener">
                        #{msg.archives__archiveViewHeading}
                    </a>
                    <util:icon icon="chevron-right" />
                    <h1>
                        <span>
                            #{archiveBean.databaseState == 'ARCHIVES_LOADED' ? msg.archives__title_placeholder :
                            archiveBean.breadcrumbTitle}
                        </span>
                    </h1>
                </div>

                <!-- EXIT -->
                <div class="archives__header-exit">
                    <h:outputLink
                        value="#{request.contextPath}#{navigationHelper.previousViewUrl}"
                        title="#{msg.archives__exit_view}">
                        <ui:include src="/resources/images/icons/icon_fs-exit.svg" />
                        <f:passThroughAttribute
                            name="data-toggle"
                            value="tooltip" />
                        <f:passThroughAttribute
                            name="data-placement"
                            value="bottom" />
                        <f:passThroughAttribute
                            name="aria-label"
                            value="#{msg.archives__exit_view}" />
                    </h:outputLink>
                </div>
            </div>
        </header>

        <!-- ARCHIVES CONTENT -->
        <main
            id="archivesContent"
            class="archives__main">
            <c:choose>
                <!-- ERROR -->
                <c:when test="#{archiveBean.databaseState == 'ERROR_NOT_REACHABLE'}">
                    <div class="archives__error">
                        <span>#{msg.errIndexUnreachableMsg}</span>
                    </div>
                </c:when>

                <!-- ARCHIVE LIST LOADED, NONE SELECTED -->
                <c:when test="#{archiveBean.databaseState == 'ARCHIVES_LOADED'}">
                    <!-- ARCHIVE SELECTION MODAL -->
                    <div
                        class="modal fade archives__modal show arcxhives__select-archive-modal"
                        id="selectArchivesModal"
                        tabindex="-1"
                        role="dialog"
                        aria-hidden="true">
                        <div
                            class="modal-dialog modal-dialog-centered widget-usage__citelinks-box"
                            role="document">
                            <div class="modal-content">
                                <!-- MODAL HEADER/TITLE -->
                                <div class="modal-header">
                                    <h1 class="modal-title">#{msg.archives__archiveViewHeading}</h1>
                                </div>
                                <div class="modal-body">
                                    <!-- MODAL CONTENT -->
                                    <div class="archives__select">
                                        <!-- SELECT BOX ARCHIVE -->
                                        <h:form>
                                            <h:outputLabel for="selectArchivesDropdown">#{msg.archives__choose_database}:</h:outputLabel>
                                            <div class="archives__modal-select-database-dropdown-wrapper">
                                                <h:selectOneMenu
                                                    id="selectArchivesDropdown"
                                                    styleClass="archives__modal-select-database-dropdown"
                                                    value="#{archiveBean.currentResource}">
                                                    <f:selectItem
                                                        itemLabel="#{msg.select}"
                                                        itemValue=""
                                                        noSelectionOption="true" />
                                                    <f:selectItems
                                                        value="#{archiveBean.filteredDatabases}"
                                                        var="database"
                                                        itemValue="#{database.resourceId}"
                                                        itemLabel="#{database.resourceName}" />
                                                </h:selectOneMenu>
                                            </div>
                                            <div class="form-group form-row archives__modal-action">
                                                <div class="col-sm-12 d-flex justify-content-end">
                                                    <button
                                                        jsf:action="pretty:archives1"
                                                        type="submit"
                                                        styleClass="btn btn--full archives__modal-select-database-confirm">
                                                        #{msg.apply}
                                                    </button>
                                                </div>
                                            </div>
                                        </h:form>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="alt-backdrop" />
                    </div>

                    <!-- ARCHIVE SELECTION SCRIPT -->
                    <script>
                        archiveBeanDataBaseState = '#{archiveBean.databaseState}';
                        if (archiveBeanDataBaseState == 'ARCHIVES_LOADED') {
                            console.log('condition yes');
                            $(document).ready(function () {
                                setTimeout(() => {
                                    $('.archives__modal-select-database-dropdown').focus();
                                }, '0');
                            });
                        }
                    </script>
                </c:when>

                <!-- ARCHIVE TREE OR NOT INITIALIZED -->
                <c:otherwise>
                    <ui:insert name="content" />
                </c:otherwise>
            </c:choose>
        </main>

        <!-- USER TERMS MODAL -->
        <viewerComponent:modalUserTerms id="userTermsModal" />

        <!-- HC STICKY INIT FOR ARCHIVES -->
        <script type="text/javascript">
            viewerJS.archives.init({
                initHcSticky: true,
                initSearch: true,
                initTextTree: true,
            });
        </script>
    </div>
</ui:composition>
