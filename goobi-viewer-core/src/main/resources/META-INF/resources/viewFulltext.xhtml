<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/resources/themes/#{navigationHelper.theme}/template.html"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentView('fulltext')}" />
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.dublinCoreMetaTags}" />
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.highwirePressMetaTags}" />
        </f:view>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <!-- RECAPTCHA -->
            <h:panelGroup rendered="#{configurationBean.useReCaptcha}">
                <script
                    src="https://www.google.com/recaptcha/api.js"
                    async="async"
                    defer="defer" />
            </h:panelGroup>

            <!-- RECORD -->
            <ui:fragment rendered="#{!activeDocumentBean.viewManager.recordAccessTicketRequired}">
                <div
                    id="view_fulltext"
                    class="view-fulltext">
                    <!-- TITLE -->
                    <div
                        id="title"
                        class="title">
                        <div class="title__header">
                            <h1 class="h2">
                                <!-- PAGE TYPE -->
                                <span class="title__header-page-type">
                                    <h:outputText
                                        value="#{msg[navigationHelper.currentView]}"
                                        escape="false" />
                                    :
                                </span>

                                <!-- RECORD TITLE -->
                                <span class="title__header-label">#{activeDocumentBean.titleBarLabel}</span>
                            </h1>
                        </div>
                    </div>

                    <!-- IMAGE CONTROLS -->
                    <ui:fragment rendered="#{!activeDocumentBean.viewManager.fulltextFromTEI}">
                        <viewerComponent:imageControls />
                    </ui:fragment>

                    <!-- FULLTEXT -->
                    <h:form
                        id="viewFulltextForm"
                        prependId="false">
                        <div
                            id="view_fulltext_wrapp"
                            class="view-fulltext__wrapper">
                            <ui:include src="/resources/includes/object/fulltext.xhtml" />
                        </div>
                        <div class="clearfix" />

                        <!-- PAGINATOR -->
                        <ui:fragment rendered="#{!activeDocumentBean.viewManager.belowFulltextThreshold}">
                            <viewerComponent:simplePaginator
                                itemCount="#{activeDocumentBean.viewManager.imagesCount}"
                                itemActive="#{activeDocumentBean.viewManager.currentImageOrderForPaginator}"
                                urlPrefix="#{navigationHelper.fulltextUrl}/#{activeDocumentBean.persistentIdentifier}/" />
                        </ui:fragment>
                    </h:form>
                </div>
            </ui:fragment>

            <!-- ACCESS TICKET -->
            <ui:fragment rendered="#{activeDocumentBean.viewManager.recordAccessTicketRequired}">
                <div class="access-ticket-info">
                    <div class="access-ticket-info__inner">
                        <h1>
                            <span class="access-ticket-info__object-title">#{activeDocumentBean.titleBarLabel}</span>
                        </h1>
                        <p>#{msg.access_tickets__record_access_ticket_required}</p>
                        <button
                            class="btn btn--full"
                            data-toggle="modal"
                            data-target="#accessTicketModal">
                            #{msg.action__born_digital__unlock}
                        </button>
                        <viewerComponent:modalAccessTicket />
                    </div>
                </div>
            </ui:fragment>
        </f:view>

        <!-- USER EMAIL -->
        <h:panelGroup rendered="#{userBean.loggedIn}">
            <input
                id="userEmail"
                type="hidden"
                value="#{userBean.user.email}" />
        </h:panelGroup>
    </ui:define>

    <ui:define name="sidebar">
        <!-- SIDEBAR -->
        <ui:fragment rendered="#{!activeDocumentBean.viewManager.recordAccessTicketRequired}">
            <viewerComponent:record_sidebar id="sidebar" />
        </ui:fragment>
    </ui:define>
</ui:composition>
