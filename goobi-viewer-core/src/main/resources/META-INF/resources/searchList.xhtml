<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <!-- USE VIEWACTION, NOT PRERENDERVIEW (IT FIRES ON AJAX POSTBACKS) -->
            <f:viewAction
                onPostback="false"
                action="#{navigationHelper.setCurrentPage('searchlist', false, true)}" />
            <f:viewAction
                onPostback="false"
                action="#{navigationHelper.applySubThemeFromUrl(param['subtheme'])}" />
            <f:event
                type="preRenderView"
                listener="#{searchBean.resetCurrentHitIndex}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <div id="searchList">
                <!-- SEARCH LIST -->
                <div class="search-list">
                    <!-- SEARCH HEADER -->
                    <ui:include src="/resources/includes/search/searchHeader.xhtml">
                        <ui:param
                            name="title"
                            value="#{searchBean.activeSearchType == 0 ? msg.searchResults : msg.searchResultsAdvanced}:" />
                    </ui:include>

                    <!-- SEARCH LIST -->
                    <div class="search-list">
                        <ui:include src="/resources/includes/search/searchHitList.xhtml">
                            <ui:param
                                name="searchParam"
                                value="#{cmsPage.getContentItem('search').functionality}" />
                        </ui:include>
                    </div>
                </div>
            </div>
        </f:view>
    </ui:define>

    <ui:define name="sidebar">
        <!-- OPTIONAL FACETS HEADING -->
        <div class="search-list__facets-heading">
            <h2>#{msg.searchListOptionalHeading}</h2>
        </div>
        <widgetComponent:widget_searchFacets />
    </ui:define>
</ui:composition>
