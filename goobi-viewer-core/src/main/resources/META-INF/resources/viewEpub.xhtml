<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/templateBlankUnstyled.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentView('epub')}" />
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.dublinCoreMetaTags}" />
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.highwirePressMetaTags}" />
            <title>#{msg.viewEpub} - #{adminThemesBean.getThemeLabel(configurationBean.name)}</title>
        </f:view>
    </ui:define>

    <ui:define name="content">
        <!-- RECORD -->
        <ui:fragment rendered="#{!activeDocumentBean.viewManager.recordAccessTicketRequired}">
            <div class="view-epub">
                <!-- CONTROLS -->
                <div class="view-epub__controls-wrapper">
                    <!-- PREVIOUS PAGE -->
                    <button
                        id="prev"
                        class="btn btn--default view-epub__controls-button"
                        title="#{msg.prev_page}"
                        data-toggle="tooltip"
                        data-placement="top"
                        aria-label="#{msg.prev_page}"
                        onclick="rendition.prev()">
                        <util:icon icon="circle-arrow-left" />
                    </button>

                    <!-- NEXT PAGE -->
                    <button
                        id="next"
                        class="btn btn--default view-epub__controls-button"
                        title="#{msg.next_page}"
                        data-toggle="tooltip"
                        data-placement="top"
                        aria-label="#{msg.next_page}"
                        onclick="rendition.next()">
                        <util:icon icon="circle-arrow-right" />
                    </button>
                </div>

                <!-- EPUB CONTAINER -->
                <div
                    class="view-epub__container"
                    id="epubContainer" />
            </div>
        </ui:fragment>

        <!-- ACCESS TICKET -->
        <ui:fragment rendered="#{activeDocumentBean.viewManager.recordAccessTicketRequired}">
            <div class="access-ticket-info">
                <p>#{msg.access_tickets__record_access_ticket_required}</p>
                <button
                    class="btn btn--full"
                    data-toggle="modal"
                    data-target="#accessTicketModal">
                    #{msg.action__born_digital__unlock}
                </button>
                <viewerComponent:modalAccessTicket />
            </div>
        </ui:fragment>

        <!-- EPUB READER -->
        <script>
            var params = URLSearchParams &amp; &amp; new URLSearchParams(document.location.search.substring(1));
            var url = params &amp; &amp; params.get("url") &amp; &amp; decodeURIComponent(params.get("url"));
            var currentSectionIndex = (params &amp; &amp; params.get("loc")) ? params.get("loc") : undefined;

            let epubUrl = new URLSearchParams(location.search).get("url");

            var book = ePub(epubUrl);
            var rendition = book.renderTo("epubContainer", {manager: "continuous",
                flow: "paginated", width: "100%", height: "100%"});
            rendition.display()
            .then(e => {
            })

            rendition.display(currentSectionIndex);

            book.ready.then(() => {
                var next = document.getElementById("next");

                next.addEventListener("click", function(e){
                    book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
                    e.preventDefault();
                }, false);

                var prev = document.getElementById("prev");
                prev.addEventListener("click", function(e){
                    book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
                    e.preventDefault();
                }, false);

                var keyListener = function(e){
                    if ((e.keyCode || e.which) == 37) {
                        book.package.metadata.direction === "rtl" ? rendition.next() : rendition.prev();
                    }

                    if ((e.keyCode || e.which) == 39) {
                        book.package.metadata.direction === "rtl" ? rendition.prev() : rendition.next();
                    }
                };

                rendition.on("keyup", keyListener);
                document.addEventListener("keyup", keyListener, false);
            })

            var title = document.getElementById("title");

            next = book.package.metadata.direction === "rtl" ?  document.getElementById("prev") : document.getElementById("next");
            prev = book.package.metadata.direction === "rtl" ?  document.getElementById("next") : document.getElementById("prev");

            rendition.on("layout", function(layout) {
                let viewer = document.getElementById("viewer");

                if (layout.spread) {
                    viewer.classList.remove('single');
                } else {
                    viewer.classList.add('single');
                }
            });

            window.addEventListener("unload", function () {
                console.log("unloading");
                this.book.destroy();
            });

            viewerJS.helper.initBsFeatures();
        </script>
    </ui:define>
</ui:composition>
