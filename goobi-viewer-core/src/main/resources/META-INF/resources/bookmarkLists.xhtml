<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/resources/themes/#{navigationHelper.theme}/template.html"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <composite:interface />

    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('bookmarks', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_bookmarkLists','bookmarks',1)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="userBookmarkLists"
            class="user-bookmark">
            <h1>#{msg.bookmarkList_bookmarkLists}</h1>

            <ui:fragment rendered="#{!configurationBean.bookmarksEnabled}">
                <div
                    class="alert alert-warning"
                    role="alert">
                    #{msg.errFunctionalityDisabled}
                </div>
            </ui:fragment>

            <!-- PUBLIC BOOKMARK LISTS -->
            <ui:fragment rendered="#{configurationBean.bookmarksEnabled and !bookmarkBean.publicBookmarkLists.isEmpty()}">
                <div class="user-bookmark__section">
                    <div class="user-bookmark__section-head">
                        <h2 class="user-bookmark__section-title">#{msg.bookmarkList_publicBookmarkLists}</h2>
                    </div>
                    <h:form
                        id="pubicBookmarkListsForm"
                        prependId="false">
                        <ui:include src="/resources/includes/bookmarks/sharedBookmarkLists.xhtml">
                            <ui:param
                                name="source"
                                value="#{bookmarkBean.publicBookmarkLists}" />
                        </ui:include>
                    </h:form>
                </div>
            </ui:fragment>
        </div>
    </ui:define>

    <ui:define name="sidebar" />
</ui:composition>
