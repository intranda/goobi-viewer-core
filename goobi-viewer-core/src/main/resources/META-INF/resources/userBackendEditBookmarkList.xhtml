<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('editbookmarklist', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('admin__user_profile', request.contextPath.concat('/user/'), 1)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_bookmarkLists',navigationHelper.applicationUrl.concat('user/bookmarks'),2)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb(bookmarkBean.currentBookmarkList.name, navigationHelper.applicationUrl.concat('user/bookmarks/show/').concat(bookmarkBean.currentBookmarkList.id),3)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_edit',4)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="userBookmarkListEdit"
            class="user-bookmark-edit">
            <ui:fragment rendered="#{userBean.loggedIn and bookmarkBean.currentBookmarkList != null and bookmarkBean.currentBookmarkListMine}">
                <h1>#{msg.bookmarkList_edit}</h1>
                <h:form
                    id="userBookmarkListEditForm"
                    prependId="false">
                    <div class="user-bookmark-edit__panel">
                        <!-- NAME -->
                        <div class="user-bookmark-edit__field">
                            <h:outputLabel
                                for="editBookmarkListName"
                                styleClass="user-bookmark-edit__label"
                                value="#{msg.name}" />
                            <h:inputText
                                id="editBookmarkListName"
                                styleClass="form-control"
                                value="#{bookmarkBean.currentBookmarkList.name}"
                                validator="#{bookmarkBean.validateName}"
                                required="true"
                                requiredMessage="#{msg.bookmarkListNameFailure}" />
                        </div>

                        <!-- DESCRIPTION -->
                        <div class="user-bookmark-edit__field">
                            <h:outputLabel
                                for="editBookmarkListDescription"
                                styleClass="user-bookmark-edit__label"
                                value="#{msg.description}" />
                            <h:inputTextarea
                                id="editBookmarkListDescription"
                                styleClass="form-control"
                                value="#{bookmarkBean.currentBookmarkList.description}" />
                        </div>

                        <!-- PUBLIC -->
                        <div class="user-bookmark-edit__field">
                            <div class="user-bookmark-edit__choice">
                                <h:selectBooleanCheckbox
                                    id="editBookmarkListPublic"
                                    value="#{bookmarkBean.currentBookmarkList.isPublic}" />
                                <h:outputLabel
                                    for="editBookmarkListPublic"
                                    value="#{msg.bookmarkList_public}" />
                            </div>
                        </div>

                        <!-- GROUP SHARES -->
                        <ui:fragment rendered="#{!userBean.user.allUserGroups.isEmpty()}">
                            <div class="user-bookmark-edit__field">
                                <h:outputLabel
                                    for="editBookmarkListGroupShares"
                                    styleClass="user-bookmark-edit__label"
                                    value="#{msg.bookmarkList_groupShares}" />
                                <h:selectManyMenu
                                    id="editBookmarkListGroupShares"
                                    styleClass="form-control"
                                    value="#{bookmarkBean.currentBookmarkList.groupShares}">
                                    <f:selectItems value="#{userBean.user.allUserGroups}" />
                                </h:selectManyMenu>
                            </div>
                        </ui:fragment>

                        <!-- ACTIONS -->
                        <div class="user-bookmark-edit__panel-foot">
                            <h:commandLink
                                id="cancelUserButton"
                                styleClass="btn btn--trans user-bookmark-edit__cancel"
                                value="#{msg.bookmarkList_cancel}"
                                action="userBackendBookmarkLists"
                                immediate="true">
                                <f:setPropertyActionListener
                                    target="#{bookmarkBean.currentBookmarkList}"
                                    value="#{null}" />
                            </h:commandLink>
                            <h:commandButton
                                value="#{msg.save}"
                                action="#{bookmarkBean.saveCurrentBookmarkListAction}"
                                styleClass="btn btn--full" />
                        </div>
                    </div>
                </h:form>
            </ui:fragment>
        </div>
    </ui:define>

    <ui:define name="sidebar" />
</ui:composition>
