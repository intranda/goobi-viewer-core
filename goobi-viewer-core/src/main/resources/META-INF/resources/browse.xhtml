<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPageBrowse(collectionBrowseBean.dcCollection)}" />
            <f:event
                type="preRenderView"
                listener="#{searchBean.resetActiveSearchType}" />
            <f:event
                type="preRenderView"
                listener="#{searchBean.resetSearchFilter}" />
            <f:event
                type="preRenderView"
                listener="#{searchBean.facets.resetSliderRange}" />
            <f:viewAction
                onPostback="false"
                action="#{collectionBrowseBean.initializeCollection(collectionBrowseBean.collectionField)}" />
            <f:viewAction
                onPostback="false"
                action="#{collectionBrowseBean.populateCollection(collectionBrowseBean.collectionField)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div id="browse">
            <h1>#{msg.browseCollectionHeader}</h1>

            <h:panelGroup rendered="#{msg.browseCollectionDescription != 'browseCollectionDescription'}">
                <p>
                    <h:outputText
                        value="#{msg.browseCollectionDescription}"
                        escape="false" />
                </p>
            </h:panelGroup>

            <viewerComponent:collectionView
                id="collection"
                collection="#{collectionBrowseBean.getCollection(collectionBrowseBean.collectionField)}" />
        </div>
    </ui:define>

    <ui:define name="sidebar">
        <h:panelGroup rendered="#{termBrowseBean.browsingMenuEnabled}">
            <widgetComponent:widget_browsing />
        </h:panelGroup>
        <widgetComponent:widget_rssFeed />
    </ui:define>
</ui:composition>
