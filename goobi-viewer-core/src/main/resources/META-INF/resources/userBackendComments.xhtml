<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('userComments', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('admin__user_profile', request.contextPath.concat('/user/'), 1)}" />
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.addStaticLinkToBreadcrumb('userComments', 2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="myActivity"
            class="page-wrapp">
            <h:panelGroup rendered="#{userBean.loggedIn}">
                <h1>#{msg.userComments}</h1>
                <div
                    id="userComments"
                    class="user-backend-comments">
                    <h:form
                        id="userCommentsForm"
                        prependId="false">
                        <!-- COMMENTS -->
                        <div class="data-table">
                            <!-- TOOLBAR -->
                            <div class="data-table__toolbar">
                                <div class="data-table__filter">
                                    <viewerComponent:dataTableColumnFilter
                                        key="admin__comment_search"
                                        filter="#{userDataBean.lazyModelComments.getFilter('targetPI_body_campaign_dateCreated')}" />
                                </div>
                            </div>

                            <!-- TABLE -->
                            <div
                                id="userCommentsTable"
                                class="data-table__table"
                                role="table"
                                aria-label="#{msg.userComments}">
                                <!-- HEADER ROW -->
                                <div
                                    class="data-table__row -head"
                                    role="row">
                                    <viewerComponent:sortingArrow
                                        filterType="targetPI_targetPageOrder"
                                        colHeading="#{msg.record}"
                                        list="#{userDataBean.lazyModelComments}" />
                                    <viewerComponent:sortingArrow
                                        filterType="body"
                                        colHeading="#{msg.Comment}"
                                        list="#{userDataBean.lazyModelComments}" />
                                    <viewerComponent:sortingArrow
                                        filterType="dateCreated"
                                        colHeading="#{msg.date}"
                                        list="#{userDataBean.lazyModelComments}" />
                                </div>

                                <!-- ROWS -->
                                <ui:repeat
                                    var="comment"
                                    value="#{userDataBean.lazyModelComments.paginatorList}">
                                    <div
                                        class="data-table__row"
                                        role="row">
                                        <!-- RECORD -->
                                        <div
                                            class="data-table__cell"
                                            role="cell">
                                            <a
                                                href="#{navigationHelper.objectUrl}#{comment.targetLink}"
                                                target="_blank">
                                                #{comment.targetPI}
                                                <h:outputText
                                                    rendered="#{comment.targetPageOrder != null}"
                                                    value=" · #{msg.page} #{comment.targetPageOrder}" />
                                            </a>
                                        </div>

                                        <!-- COMMENT -->
                                        <div
                                            class="data-table__cell -main"
                                            role="cell">
                                            <!-- DO NOT RENAME THE ID -->
                                            <div
                                                id="annotation_body_#{comment.id}"
                                                class="annotation__body__content_wrapper">
                                                #{contentBean.cleanUpValue(comment.body.toString())}
                                            </div>
                                            <annotationBody
                                                annotationid="#{comment.id}"
                                                contentid="annotation_body_#{comment.id}"
                                                role="presentation" />
                                        </div>

                                        <!-- DATE -->
                                        <div
                                            class="data-table__cell -date"
                                            role="cell">
                                            <h:outputText value="#{comment.dateCreated}">
                                                <f:converter converterId="localDateTimeConverter" />
                                                <f:attribute
                                                    name="pattern"
                                                    value="#{navigationHelper.dateTimePattern}" />
                                            </h:outputText>
                                        </div>
                                    </div>
                                </ui:repeat>
                            </div>

                            <!-- NO COMMENTS -->
                            <ui:fragment rendered="#{userDataBean.lazyModelComments.sizeOfDataList eq 0}">
                                <p class="data-table__empty">#{msg.hitsZero}</p>
                            </ui:fragment>

                            <!-- FOOTER -->
                            <viewerComponent:dataTableFooter tableValues="#{userDataBean.lazyModelComments}" />
                        </div>
                        <script>
                            $(document).ready(() => {
                                riot.mount('annotationBody', {
                                    currentlang: "#{navigationHelper.localeString}",
                                    resturl: "#{configurationBean.restApiUrlV1}",
                                    geomap: {
                                        initialView: {
                                            zoom: #{configurationBean.geomapAnnotationZoom},
                                        },
                                    },
                                });
                            });
                        </script>
                    </h:form>
                </div>
            </h:panelGroup>
        </div>
    </ui:define>

    <ui:define name="sidebar">
        <h:panelGroup rendered="#{termBrowseBean.browsingMenuEnabled}">
            <widgetComponent:widget_browsing />
        </h:panelGroup>
        <c:forEach
            var="module"
            items="#{configurationBean.modules}">
            <c:forEach
                var="contribution"
                items="#{module.sidebarContributions}">
                <ui:include src="/#{contribution}" />
            </c:forEach>
        </c:forEach>
    </ui:define>
</ui:composition>
