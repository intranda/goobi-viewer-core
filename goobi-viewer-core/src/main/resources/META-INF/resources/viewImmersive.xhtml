<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/templateImmersive.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentView('immersive')}" />
            <!-- Without these two listeners (as in viewObject.xhtml) bibliographic
                 metadata and pagination would not be initialised -->
            <f:event
                type="preRenderView"
                listener="#{metadataBean.selectFirstMetadataViewOfLocation('objectview')}" />
            <f:event
                type="preRenderView"
                listener="#{activeDocumentBean.updatePageNavigation(navigationHelper.currentPageType)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.dublinCoreMetaTags}" />
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.highwirePressMetaTags}" />
        </f:view>
    </ui:define>

    <ui:define name="content-immersive">
        <ui:fragment rendered="#{!activeDocumentBean.viewManager.recordAccessTicketRequired}">
            <ui:include src="/resources/includes/immersive/iv_layout.xhtml" />
        </ui:fragment>

        <!-- AP4: access-restricted works show an infobox instead of the viewer.
             Reuses the access-ticket pattern from viewObject.xhtml; the displayed
             text is maintained via the message bundle / customer config. -->
        <ui:fragment rendered="#{activeDocumentBean.viewManager.recordAccessTicketRequired}">
            <div class="access-ticket-info">
                <div class="access-ticket-info__inner">
                    <h1>
                        <span class="access-ticket-info__object-title">#{activeDocumentBean.titleBarLabel}</span>
                    </h1>
                    <p>#{msg.access_tickets__record_access_ticket_required}</p>
                    <button
                        class="btn btn--full"
                        data-toggle="modal"
                        data-target="#accessTicketModal">
                        #{msg.action__born_digital__unlock}
                    </button>
                    <viewerComponent:modalAccessTicket />
                </div>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
