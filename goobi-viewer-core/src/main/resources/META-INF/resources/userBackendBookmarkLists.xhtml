<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:util="http://goobi.io/util"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    template="/resources/themes/#{navigationHelper.theme}/template.html"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('userBookmarkLists', true, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('admin__user_profile', request.contextPath.concat('/user/'), 1)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_bookmarkLists','bookmarks',2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="userBookmarkLists"
            class="user-bookmark">
            <div class="user-bookmark__head">
                <h1>#{msg.bookmarkList_bookmarkLists}</h1>
                <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
                    <button
                        type="button"
                        class="btn btn--default user-bookmark__add-toggle"
                        data-toggle="add-bookmark-list"
                        aria-controls="addBookmarkListPanel"
                        aria-expanded="false">
                        <util:icon-text
                            icon="plus"
                            text="#{msg.bookmarkList_addNewBookmarkList}" />
                    </button>
                </ui:fragment>
            </div>

            <!-- ADD LIST FORM -->
            <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
                <h:form
                    prependId="false"
                    styleClass="user-bookmark__add">
                    <div
                        id="addBookmarkListPanel"
                        class="user-bookmark__add-panel"
                        hidden="hidden">
                        <div class="user-bookmark__add-field">
                            <h:outputLabel
                                for="addBookmarkListInput"
                                styleClass="user-bookmark__add-label"
                                value="#{msg.name}" />
                            <h:inputText
                                id="addBookmarkListInput"
                                styleClass="form-control"
                                value="#{bookmarkBean.newBookmarkListName}"
                                validator="#{bookmarkBean.validateName}"
                                pt:autocomplete="off"
                                pt:data-1p-ignore="true"
                                pt:data-lpignore="true"
                                pt:data-bwignore="true" />
                            <p
                                id="addBookmarkListHint"
                                class="user-bookmark__add-hint">
                                #{msg.bookmarkListNameFailure}
                            </p>
                            <h:messages
                                for="addBookmarkListInput"
                                styleClass="user-bookmark__messages"
                                errorClass="user-bookmark__message -danger" />
                        </div>
                        <div class="user-bookmark__add-foot">
                            <button
                                type="button"
                                class="btn btn--trans user-bookmark__add-cancel"
                                data-close="add-bookmark-list">
                                #{msg.cancel}
                            </button>
                            <h:commandButton
                                id="addBookmarkListBtn"
                                styleClass="btn btn--full"
                                value="#{msg.add}"
                                action="#{bookmarkBean.addBookmarkList}"
                                pt:aria-describedby="addBookmarkListHint" />
                        </div>
                    </div>
                </h:form>
            </ui:fragment>

            <!-- BOOKMARKS DISABLED -->
            <ui:fragment rendered="#{!configurationBean.bookmarksEnabled}">
                <div
                    class="alert alert-warning"
                    role="alert">
                    #{msg.errFunctionalityDisabled}
                </div>
            </ui:fragment>

            <!-- BOOKMARK LISTS -->
            <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
                <!-- MY BOOKMARK LISTS -->
                <ui:fragment rendered="#{bookmarkBean.getBookmarkListsForUser(userBean.user).isEmpty()}">
                    <div class="user-bookmark__empty">
                        <p class="user-bookmark__empty-text">#{msg.bookmarkList_noBookmarkListsWarning}</p>
                    </div>
                </ui:fragment>
                <ui:fragment rendered="#{!bookmarkBean.getBookmarkListsForUser(userBean.user).isEmpty()}">
                    <h:form
                        id="userBookmarkListsForm"
                        prependId="false">
                        <ui:include src="/resources/includes/bookmarks/sharedBookmarkLists.xhtml">
                            <ui:param
                                name="userList"
                                value="true" />
                        </ui:include>
                    </h:form>
                </ui:fragment>

                <!-- SHARED WITH THIS USER -->
                <ui:fragment rendered="#{!bookmarkBean.getBookmarkListsSharedWithUser(userBean.user).isEmpty()}">
                    <div class="user-bookmark__section">
                        <div class="user-bookmark__section-head">
                            <h2 class="user-bookmark__section-title">#{msg.bookmarkList_otherBookmarkLists}</h2>
                        </div>
                        <h:form
                            id="otherBookmarkListsForm"
                            prependId="false">
                            <ui:include src="/resources/includes/bookmarks/sharedBookmarkLists.xhtml">
                                <ui:param
                                    name="source"
                                    value="#{bookmarkBean.getBookmarkListsSharedWithUser(userBean.user)}" />
                                <ui:param
                                    name="hideOwned"
                                    value="true" />
                            </ui:include>
                        </h:form>
                    </div>
                </ui:fragment>

                <!-- PUBLIC BOOKMARK LISTS -->
                <ui:fragment rendered="#{!bookmarkBean.publicBookmarkLists.isEmpty()}">
                    <div class="user-bookmark__section">
                        <div class="user-bookmark__section-head">
                            <h2 class="user-bookmark__section-title">#{msg.bookmarkList_publicBookmarkLists}</h2>
                        </div>
                        <h:form
                            id="pubicBookmarkListsForm"
                            prependId="false">
                            <ui:include src="/resources/includes/bookmarks/sharedBookmarkLists.xhtml">
                                <ui:param
                                    name="source"
                                    value="#{bookmarkBean.publicBookmarkLists}" />
                                <ui:param
                                    name="hideOwned"
                                    value="true" />
                            </ui:include>
                        </h:form>
                    </div>
                </ui:fragment>

                <!-- ADD PANEL -->
                <script>
                    (function () {
                        var panel = document.getElementById('addBookmarkListPanel');
                        var toggle = document.querySelector('[data-toggle="add-bookmark-list"]');
                        if (!panel || !toggle) {
                            return;
                        }
                        var input = document.getElementById('addBookmarkListInput');
                        var submit = document.getElementById('addBookmarkListBtn');

                        var setOpen = function (open) {
                            panel.hidden = !open;
                            toggle.setAttribute('aria-expanded', String(open));
                            if (open) {
                                input.focus();
                            }
                        };
                        toggle.addEventListener('click', function () {
                            setOpen(panel.hidden);
                        });
                        panel.querySelector('[data-close="add-bookmark-list"]').addEventListener('click', function () {
                            setOpen(false);
                            toggle.focus();
                        });
                        panel.addEventListener('keydown', function (event) {
                            if (event.key === 'Escape') {
                                setOpen(false);
                                toggle.focus();
                            }
                        });

                        var hint = document.getElementById('addBookmarkListHint');
                        var syncSubmit = function () {
                            submit.disabled = input.value.trim() === '';
                            hint.hidden = !submit.disabled;
                        };
                        input.addEventListener('input', syncSubmit);
                        syncSubmit();

                        // REOPEN THE PANEL AFTER A FAILED VALIDATION
                        if (panel.querySelector('.user-bookmark__message')) {
                            setOpen(true);
                        }
                    })();
                </script>
            </ui:fragment>
        </div>
    </ui:define>

    <ui:define name="sidebar" />
</ui:composition>
