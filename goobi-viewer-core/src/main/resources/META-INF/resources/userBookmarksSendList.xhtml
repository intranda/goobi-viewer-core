<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    template="/resources/themes/#{navigationHelper.theme}/template.html"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('bookmarkList_session_mail_sendList', true, false)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_bookmarkLists',navigationHelper.applicationUrl.concat(userBean.loggedIn ? 'user/bookmarks' : 'bookmarks'),1)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_session_mail_sendList',2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <div class="user-bookmark-send-list">
                <div class="user-bookmark-send-list__head">
                    <h1>#{msg.bookmarkList_session_mail_heading}</h1>
                    <p class="user-bookmark-send-list__intro">#{msg.bookmarkList_session_mail_text}</p>
                </div>

                <ui:fragment rendered="#{captchaBean.resetSecurityQuestion()}">
                    <h:form
                        id="userBookshelfSendListForm"
                        prependId="false">
                        <div class="user-bookmark-send-list__panel">
                            <!-- EMAIL -->
                            <div class="user-bookmark-send-list__field">
                                <h:outputLabel
                                    for="userEMailToSend"
                                    styleClass="user-bookmark-send-list__label"
                                    value="#{msg.email}" />
                                <h:inputText
                                    id="userEMailToSend"
                                    styleClass="form-control"
                                    value="#{bookmarkBean.sessionBookmarkListEmail}"
                                    required="true"
                                    requiredMessage="#{msg.loginEnterEmail}">
                                    <f:validator validatorId="emailValidator" />
                                </h:inputText>
                                <h:messages
                                    for="userEMailToSend"
                                    styleClass="user-bookmark-send-list__messages"
                                    errorClass="user-bookmark-send-list__message -danger" />
                            </div>

                            <!-- SECURITY QUESTION -->
                            <ui:fragment rendered="#{captchaBean.securityQuestion != null}">
                                <div class="user-bookmark-send-list__field">
                                    <h:outputLabel
                                        for="sendSessionBookmarkListConfirm"
                                        styleClass="user-bookmark-send-list__label"
                                        value="#{msg.user__security_question}" />
                                    <p class="user-bookmark-send-list__question">#{msg[captchaBean.securityQuestion.questionKey]}</p>
                                    <h:inputSecret
                                        id="sendSessionBookmarkListConfirm"
                                        styleClass="form-control"
                                        autocomplete="off"
                                        value="#{captchaBean.securityAnswer}"
                                        required="true"
                                        requiredMessage="#{msg.user__security_question_required_msg}">
                                        <f:passThroughAttribute
                                            name="autocomplete"
                                            value="new-password" />
                                    </h:inputSecret>
                                    <h:messages
                                        for="sendSessionBookmarkListConfirm"
                                        styleClass="user-bookmark-send-list__messages"
                                        errorClass="user-bookmark-send-list__message -danger" />
                                </div>
                            </ui:fragment>

                            <!-- ACTIONS -->
                            <div class="user-bookmark-send-list__panel-foot">
                                <h:commandButton
                                    styleClass="btn btn--full"
                                    value="#{msg.submit}"
                                    action="#{bookmarkBean.sendSessionBookmarkListAsMail}" />
                            </div>
                        </div>
                    </h:form>
                </ui:fragment>
            </div>
        </f:view>
    </ui:define>
</ui:composition>
