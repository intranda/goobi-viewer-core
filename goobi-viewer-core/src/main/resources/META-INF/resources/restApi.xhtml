<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/resources/themes/#{navigationHelper.theme}/templateBlankUnstyled.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('API', false, true)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <!-- KEEP IN THE HEAD, THE BUNDLE TOUCHES BODY ON LOAD -->
        <script
            type="text/javascript"
            src="#{request.contextPath}/resources/javascript/libs/scalar/standalone.js?#{navigationHelper.buildVersion}" />
        <title>API - #{adminThemesBean.getThemeLabel(configurationBean.name)}</title>
    </ui:define>

    <ui:define name="content">
        <!-- REST API STYLES, NO CACHE-BUSTER (HARD RELOAD, 7-DAY MAX-AGE) -->
        <h:outputStylesheet
            library="css"
            name="/misc/rest_api.css" />

        <!-- API REFERENCE -->
        <div id="scalar-api-reference" />

        <!-- API REFERENCE SCRIPT -->
        <script>
            //<![CDATA[
            viewerJS.apiDocs.init('#scalar-api-reference', '#{request.contextPath}', '#{navigationHelper.localeString}');
            //]]>
        </script>
    </ui:define>
</ui:composition>
