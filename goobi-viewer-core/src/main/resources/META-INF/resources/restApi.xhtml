<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/resources/themes/#{navigationHelper.theme}/templateBlankUnstyled.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('API', false, true)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <!-- The Scalar bundle self-initializes on load and touches document.body,
             so it has to stay in the head where body does not exist yet. Do not
             move it to the end of the body or load it with target="body". -->
        <script
            type="text/javascript"
            src="#{request.contextPath}/resources/javascript/libs/scalar/standalone.js?#{navigationHelper.buildVersion}" />
        <title>API - #{adminThemesBean.getThemeLabel(configurationBean.name)}</title>
    </ui:define>

    <ui:define name="content">
        <!-- Must stay h:outputStylesheet, not a plain <link> in ui:define name="head":
             Mojarra's HeadRenderer.encodeEnd calls encodeHeadResources() only after the
             head children are rendered, so this ends up as the last <link> in <head> and
             wins the cascade over viewer.min.css. A plain <link> placed in the head would
             render earlier and silently lose the font-size fix again. Trade-off: unlike
             the versioned Scalar script below, h:outputStylesheet carries no cache-buster
             here, so a recheck after editing rest_api.css needs a hard reload - Mojarra's
             default resource max-age is 7 days. -->
        <h:outputStylesheet
            library="css"
            name="/misc/rest_api.css" />

        <div id="scalar-api-reference" />

        <script>
            //<![CDATA[
            viewerJS.apiDocs.init('#scalar-api-reference', '#{request.contextPath}', '#{navigationHelper.localeString}');
            //]]>
        </script>
    </ui:define>
</ui:composition>
