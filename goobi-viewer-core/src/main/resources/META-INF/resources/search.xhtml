<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam
                name="searchStandardFilter"
                value="#{searchBean.currentSearchFilterString}" />
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('search', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('search',1)}" />
            <f:event
                type="preRenderView"
                listener="#{searchBean.resetSearchParameters}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <f:view
            contentType="text/html"
            encoding="utf-8">
            <div id="searchStandard">
                <h1>#{msg.searchHeader}</h1>

                <!-- SEARCH STANDARD -->
                <ui:include src="/resources/includes/search/searchStandard.xhtml" />
            </div>
        </f:view>
    </ui:define>

    <ui:define name="sidebar">
        <h:panelGroup rendered="#{termBrowseBean.browsingMenuEnabled}">
            <widgetComponent:widget_browsing />
        </h:panelGroup>
        <widgetComponent:widget_rssFeed />
    </ui:define>
</ui:composition>
