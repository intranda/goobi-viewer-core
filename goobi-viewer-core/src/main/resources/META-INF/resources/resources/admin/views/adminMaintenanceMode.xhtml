<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:adminWidget="http://xmlns.jcp.org/jsf/composite/admin/widgets"
    xmlns:viewerForms="http://xmlns.jcp.org/jsf/composite/components/forms"
    template="/resources/themes/#{navigationHelper.theme}/templateAdmin.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPageAdmin('adminMaintenanceMode')}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <h:panelGroup
            id="adminMaintenanceModeView"
            rendered="#{userBean.admin}">
            <h:panelGroup>
                <div class="admin__title-bar">
                    <h1 class="admin__title">#{msg.admin__maintenance_mode__title}</h1>
                </div>
                <viewerComponent:adminBreadcrumbs />
                <div class="admin__content-inner-content">
                    <div
                        id="maintenanceModeActivateWrapper"
                        class="admin__maintenance-edit-wrapper">
                        <h:form
                            id="maintenanceModeActivateForm"
                            prependId="false">
                            <!-- INFO TEXT -->
                            <div class="admin__info-text">
                                <h:outputText
                                    value="#{msg.admin__maintenance_mode__description_text}"
                                    escape="false" />
                            </div>
                            <div class="form-horizontal form-group">
                                <div class="d-flex mb-3 align-items-center">
                                    <div class="control-label mr-3 admin__form-label">#{msg.admin__maintenance_mode_enabled_label}:</div>
                                    <div class="admin__form-input">
                                        <div class="col-9 admin__form-input">
                                            <!-- H:SELECTONERADIO, NOT TOGGLESWITCH (AJAX LISTENER) -->
                                            <!-- NO VALUECHANGELISTENER, IT FIRES BEFORE THE SETTER -->
                                            <div
                                                class="admin__radio-switch"
                                                id="maintenanceModeActivateWrapper">
                                                <h:selectOneRadio
                                                    group="maintenanceModeEnabledToggle"
                                                    value="#{adminBean.maintenanceMode.enabled}"
                                                    disabled="false">
                                                    <f:selectItem
                                                        itemValue="#{false}"
                                                        itemLabel="#{msg.no}" />
                                                    <f:ajax
                                                        render=":messages"
                                                        execute="@this"
                                                        listener="#{adminBean.maintenanceModeToggleChangedListener}" />
                                                    <f:passThroughAttribute
                                                        name="data-toggle-action"
                                                        value="hide" />
                                                    <f:passThroughAttribute
                                                        name="data-toggle-target"
                                                        value="#maintenanceModeEditWrapper" />
                                                </h:selectOneRadio>
                                                <h:selectOneRadio
                                                    group="maintenanceModeEnabledToggle"
                                                    value="#{adminBean.maintenanceMode.enabled}"
                                                    disabled="false">
                                                    <f:selectItem
                                                        itemValue="#{true}"
                                                        itemLabel="#{msg.yes}" />
                                                    <f:ajax
                                                        render=":messages"
                                                        execute="@this"
                                                        listener="#{adminBean.maintenanceModeToggleChangedListener}" />
                                                    <f:passThroughAttribute
                                                        name="data-toggle-action"
                                                        value="show" />
                                                    <f:passThroughAttribute
                                                        name="data-toggle-target"
                                                        value="#maintenanceModeEditWrapper" />
                                                </h:selectOneRadio>
                                                <span class="toggle-outside">
                                                    <span class="toggle-inside" />
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </h:form>
                    </div>
                    <div
                        id="maintenanceModeEditWrapper"
                        class="admin__user-terms-box-editable hide">
                        <div class="form-horizontal form-group">
                            <h:form
                                id="maintenanceModeFormEdit"
                                prependId="true">
                                <div id="maintenanceModeTextWrapper">
                                    <viewerForms:inputFormBlock
                                        title="#{msg.admin__terms_of_use__manage_text}"
                                        languageSelector="#{adminBean.maintenanceMode}">
                                        <viewerForms:htmlInputField
                                            label="#{msg.text}"
                                            value="#{adminBean.maintenanceMode.text}" />
                                    </viewerForms:inputFormBlock>

                                    <!-- FINAL ACTIONS CANCEL + SAVE -->
                                    <div class="admin__final-actions mb-0">
                                        <h:commandLink
                                            id="cancelUpdateMaintenaanceModeButton"
                                            type="submit"
                                            styleClass="btn admin__cancel-button"
                                            value="#{msg.cancel}"
                                            action="pretty:adminMaintenanceMode"
                                            immediate="true" />
                                        <h:commandButton
                                            id="saveAddCampaignButton"
                                            styleClass="btn btn--success"
                                            value="#{msg.button__save}"
                                            action="#{adminBean.saveMaintenanceModeAction}" />
                                    </div>
                                </div>
                            </h:form>
                        </div>
                    </div>
                </div>
            </h:panelGroup>
        </h:panelGroup>
    </ui:define>

    <!-- SIDEBAR -->
    <ui:define name="sidebar">
        <adminWidget:widget_admin />
        <adminWidget:widget_crowdsourcing />
        <adminWidget:widget_cms />
    </ui:define>
</ui:composition>
