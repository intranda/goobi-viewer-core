<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    xmlns:util="http://goobi.io/util"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface />

    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('annotations', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.addStaticLinkToBreadcrumb('campaigns', 'campaigns', 1)}" />
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.addStaticLinkToBreadcrumb('annotations', 2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="myActivity"
            class="campaign-annotations">
            <h1>#{msg.annotations}</h1>
            <div id="campaignAnnotations">
                <h:form
                    id="campaignAnnotationsSongs"
                    prependId="false">
                    <!-- ANNOTATIONS -->
                    <div class="data-table">
                        <!-- TOOLBAR -->
                        <div class="data-table__toolbar">
                            <div class="data-table__filter">
                                <viewerComponent:dataTableColumnFilter
                                    key="admin__crowsourcing_annotations_search"
                                    filter="#{annotationBean.lazyModelAnnotations.getFilter('targetPI_body')}" />
                            </div>
                        </div>

                        <!-- TABLE -->
                        <div
                            id="campaignAnnotationsTable"
                            class="data-table__table"
                            role="table"
                            aria-label="#{msg.annotations}: #{msg.aria_label__table__actions}">
                            <!-- HEADER ROW -->
                            <div
                                class="data-table__row -head"
                                role="row">
                                <viewerComponent:sortingArrow
                                    filterType="targetPI"
                                    colHeading="#{msg.admin__crowdsourcing_annotation}"
                                    list="#{annotationBean.lazyModelAnnotations}" />
                                <viewerComponent:sortingArrow
                                    filterType="creatorId"
                                    colHeading="#{msg.user}"
                                    list="#{annotationBean.lazyModelAnnotations}" />
                                <viewerComponent:sortingArrow
                                    filterType="dateCreated"
                                    colHeading="#{msg.date}"
                                    list="#{annotationBean.lazyModelAnnotations}" />
                                <div
                                    class="data-table__status"
                                    role="columnheader">
                                    #{msg.label__crowdsourcing_review}
                                </div>
                            </div>

                            <!-- ROWS -->
                            <ui:repeat
                                var="annotation"
                                value="#{annotationBean.lazyModelAnnotations.paginatorList}">
                                <div
                                    class="data-table__row"
                                    role="row">
                                    <!-- ANNOTATION -->
                                    <div
                                        class="data-table__cell -main"
                                        role="cell">
                                        <div
                                            id="annotation_body_#{annotation.id}"
                                            class="annotation__body__content_wrapper">
                                            #{contentBean.cleanUpValue(annotation.body.toString())}
                                        </div>
                                        <annotationBody
                                            annotationid="#{annotation.id}"
                                            contentid="annotation_body_#{annotation.id}" />
                                        <a
                                            href="#{navigationHelper.objectUrl}#{annotation.targetLink}"
                                            class="data-table__meta">
                                            #{annotation.targetPI}
                                            <h:outputText
                                                rendered="#{annotation.targetPageOrder != null}"
                                                value=" · #{msg.page} #{annotation.targetPageOrder}" />
                                        </a>
                                    </div>

                                    <!-- USER -->
                                    <div
                                        class="data-table__cell"
                                        role="cell">
                                        <h:outputText value="#{annotation.creator.displayName}" />
                                        <h:panelGroup
                                            layout="block"
                                            styleClass="data-table__meta"
                                            rendered="#{annotation.reviewer != null}">
                                            #{msg.label__crowdsourcing_review}: #{annotation.reviewer.displayName}
                                        </h:panelGroup>
                                    </div>

                                    <!-- DATE -->
                                    <div
                                        class="data-table__cell -date"
                                        role="cell">
                                        <h:outputText value="#{annotation.dateCreated}">
                                            <f:converter converterId="localDateTimeConverter" />
                                            <f:attribute
                                                name="pattern"
                                                value="#{navigationHelper.dateTimePattern}" />
                                        </h:outputText>
                                    </div>

                                    <!-- REVIEW STATE -->
                                    <div
                                        class="data-table__status #{annotation.publicationStatus == 'PUBLISHED' ? '-success' : '-muted'}"
                                        role="cell"
                                        title="#{msg.label__crowdsourcing_review}: #{annotation.publicationStatus == 'PUBLISHED' ? msg.yes : msg.no}">
                                        <span class="sr-only">#{annotation.publicationStatus == 'PUBLISHED' ? msg.yes : msg.no}</span>
                                        <util:icon icon="#{annotation.publicationStatus == 'PUBLISHED' ? 'circle-check' : 'clock'}" />
                                    </div>
                                </div>
                            </ui:repeat>
                        </div>

                        <!-- NO ANNOTATIONS -->
                        <ui:fragment rendered="#{annotationBean.lazyModelAnnotations.sizeOfDataList eq 0}">
                            <p class="data-table__empty">#{msg.hitsZero}</p>
                        </ui:fragment>

                        <!-- FOOTER -->
                        <viewerComponent:dataTableFooter tableValues="#{annotationBean.lazyModelAnnotations}" />
                    </div>
                    <script>
                        $(document).ready(() => {
                            riot.mount('annotationBody', {
                                currentlang: "#{navigationHelper.localeString}",
                                resturl: "#{configurationBean.restApiUrlV1}",
                                geomap: {
                                    initialView: {
                                        zoom: #{configurationBean.geomapAnnotationZoom},
                                    },
                                },
                            });
                        });
                    </script>
                </h:form>
            </div>
        </div>
    </ui:define>

    <ui:define name="sidebar">
        <h:panelGroup rendered="#{termBrowseBean.browsingMenuEnabled}">
            <widgetComponent:widget_browsing />
        </h:panelGroup>
        <c:forEach
            var="module"
            items="#{configurationBean.modules}">
            <c:forEach
                var="contribution"
                items="#{module.sidebarContributions}">
                <ui:include src="/#{contribution}" />
            </c:forEach>
        </c:forEach>
    </ui:define>
</ui:composition>
