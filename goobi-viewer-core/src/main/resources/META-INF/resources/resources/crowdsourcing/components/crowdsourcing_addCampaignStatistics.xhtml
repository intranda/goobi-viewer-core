<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface />

    <composite:implementation>
        <div id="cmsCreatePageMetadataItemWrapper">
            <!-- METADATA ITEM STATUS -->
            <h:panelGroup id="metadata-status">
                <div>
                    <h2>#{msg.admin__crowdsourcing_campaign_statistics}</h2>
                    <dl class="dl-horizontal">
                        <!-- NUMBER OF RECORDS -->
                        <dt>
                            <h:outputText value="#{msg.admin__crowdsourcing_campaign_statistics_numRecords}:" />
                        </dt>
                        <dd>
                            <h:outputText value="#{crowdsourcingBean.selectedCampaign.numRecords}" />
                        </dd>

                        <!-- QUESTIONS -->
                        <dt>
                            <h:outputText value="#{msg.admin__crowdsourcing_campaign_statistics_questionStatusRatio}:" />
                        </dt>
                        <dd>
                            TODO: #{crowdsourcingBean.selectedCampaign.getNumRecordsForStatus('REVIEW')} review /
                            #{crowdsourcingBean.selectedCampaign.getNumRecordsForStatus('FINISHED')} finished /
                            #{crowdsourcingBean.selectedCampaign.numRecords} total
                        </dd>
                        <dt>
                            <h:outputText value="#{msg.admin__crowdsourcing_campaign_statistics_daysLeft}:" />
                        </dt>
                        <dd>
                            <h:outputText value="#{crowdsourcingBean.selectedCampaign.daysLeftAsString}" />
                        </dd>
                    </dl>
                </div>
            </h:panelGroup>
        </div>
    </composite:implementation>
</ui:composition>
