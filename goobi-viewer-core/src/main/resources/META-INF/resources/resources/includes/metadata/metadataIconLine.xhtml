<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <!--
        Single line of metadata configured with an icon (see Metadata#isShowInIconLine), displayed below a regular metadata list.
        Each entry shows the icon and the formatted value; the metadata label is used as tooltip and accessible label.
        Parameter: iconMetadataList - list of non-blank icon line metadata
    -->
    <ui:fragment rendered="#{not empty iconMetadataList}">
        <div class="metadata-icon-line">
            <ui:repeat
                value="#{iconMetadataList}"
                var="iconMetadata">
                <span
                    class="metadata-icon-line__item"
                    data-metadata-field="#{iconMetadata.label}"
                    title="#{msg[iconMetadata.label]}">
                    <util:icon
                        icon="#{iconMetadata.icon}"
                        filled="#{iconMetadata.iconFilled ? 'true' : 'false'}"
                        styleClass="metadata-icon-line__icon"
                        ariaLabel="#{msg[iconMetadata.label]}" />
                    <span class="metadata-icon-line__value">
                        <ui:repeat
                            value="#{iconMetadata.values}"
                            var="val"
                            varStatus="status">
                            <ui:fragment rendered="#{status.index gt 0}">
                                <span class="metadata-icon-line__separator">#{iconMetadata.separator != null ? iconMetadata.separator : ', '}</span>
                            </ui:fragment>
                            <h:outputFormat
                                value="#{val.getDisplayValue(navigationHelper.locale, iconMetadata.group)}"
                                escape="false" />
                        </ui:repeat>
                    </span>
                </span>
            </ui:repeat>
        </div>
    </ui:fragment>
</ui:composition>
