<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:util="http://goobi.io/util">
    <!-- CATALOG HELP LINKS -->
    <ui:fragment rendered="#{archiveBean.archiveConfig != null and not empty archiveBean.archiveConfig.links}">
        <div class="archives__helplinks">
            <h2 class="archives__helplinks-heading">#{msg.archives__card_catalog_help}</h2>
            <ul class="archives__helplinks-list">
                <ui:repeat
                    var="link"
                    value="#{archiveBean.archiveConfig.links}">
                    <li class="archives__helplinks-item">
                        <a
                            class="archives__helplink"
                            href="#{link.href}"
                            target="#{link.isExternal(request.serverName) ? '_blank' : '_self'}"
                            rel="noopener">
                            <util:icon
                                styleClass="archives__helplink-icon"
                                icon="#{link.iconName}" />
                            <span class="archives__helplink-text">
                                <span class="archives__helplink-label">#{not empty link.label.textOrDefault ? link.label.textOrDefault : link.fallbackLabel}</span>
                                <span class="archives__helplink-source">
                                    <ui:fragment rendered="#{link.mail and not empty link.label.textOrDefault}">
                                        <span class="archives__helplink-host">#{link.mailAddress}</span>
                                    </ui:fragment>
                                    <ui:fragment rendered="#{link.isExternal(request.serverName) and not empty link.label.textOrDefault}">
                                        <span class="archives__helplink-host">#{link.host}</span>
                                    </ui:fragment>
                                    <ui:fragment rendered="#{not link.mail and not link.pdf and not link.isExternal(request.serverName)}">
                                        <span class="archives__helplink-host">#{msg.archives__helplink_internal}</span>
                                    </ui:fragment>
                                    <ui:fragment rendered="#{link.pdf}">
                                        <span class="archives__helplink-format">#{msg.archives__helplink_pdf}</span>
                                    </ui:fragment>
                                </span>
                            </span>
                            <ui:fragment rendered="#{link.isExternal(request.serverName)}">
                                <util:icon
                                    styleClass="archives__helplink-external"
                                    icon="external-link" />
                                <span class="sr-only">#{msg.archives__helplink_new_tab}</span>
                            </ui:fragment>
                        </a>
                    </li>
                </ui:repeat>
            </ul>
        </div>
    </ui:fragment>
</ui:composition>
