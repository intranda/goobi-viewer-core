<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <!-- TAGS -->
    <h:panelGroup rendered="#{tagCloudBean.tagsTitles.size() > 0}">
        <h2 class="tag-cloud__heading">#{msg.title}</h2>
        <viewerComponent:tagCloud
            tagMethod="#{tagCloudBean.tagsTitles}"
            ariaLabel="#{msg.title}" />
    </h:panelGroup>

    <!-- PERSONS -->
    <h:panelGroup rendered="#{tagCloudBean.tagsPersons.size() > 0}">
        <h2 class="tag-cloud__heading">#{msg.persons}</h2>
        <viewerComponent:tagCloud
            tagMethod="#{tagCloudBean.tagsPersons}"
            ariaLabel="#{msg.persons}" />
    </h:panelGroup>

    <!-- PLACES -->
    <h:panelGroup rendered="#{tagCloudBean.tagsPlaces.size() > 0}">
        <h2 class="tag-cloud__heading">#{msg.places}</h2>
        <viewerComponent:tagCloud
            tagMethod="#{tagCloudBean.tagsPlaces}"
            ariaLabel="#{msg.places}" />
    </h:panelGroup>

    <!-- YEARS -->
    <h:panelGroup rendered="#{tagCloudBean.tagsYears.size() > 0}">
        <h2 class="tag-cloud__heading">#{msg.years}</h2>
        <viewerComponent:tagCloud
            tagMethod="#{tagCloudBean.tagsYears}"
            ariaLabel="#{msg.years}" />
    </h:panelGroup>
</ui:composition>
