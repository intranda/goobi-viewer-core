<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <div
        class="overlay overlay-plain"
        role="region">
        <button
            type="button"
            class="close"
            aria-label="#{msg.overlay__close}"
            data-overlay-action="dismiss">
            <util:icon
                icon="x"
                data-overlay-action="dismiss"
                styleClass="overlay__close-icon" />
        </button>
    </div>

    <!-- OVERLAY MODAL -->
    <div
        id="overlayModal"
        class="overlay overlay-modal modal"
        aria-modal="true"
        role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3
                        class="modal-title"
                        data-overlay-area="header" />
                    <button
                        type="button"
                        class="close"
                        aria-label="#{msg.overlay__close}"
                        data-overlay-action="dismiss">
                        <util:icon
                            icon="x"
                            data-overlay-action="dismiss"
                            styleClass="overlay__close-icon" />
                    </button>
                </div>
                <div
                    class="modal-body"
                    data-overlay-area="body" />
                <div
                    class="modal-footer"
                    data-overlay-area="footer" />
            </div>
        </div>
    </div>
</ui:composition>
