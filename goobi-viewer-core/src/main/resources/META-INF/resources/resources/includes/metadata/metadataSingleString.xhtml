<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions">
    <div class="metadata__elements">
        <div class="metadata__element-wrapper-single">
            <div class="metadata__element-level-#{metadata.indentation}">
                <dl class="dl-horizontal metadata__element-dl">
                    <dt data-metadata="#{metadata.label}">
                        <h:outputText
                            value="#{msg[metadata.label]}:"
                            escape="false" />
                    </dt>

                    <!-- STANDARD STRUCTURE -->
                    <ui:fragment rendered="#{metadata.separator == null}">
                        <!-- USE C:FOREACH, NOT UI:REPEAT -->
                        <c:forEach
                            items="#{metadata.values}"
                            var="val">
                            <dd>
                                <!-- METADATA VALUE -->
                                <h:panelGroup rendered="#{metadata.singleString}">
                                    <ui:fragment rendered="#{val.accessRestricted}">
                                        <span
                                            class="metadata__locked-value-icon"
                                            data-toggle="tooltip"
                                            title="#{msg.metadata__restricted_value_tooltip}">
                                            <util:icon icon="lock-open-2" />
                                        </span>
                                    </ui:fragment>
                                    <h:outputFormat
                                        value="#{val.getDisplayValue(navigationHelper.locale, true)}"
                                        escape="false" />
                                </h:panelGroup>

                                <!-- CHILD METADATA -->
                                <c:forEach
                                    var="child"
                                    items="#{val.childMetadata}">
                                    <ui:fragment rendered="#{!child.isBlank(val.iddoc)}">
                                        <ui:fragment rendered="#{child.singleString}">
                                            <ui:include src="/resources/includes/metadata/metadataSingleString.xhtml">
                                                <ui:param
                                                    name="metadata"
                                                    value="#{child}" />
                                            </ui:include>
                                        </ui:fragment>
                                        <ui:fragment rendered="#{!child.singleString}">
                                            <ui:include src="/resources/includes/metadata/metadataKeyValuePairs.xhtml">
                                                <ui:param
                                                    name="metadata"
                                                    value="#{child}" />
                                            </ui:include>
                                        </ui:fragment>
                                    </ui:fragment>
                                </c:forEach>
                            </dd>
                        </c:forEach>
                    </ui:fragment>

                    <!-- STANDARD WITH SEPARATOR -->
                    <ui:fragment rendered="#{metadata.separator != null}">
                        <dd>
                            <c:forEach
                                items="#{metadata.values}"
                                var="val">
                                <span class="metadata__element-wrapper-single-custom">
                                    <!-- METADATA VALUE -->
                                    <h:panelGroup rendered="#{metadata.singleString}">
                                        <h:outputFormat
                                            value="#{val.getDisplayValue(navigationHelper.locale, true)}"
                                            escape="false" />
                                        <span class="metadata__element-wrapper-single-custom-separator">#{metadata.separator}</span>
                                    </h:panelGroup>

                                    <!-- CHILD METADATA -->
                                    <c:forEach
                                        var="child"
                                        items="#{val.childMetadata}">
                                        <ui:fragment rendered="#{!child.isBlank(val.iddoc)}">
                                            <ui:fragment rendered="#{child.singleString}">
                                                <ui:include src="/resources/includes/metadata/metadataSingleString.xhtml">
                                                    <ui:param
                                                        name="metadata"
                                                        value="#{child}" />
                                                </ui:include>
                                            </ui:fragment>
                                            <ui:fragment rendered="#{!child.singleString}">
                                                <ui:include src="/resources/includes/metadata/metadataKeyValuePairs.xhtml">
                                                    <ui:param
                                                        name="metadata"
                                                        value="#{child}" />
                                                </ui:include>
                                            </ui:fragment>
                                        </ui:fragment>
                                    </c:forEach>
                                </span>
                            </c:forEach>
                        </dd>
                    </ui:fragment>
                </dl>
            </div>
        </div>
    </div>
</ui:composition>
