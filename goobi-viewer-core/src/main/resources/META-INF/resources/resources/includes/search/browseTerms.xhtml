<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <ui:param
        name="termList"
        value="#{termList != null ? termList : termBrowseBean.browseTermListEscaped}" />
    <ui:param
        name="baseUrl"
        value="#{baseUrl != null ? baseUrl : navigationHelper.termUrl.concat('/').concat(termBrowseBean.browsingMenuField).concat('/').concat(termBrowseBean.filterQuery).concat('/')}" />

    <ui:fragment rendered="#{!termBrowseBean.browsingMenuFieldTranslated}">
        <viewerComponent:alphabeticPaginator baseUrl="#{baseUrl}" />
    </ui:fragment>

    <!-- LIST -->
    <nav
        id="search_termlistnav"
        class="search-termlist__list"
        role="navigation">
        <ul>
            <c:forEach
                items="#{termList}"
                var="term"
                varStatus="status">
                <!-- newSearch5 pattern link -->
                <li>
                    <h:outputLink
                        value="#{navigationHelper.termUrl}/-/#{termBrowseBean.getBrowsingMenuFieldForLanguage(navigationHelper.localeString)}%3A%22#{term}%22/1/-/#{termBrowseBean.filterQuery}/#{navigationHelper.subThemeQueryParam}"
                        title="#{termBrowseBean.browseTermList[status.count-1]}">
                        <h:outputText
                            value="#{termBrowseBean.browseTermList[status.count-1]}"
                            escape="true" />
                        <span>(#{termBrowseBean.browseTermHitCountList[status.count-1]})</span>
                    </h:outputLink>
                </li>
            </c:forEach>
        </ul>
    </nav>

    <div class="clearfix" />

    <viewerComponent:simplePaginator
        itemCount="#{termBrowseBean.lastPage}"
        itemActive="#{termBrowseBean.currentPage}"
        urlPrefix="#{baseUrl}#{termBrowseBean.currentStringFilter}/" />
</ui:composition>
