<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:fragment rendered="#{activeDocumentBean.recordLoaded}">
        <meta
            property="og:type"
            content="website" />
        <meta
            property="og:url"
            content="#{navigationHelper.currentUrl}" />
        <meta
            property="og:image"
            content="#{activeDocumentBean.viewManager.currentPage.getImageUrl(750)}" />
        <meta
            property="og:title"
            content="#{activeDocumentBean.viewManager.currentStructElement.label}" />
        <meta
            property="og:description"
            content="#{activeDocumentBean.titleBarLabel}" />
        <meta
            property="og:site_name"
            content="#{adminThemesBean.getThemeLabel(configurationBean.name)}" />
    </ui:fragment>
</ui:composition>
