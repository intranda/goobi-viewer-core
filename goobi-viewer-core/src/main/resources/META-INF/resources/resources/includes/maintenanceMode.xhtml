<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <!-- MAINTENANCE BANNER -->
    <!-- ONLY RENDER IF ACTIVATED -->
    <ui:fragment rendered="#{adminBean.maintenanceMode.enabled}">
        <div
            id="maintenanceModeBanner"
            class="maintenance-banner">
            <div
                id="maintenanceModeBanner"
                class="maintenance-banner__outer">
                <div class="container">
                    <div class="maintenance-banner__wrapper">
                        <util:icon
                            icon="coffee"
                            styleClass="maintenance-banner__icon"
                            svgClass="icon icon-xxxl" />
                        <h:panelGroup
                            styleClass="maintenance-banner__text"
                            layout="block">
                            <h:outputText
                                escape="false"
                                value="#{adminBean.maintenanceMode.getTextOrDefault(navigationHelper.localeString)}" />
                        </h:panelGroup>
                        <button
                            type="button"
                            class="fancy-close maintenance-banner__close-button"
                            data-dismiss="modal"
                            aria-label="#{msg.maintenance_mode__close_banner}"
                            data-trigger="closeMaintenanceInfo" />
                    </div>
                </div>
            </div>
        </div>
        <script>viewerJS.maintenanceMode.init();</script>
    </ui:fragment>
</ui:composition>
