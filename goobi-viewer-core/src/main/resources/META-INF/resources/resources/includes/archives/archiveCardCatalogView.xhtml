<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <!-- CARD CATALOG -->
    <div class="archives-cardcatalog__wrapper">
        <!-- LEFT SIDEBAR -->
        <aside class="archives-cardcatalog__sidebar archives-cardcatalog__sidebar--left">
            <div
                class="archives-cardcatalog__counts"
                data-cc="counts" />
            <h2 class="archives-cardcatalog__sidebar-heading">#{msg.archives__card_catalog_drawers}</h2>
            <div
                class="archives-cardcatalog__drawers"
                data-cc="drawers" />
        </aside>

        <!-- CONTENT: FULL VIEW -->
        <main class="archives-cardcatalog__content">
            <div
                class="archives-cardcatalog__content-body"
                data-cc="content">
                <div class="archives-cardcatalog__loader" />
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="archives-cardcatalog__sidebar archives-cardcatalog__sidebar--right">
            <div
                class="archives-cardcatalog__register"
                data-cc="register" />

            <ui:fragment rendered="#{archiveBean.archiveConfig != null and not empty archiveBean.archiveConfig.links}">
                <div class="archives-cardcatalog__helplinks">
                    <h2 class="archives-cardcatalog__sidebar-heading">#{msg.archives__card_catalog_help}</h2>
                    <ui:repeat
                        var="link"
                        value="#{archiveBean.archiveConfig.links}">
                        <a
                            class="archives-cardcatalog__helplink"
                            href="#{link.url}">
                            #{link.label.textOrDefault}
                        </a>
                    </ui:repeat>
                </div>
            </ui:fragment>
        </aside>
    </div>

    <script>
        viewerJS.cardCatalog.init({
            pi: "#{archiveBean.currentResource}",
            apiUrl: "#{request.contextPath}/api/v1",
            osdScriptUrl: "#{request.contextPath}/resources/javascript/libs/openseadragon/openseadragon.min.js",
            msg: #{navigationHelper.getTranslationsAsJson(
                    ["archives__card_catalog_total", "archives__card_catalog_search_area", "archives__card_catalog_interval",
                    "archives__card_catalog_cards", "archives__card_catalog_card", "archives__card_catalog_of",
                    "archives__card_catalog_zoom_mode", "archives__card_catalog_zoom_hint", "archives__card_catalog_zoom_in",
                    "archives__card_catalog_full_view", "archives__card_catalog_register", "archives__card_catalog_choose_drawer",
                    "archives__card_catalog_no_image", "archives__open_record", "previous", "next",
                    "archives__card_catalog_error"])}
        });
    </script>
</ui:composition>
