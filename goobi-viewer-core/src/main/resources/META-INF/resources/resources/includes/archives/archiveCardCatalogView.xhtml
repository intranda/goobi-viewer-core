<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <!-- CARD CATALOG -->
    <div class="archives-cardcatalog__wrapper">
        <!-- LEFT SIDEBAR -->
        <aside class="archives-cardcatalog__sidebar">
            <div class="archives-cardcatalog__sidebar-body">
                <div
                    class="archives-cardcatalog__drawers"
                    data-cc="drawers" />
            </div>
        </aside>

        <!-- CONTENT: FULL VIEW -->
        <div class="archives-cardcatalog__content">
            <div
                class="archives-cardcatalog__content-body"
                data-cc="content">
                <div class="archives-cardcatalog__loader" />
            </div>
        </div>

        <!-- RIGHT SIDEBAR -->
        <aside class="archives-cardcatalog__sidebar archives-cardcatalog__sidebar--right">
            <div class="archives-cardcatalog__sidebar-body">
                <div
                    class="archives-cardcatalog__orientation"
                    data-cc="orientation" />
                <div
                    class="archives-cardcatalog__register"
                    data-cc="register" />
                <div
                    class="archives-cardcatalog__guide"
                    data-cc="guide" />

                <!-- WORK NOTES -->
                <div data-cc="notes">
                    <widgetComponent:widget_recordNotes
                        notes="#{cmsRecordNotesBean.getNotesForRecord(archiveBean.currentResource)}"
                        variables="client"
                        editLink="false" />
                </div>

                <!-- ADMIN ACTIONS -->
                <widgetComponent:widget_archivesInteractions />
            </div>
        </aside>
    </div>

    <script>
        viewerJS.cardCatalog.init(#{archiveBean.getCardCatalogBootstrapJson(request.contextPath,
            navigationHelper.getTranslations(
                    ["archives__card_catalog_cards", "archives__card_catalog_card",
                    "archives__card_catalog_of", "archives__card_catalog_zoom_mode", "archives__card_catalog_zoom_in",
                    "archives__card_catalog_full_view", "archives__card_catalog_register", "archives__card_catalog_choose_drawer",
                    "archives__card_catalog_no_image", "archives__open_record", "previous", "next", "archives__card_catalog_error",
                    "archives__card_catalog_loading", "archives__card_catalog_load_more_error", "archives__card_catalog_retry",
                    "archives__card_catalog_back", "archives__card_catalog_path_level",
                    "archives__card_catalog_location", "archives__card_catalog_drawer", "archives__card_catalog_show_full_cards",
                    "archives__card_catalog_complete_cards", "archives__card_catalog_previous_drawer",
                    "archives__card_catalog_next_drawer", "archives__card_catalog_view_card",
                    "archives__card_catalog_letters", "archives__card_catalog_front_side",
                    "archives__card_catalog_back_side", "archives__card_catalog_guide",
                    "archives__card_catalog_guide_zoom",
                    "archives__card_catalog_guide_zoom_text", "archives__card_catalog_guide_zoom_steps",
                    "archives__card_catalog_guide_zoom_steps_one", "archives__card_catalog_guide_register",
                    "archives__card_catalog_guide_read", "archives__card_catalog_guide_read_text",
                    "archives__card_catalog_guide_record", "fullscreen_enter",
                    "fullscreen_exit", "archives__volume_catalog_cards", "archives__volume_catalog_card",
                    "archives__volume_catalog_error", "archives__volume_catalog_loading",
                    "archives__volume_catalog_load_more_error", "archives__volume_catalog_show_full_cards",
                    "archives__volume_catalog_complete_cards", "archives__volume_catalog_view_card",
                    "archives__volume_catalog_guide_zoom_text", "archives__volume_catalog_guide_zoom_steps",
                    "archives__volume_catalog_guide_zoom_steps_one", "archives__volume_catalog_guide_read",
                    "archives__volume_catalog_guide_record"]))});
    </script>
</ui:composition>
