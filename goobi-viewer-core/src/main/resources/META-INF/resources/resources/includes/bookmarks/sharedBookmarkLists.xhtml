<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
    <ui:param
        name="hideOwned"
        value="#{hideOwned != null ? hideOwned : false}" />
    <ui:param
        name="userList"
        value="#{userList != null ? userList : false}" />
    <ui:param
        name="bookmarkLists"
        value="#{userList ? bookmarkBean.getBookmarkListsForUser(userBean.user) : source }" />

    <ui:fragment rendered="#{bookmarkLists != null}">
        <ui:repeat
            value="#{bookmarkLists}"
            var="bookmarkList"
            varStatus="status">
            <ui:param
                name="owned"
                value="#{bookmarkList.isOwnedBy(userBean.user)}" />
            <ui:param
                name="listLink"
                value="#{userList ? request.contextPath.concat('/user/bookmarks/show/').concat(bookmarkList.id).concat('/') : bookmarkBean.getShareLink(bookmarkList)}" />

            <ui:fragment rendered="#{!(hideOwned and owned)}">
                <article class="user-bookmark__panel">
                    <!-- HEAD -->
                    <div class="user-bookmark__panel-head">
                        <h3 class="user-bookmark__panel-title">
                            <a href="#{listLink}">#{bookmarkList.name}</a>
                        </h3>

                        <h:panelGroup
                            id="isPublicMarker"
                            rendered="#{userList}"
                            styleClass="user-bookmark__panel-badge">
                            <ui:fragment rendered="#{bookmarkList.isPublic}">
                                <span
                                    title="#{msg.bookmarkList_public}"
                                    data-toggle="tooltip"
                                    data-placement="bottom">
                                    <util:icon icon="lock-open-2" />
                                </span>
                            </ui:fragment>
                            <ui:fragment rendered="#{!bookmarkList.isPublic and bookmarkList.hasShareKey()}">
                                <span
                                    title="#{msg.bookmarkList_shared}"
                                    data-toggle="tooltip"
                                    data-placement="bottom">
                                    <util:icon icon="share" />
                                </span>
                            </ui:fragment>
                        </h:panelGroup>

                        <p class="user-bookmark__panel-meta">
                            #{bookmarkList.items.size()}
                            #{bookmarkList.items.size() == 1 ? msg.bookmarkList_object : msg.bookmarkList_objects}
                            <ui:fragment rendered="#{!owned}">
                                &#183; #{navigationHelper.getTranslationWithParams(msg.bookmarks__shared_by, bookmarkList.owner.displayName)}
                            </ui:fragment>
                        </p>

                        <ui:fragment rendered="#{bookmarkList.hasDescription()}">
                            <p class="user-bookmark__panel-intro">#{bookmarkList.description}</p>
                        </ui:fragment>
                    </div>

                    <!-- PREVIEW -->
                    <ui:fragment rendered="#{bookmarkList.items.size() gt bookmarkList.numItemsWithoutImages()}">
                        <div class="user-bookmark__items-image-preview">
                            <ui:repeat
                                value="#{bookmarkList.items}"
                                var="item">
                                <ui:fragment rendered="#{item.hasImages}">
                                    <div
                                        class="user-bookmark__single-image"
                                        style="background-image: url('#{item.getRepresentativeImageUrl(240,400)}')">
                                        <a
                                            href="#{request.contextPath}#{item.url}"
                                            title="#{item.name}"
                                            data-toggle="tooltip"
                                            data-placement="bottom"
                                            aria-label="#{item.name}" />
                                    </div>
                                </ui:fragment>
                            </ui:repeat>
                        </div>

                        <ui:fragment rendered="#{bookmarkList.numItemsWithoutImages() gt 0}">
                            <div class="user-bookmark__link-more-items">
                                <a href="#{listLink}">
                                    <h:outputFormat
                                        value="#{bookmarkList.numItemsWithoutImages() gt 1 ? msg.bookmarkList__further_items : msg.bookmarkList__further_item}"
                                        escape="false">
                                        <f:param value="#{bookmarkList.numItemsWithoutImages()}" />
                                    </h:outputFormat>
                                </a>
                            </div>
                        </ui:fragment>
                    </ui:fragment>

                    <!-- ACTIONS -->
                    <div class="user-bookmark__panel-foot">
                        <ui:fragment rendered="#{userList}">
                            <ui:fragment rendered="#{bookmarkList.items.size() gt bookmarkList.numItemsWithoutImages()}">
                                <a
                                    data-toggle="tooltip"
                                    title="#{msg.bookmarkList_openMirador}"
                                    href="#{request.contextPath}/mirador/id/#{bookmarkList.id}"
                                    class="view-mirador__link"
                                    target="_blank"
                                    rel="noopener"
                                    aria-label="#{bookmarkList.name}: #{msg.viewMiradorComparison}">
                                    <util:icon-text
                                        icon="grid-dots"
                                        text="#{msg.viewMiradorComparison}" />
                                </a>
                            </ui:fragment>

                            <a
                                data-toggle="tooltip"
                                title="#{msg.action__search_in_bookmarks__description}"
                                href="#{request.contextPath}/user/bookmarks/search/#{bookmarkList.escapedName}/"
                                aria-label="#{bookmarkList.name}: #{msg.search}">
                                <util:icon-text
                                    icon="search"
                                    text="#{msg.search}" />
                            </a>

                            <button
                                type="button"
                                data-popover-element="#sharePopover_#{status.index}"
                                data-popover-placement="bottom"
                                data-popover-title=""
                                data-popover-dismiss="click-outside"
                                class="share-bookmarkList">
                                <util:icon-text
                                    icon="share"
                                    text="#{msg.action__share}" />
                            </button>

                            <div
                                id="sharePopover_#{status.index}"
                                class="viewerPopover user-bookmark__panel-share-popover">
                                <h:panelGroup id="editBookmarkListPublicWrapper">
                                    <ui:fragment rendered="#{!bookmarkList.isPublic}">
                                        <h:commandLink action="#{bookmarkBean.setPublic(bookmarkList, true)}">
                                            <util:icon-text
                                                icon="square"
                                                text="#{msg.option__share_bookmarklist}" />
                                            <f:ajax
                                                execute="@this"
                                                render="editBookmarkListPublicWrapper isPublicMarker" />
                                        </h:commandLink>
                                    </ui:fragment>
                                    <ui:fragment rendered="#{bookmarkList.isPublic}">
                                        <h:commandLink action="#{bookmarkBean.setPublic(bookmarkList, false)}">
                                            <util:icon-text
                                                icon="checkbox"
                                                text="#{msg.option__share_bookmarklist}" />
                                            <f:ajax
                                                execute="@this"
                                                render="editBookmarkListPublicWrapper isPublicMarker" />
                                        </h:commandLink>
                                    </ui:fragment>

                                    <ui:fragment rendered="#{!bookmarkList.hasShareKey()}">
                                        <h:commandLink action="#{bookmarkBean.getShareLink(bookmarkList)}">
                                            <util:icon-text
                                                icon="share"
                                                text="#{msg.action__create_bookmarklist_sharelink}" />
                                            <f:ajax
                                                execute="@this"
                                                render="editBookmarkListPublicWrapper isPublicMarker" />
                                        </h:commandLink>
                                    </ui:fragment>

                                    <ui:fragment rendered="#{bookmarkList.hasShareKey()}">
                                        <button
                                            type="button"
                                            class="btn btn--clean"
                                            title="#{msg.copyUrl}"
                                            data-copy-value="#{bookmarkList.getIIIFCollectionURI()}"
                                            data-copy-done-msg="#{msg.copyUrlDone}">
                                            <util:icon-text
                                                icon="share-3"
                                                text="#{msg.bookmarkList_shareCollection}" />
                                        </button>
                                        <button
                                            type="button"
                                            class="btn btn--clean"
                                            title="#{msg.copyUrl}"
                                            data-copy-value="#{bookmarkBean.getShareLink(bookmarkList)}"
                                            data-copy-done-msg="#{msg.copyUrlDone}">
                                            <util:icon-text
                                                icon="share"
                                                text="#{msg.action__copy_bookmarklist_sharelink}" />
                                        </button>
                                        <h:commandLink
                                            rendered="#{!bookmarkList.isPublic}"
                                            action="#{bookmarkBean.resetShareLink(bookmarkList)}">
                                            <util:icon-text
                                                icon="trash"
                                                text="#{msg.action__delete_bookmarklist_sharelink}" />
                                            <f:ajax
                                                execute="@this"
                                                render="editBookmarkListPublicWrapper isPublicMarker" />
                                        </h:commandLink>
                                    </ui:fragment>
                                </h:panelGroup>
                            </div>

                            <h:commandLink action="#{bookmarkBean.editBookmarkListAction(bookmarkList)}">
                                <util:icon-text
                                    icon="edit"
                                    text="#{msg.edit}" />
                            </h:commandLink>
                        </ui:fragment>

                        <ui:fragment rendered="#{!userList}">
                            <ui:fragment rendered="#{bookmarkList.items.size() gt bookmarkList.numItemsWithoutImages()}">
                                <a
                                    data-toggle="tooltip"
                                    title="#{msg.bookmarkList_openMirador}"
                                    href="#{request.contextPath}/mirador/key/#{bookmarkList.shareKey}"
                                    class="view-mirador__link"
                                    target="_blank"
                                    rel="noopener"
                                    aria-label="#{bookmarkList.name}: #{msg.viewMiradorComparison}">
                                    <util:icon-text
                                        icon="grid-dots"
                                        text="#{msg.viewMiradorComparison}" />
                                </a>
                            </ui:fragment>
                            <a
                                data-toggle="tooltip"
                                title="#{msg.action__search_in_bookmarks__description}"
                                href="#{request.contextPath}/bookmarks/search/key/#{bookmarkList.shareKey}"
                                aria-label="#{bookmarkList.name}: #{msg.search}">
                                <util:icon-text
                                    icon="search"
                                    text="#{msg.search}" />
                            </a>

                            <button
                                type="button"
                                class="btn btn--link"
                                title="#{msg.copyUrl}"
                                data-copy-value="#{bookmarkList.getIIIFCollectionURI()}"
                                data-copy-done-msg="#{msg.copyUrlDone}"
                                aria-label="#{bookmarkList.name}: #{msg.bookmarkList_shareCollection}">
                                <util:icon-text
                                    icon="share-3"
                                    text="#{msg.bookmarkList_shareCollection}" />
                            </button>
                            <button
                                type="button"
                                class="btn btn--link"
                                title="#{msg.copyUrl}"
                                data-copy-value="#{bookmarkBean.getShareLink(bookmarkList)}"
                                data-copy-done-msg="#{msg.copyUrlDone}"
                                aria-label="#{bookmarkList.name}: #{msg.action__copy_bookmarklist_sharelink}">
                                <util:icon-text
                                    icon="share"
                                    text="#{msg.action__copy_bookmarklist_sharelink}" />
                            </button>
                        </ui:fragment>
                    </div>
                </article>
            </ui:fragment>
        </ui:repeat>

        <script>viewerJS.clipboard.init();</script>
    </ui:fragment>
</ui:composition>
