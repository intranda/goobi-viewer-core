<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <div id="externalResourceDownload" />
    <script>
        riot.mount('#externalResourceDownload', 'external-resource-download', {
            urls: #{activeDocumentBean.viewManager.externalResourceUrlsAsJson},
            contextPath: "#{request.contextPath}",
            pi: "#{activeDocumentBean.viewManager.pi}",
            msg: {
                downloadButton: "#{msg.downloadButton}",
                cancel: "#{msg.cancel}",
                action__external_files__download_in_queue: "#{msg.action__external_files__download_in_queue}",
                label__born_digital__filename: "#{msg.label__born_digital__filename}",
                label__born_digital__filedescription: "#{msg.label__born_digital__filedescription}",
                label__born_digital__filesize: "#{msg.label__born_digital__filesize}",
                label__born_digital__fileformat: "#{msg.label__born_digital__fileformat}",
                action__born_digital__download: "#{msg.action__born_digital__download}",
                label__born_digital__downloading: "#{msg.label__born_digital__downloading}",
                'application/pdf': "#{msg['application/pdf']}",
                'application/epub+zip': "#{msg['application/epub+zip']}",
                'image/tiff': "#{msg['image/tiff']}",
                'image/jpeg': "#{msg['image/jpeg']}",
                'image/png': "#{msg['image/png']}",
            },
        });
    </script>
</ui:composition>
