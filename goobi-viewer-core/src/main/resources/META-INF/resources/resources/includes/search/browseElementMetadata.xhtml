<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions">
    <ui:param
        name="browseElement"
        value="#{browseElement != null ? browseElement : null}" />

    <!-- STANDARD METADATA LIST IN SEARCH LIST (FIRST) -->
    <dl class="search-list__hit-metadata-first search-list__hit-metadata-list">
        <ui:repeat
            value="#{browseElement.metadataListForCurrentLocale}"
            var="browseElementMetadata">
            <ui:fragment rendered="#{!browseElementMetadata.blank}">
                <!-- METADATA LABEL -->
                <dt
                    data-metadata-field="#{browseElementMetadata.label}"
                    title="#{browseElementMetadata.label}"
                    class="search-list__hit-text-label">
                    #{msg[browseElementMetadata.label]}:
                </dt>

                <!-- GROUPED VALUES -->
                <ui:fragment rendered="#{browseElementMetadata.group}">
                    <!-- SINGLE STRING -->
                    <ui:fragment rendered="#{browseElementMetadata.singleString}">
                        <!-- STANDARD STRUCTURE -->
                        <ui:fragment rendered="#{browseElementMetadata.separator == null}">
                            <ui:repeat
                                value="#{browseElementMetadata.values}"
                                var="val">
                                <!-- METADATA VALUE -->
                                <dd class="search-list__hit-text-value">
                                    <ui:fragment rendered="#{browseElementMetadata.singleString}">
                                        <h:outputFormat
                                            value="#{val.getDisplayValue(navigationHelper.locale, true)}"
                                            escape="false" />
                                    </ui:fragment>
                                </dd>
                            </ui:repeat>
                        </ui:fragment>

                        <!-- STANDARD WITH SEPARATOR -->
                        <ui:fragment rendered="#{browseElementMetadata.separator != null}">
                            <dd class="search-list__hit-text-value">
                                <ui:repeat
                                    value="#{browseElementMetadata.values}"
                                    var="val">
                                    <span class="metadata__element-wrapper-single-custom">
                                        <!-- METADATA VALUE -->
                                        <ui:fragment rendered="#{browseElementMetadata.singleString}">
                                            <span class="search-list__hit-text-value-single">
                                                <h:outputFormat
                                                    value="#{val.getDisplayValue(navigationHelper.locale, true)}"
                                                    escape="false" />
                                            </span>
                                            <span class="metadata__element-wrapper-single-custom-separator">#{browseElementMetadata.separator}</span>
                                        </ui:fragment>
                                    </span>
                                </ui:repeat>
                            </dd>
                        </ui:fragment>
                    </ui:fragment>

                    <!-- KEY VALUE PAIRS -->
                    <ui:fragment rendered="#{!browseElementMetadata.singleString}">
                        <ui:repeat
                            value="#{browseElementMetadata.values}"
                            var="val">
                            all blank: #{val.allParamValuesBlank}
                            <ui:fragment rendered="#{!val.allParamValuesBlank}">
                                <div class="metadata__elements metadata__elements-level-#{metadata.indentation} metadata__grouped-wrapper">
                                    <div class="metadata__element-wrapper">
                                        <div class="metadata__element-level-#{metadata.indentation}">
                                            <dl class="dl-horizontal metadata__element-dl metadata__key-value-pairs-list">
                                                <!-- METADATA VALUE -->
                                                <ui:repeat
                                                    value="#{metadataBean.range(0, browseElementMetadata.paramCount)}"
                                                    var="ind0">
                                                    <ui:fragment rendered="#{!val.isParamValueBlank(ind0)}">
                                                        <dt class="search-list__hit-text-label">
                                                            <h:outputText
                                                                value="#{val.getParamLabelWithColon(ind0)}"
                                                                escape="false" />
                                                        </dt>
                                                        <dd class="search-list__hit-text-value">
                                                            <h:outputText
                                                                value="#{val.getDisplayParamValue(ind0)}"
                                                                escape="false" />
                                                        </dd>
                                                    </ui:fragment>
                                                </ui:repeat>
                                            </dl>
                                        </div>
                                    </div>
                                </div>
                            </ui:fragment>
                        </ui:repeat>
                    </ui:fragment>
                </ui:fragment>

                <!-- UNGROUPED VALUES -->
                <ui:fragment rendered="#{browseElementMetadata.separator == null}">
                    <!-- WITHOUT SEPARATOR NEW LINES -->
                    <ui:fragment
                        layout="block"
                        rendered="#{!browseElementMetadata.group}">
                        <ui:repeat
                            value="#{browseElementMetadata.values}"
                            var="val"
                            varStatus="status">
                            <dd class="search-list__hit-text-value">
                                <!-- CUSTOM SEPARATOR -->
                                <!-- DO NOT BREAK THE NEXT LINE -->
                                <span class="search-list__hit-text-value-single">
                                    <h:outputFormat
                                        value="#{val.getDisplayValue(navigationHelper.locale)}"
                                        escape="false" />
                                </span>
                            </dd>
                        </ui:repeat>
                    </ui:fragment>
                </ui:fragment>

                <!-- WITH SEPARATOR -->
                <ui:fragment rendered="#{browseElementMetadata.separator != null}">
                    <!-- SAME LINE -->
                    <ui:fragment
                        layout="block"
                        rendered="#{!browseElementMetadata.group}">
                        <dd class="search-list__hit-text-value">
                            <ui:repeat
                                value="#{browseElementMetadata.values}"
                                var="val"
                                varStatus="status">
                                <!-- CUSTOM SEPARATOR -->
                                <!-- DO NOT BREAK THE NEXT LINE -->
                                <ui:fragment rendered="#{status.index gt 0}">
                                    <span class="metadata__element-wrapper-single-custom-separator">#{browseElementMetadata.separator}</span>
                                </ui:fragment>
                                <span class="search-list__hit-text-value-single">
                                    <h:outputFormat
                                        value="#{val.getDisplayValue(navigationHelper.locale)}"
                                        escape="false" />
                                </span>
                            </ui:repeat>
                        </dd>
                    </ui:fragment>
                </ui:fragment>
            </ui:fragment>
        </ui:repeat>

        <!-- FULLTEXT -->
        <h:panelGroup rendered="#{browseElement.fulltext != null and browseElement.fulltext != ''}">
            <h:outputText
                value="#{msg.fulltext}: "
                rendered="#{browseElement.fulltext != null and browseElement.fulltext != ''}" />
            <h:outputText
                value="#{browseElement.fulltextForHtml}"
                escape="false"
                rendered="#{browseElement.fulltext != ''}" />
        </h:panelGroup>

        <!-- EVENT METADATA -->
        <ui:repeat
            value="#{browseElement.events}"
            var="event">
            <ui:repeat
                value="#{event.searchHitMetadataForCurrentLocale}"
                var="eventMetadata">
                <h:panelGroup rendered="#{!eventMetadata.blank}">
                    <dt
                        data-metadata-field="#{eventMetadata.label}"
                        title="#{eventMetadata.label}"
                        class="search-list__hit-text-label">
                        <h:outputFormat
                            value="#{msg[eventMetadata.label]}: "
                            escape="false" />
                    </dt>

                    <!-- DEFAULT SEPARATOR -->
                    <ui:fragment rendered="#{eventMetadata.separator == null}">
                        <ui:repeat
                            var="val"
                            value="#{eventMetadata.values}">
                            <dd class="search-list__hit-text-value">
                                <h:outputFormat
                                    value="#{val.getDisplayValue(navigationHelper.locale)}"
                                    escape="false" />
                            </dd>
                        </ui:repeat>
                    </ui:fragment>

                    <!-- CUSTOM SEPARATOR -->
                    <ui:fragment rendered="#{browseElementMetadata.separator != null}">
                        <span class="metadata__element-wrapper-single-custom-wrapper search-list__hit-text-value">
                            <ui:repeat
                                var="val"
                                value="#{eventMetadata.values}"
                                varStatus="status">
                                <ui:fragment rendered="#{eventMetadata.separator != null}">
                                    <ui:fragment rendered="#{status.index gt 0}">
                                        <span class="metadata__element-wrapper-single-custom-separator">#{eventMetadata.separator}</span>
                                    </ui:fragment>
                                    <span class="metadata__element-wrapper-single-custom">
                                        <h:outputFormat
                                            value="#{val.getDisplayValue(navigationHelper.locale)}"
                                            escape="false" />
                                    </span>
                                </ui:fragment>
                            </ui:repeat>
                        </span>
                    </ui:fragment>
                </h:panelGroup>
            </ui:repeat>
        </ui:repeat>
    </dl>

    <!-- SECONDARY METADATA (ONLY FOR TILE VIEW) -->
    <ui:fragment rendered="#{not empty browseElement.secondaryMetadataListForCurrentLocale}">
        <div class="search-list__hit-metadata-second">
            <ui:repeat
                value="#{browseElement.secondaryMetadataListForCurrentLocale}"
                var="browseElementMetadata">
                <h:panelGroup rendered="#{!browseElementMetadata.blank}">
                    <dt
                        data-metadata-field="#{browseElementMetadata.label}"
                        title="#{browseElementMetadata.label}"
                        class="search-list__hit-text-label">
                        <h:outputFormat
                            value="#{msg[browseElementMetadata.label]}: "
                            escape="false"
                            styleClass="search-list__hit-text-label" />
                    </dt>

                    <!-- DEFAULT SEPARATOR -->
                    <ui:fragment rendered="#{browseElementMetadata.separator == null}">
                        <ui:repeat
                            var="val"
                            value="#{browseElementMetadata.values}"
                            varStatus="status">
                            <dd class="search-list__hit-text-value">
                                <h:outputFormat
                                    value="#{val.getDisplayValue(navigationHelper.locale)}"
                                    escape="false" />
                            </dd>
                        </ui:repeat>
                    </ui:fragment>

                    <!-- CUSTOM SEPARATOR -->
                    <ui:fragment rendered="#{browseElementMetadata.separator != null}">
                        <dd class="search-list__hit-text-value">
                            <ui:repeat
                                var="val"
                                value="#{browseElementMetadata.values}"
                                varStatus="status">
                                <ui:fragment rendered="#{browseElementMetadata.separator != null}">
                                    <!-- DO NOT BREAK THE NEXT LINE -->
                                    <ui:fragment rendered="#{status.index gt 0}">
                                        <span class="metadata__element-wrapper-single-custom-separator">#{browseElementMetadata.separator}</span>
                                    </ui:fragment>
                                    <span class="search-list__hit-text-value-single">
                                        <h:outputFormat
                                            value="#{val.getDisplayValue(navigationHelper.locale)}"
                                            escape="false" />
                                    </span>
                                </ui:fragment>
                            </ui:repeat>
                        </dd>
                    </ui:fragment>
                </h:panelGroup>
            </ui:repeat>
        </div>
    </ui:fragment>
</ui:composition>
