<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:fragment rendered="#{activeDocumentBean.recordLoaded}">
        <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.allowsImageView}">
            <meta
                name="twitter:card"
                content="summary_large_image" />
            <meta
                name="twitter:image"
                content="#{activeDocumentBean.viewManager.currentPage.getImageUrl(750)}" />
        </ui:fragment>
        <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.video}">
            <meta
                name="twitter:card"
                content="player" />
            <meta
                name="twitter:player"
                content="#{navigationHelper.applicationUrl}video/#{activeDocumentBean.viewManager.pi}/#{activeDocumentBean.viewManager.currentImageOrder}/" />
            <meta
                name="twitter:player:width"
                content="300" />
            <meta
                name="twitter:player:height"
                content="200" />
            <meta
                name="twitter:image"
                content="#{activeDocumentBean.viewManager.currentPage.getImageUrl(750)}" />
        </ui:fragment>
        <meta
            name="twitter:title"
            content="#{activeDocumentBean.viewManager.currentStructElement.label}" />
        <meta
            name="twitter:description"
            content="#{activeDocumentBean.titleBarLabel}" />
        <meta
            name="twitter:site"
            content="#{configurationBean.twitterName}" />
    </ui:fragment>
</ui:composition>
