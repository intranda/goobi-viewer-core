<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf">
    <!-- Immersive image canvas: thin JSF bootstrap. The viewer engine (modules.mjs ->
         IvViewer) reads these data attributes, fetches the IIIF manifest via REST and
         drives in-place navigation client-side. No per-page data is inlined here. -->
    <div
        jsf:id="immersiveImage"
        class="immersive__image-map"
        rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionImage}"
        data-immersive-image=""
        data-pi="#{activeDocumentBean.viewManager.pi}"
        data-api-base="#{request.contextPath}/api/v1"
        data-start-order="#{activeDocumentBean.viewManager.currentImageOrder - 1}"
        data-max-zoom="#{activeDocumentBean.viewManager.currentPage.getMaxImageZoom(navigationHelper.currentPageType)}" />

    <!-- ImageView (OpenSeadragon) library: provides the global ImageView used by IvViewer -->
    <script
        type="text/javascript"
        src="#{request.contextPath}/resources/js/dist/imageView.min.js" />

    <!-- Image-filter labels (i18n) consumed by the imageFilters riot tag (mounted in modules.mjs) -->
    <script type="text/javascript">
        //<![CDATA[
        window.immersiveFilterConfig = {
            filters: {
                brightness: { label: '#{msg.label__image_filter_brightness}' },
                contrast: { label: '#{msg.label__image_filter_contrast}' },
                saturate: { label: '#{msg.label__image_filter_saturate}' },
                grayscale: { label: '#{msg.label__image_filter_grayscale}' },
                threshold: { label: '#{msg.label__image_filter_bitonal}' },
                blur: { label: '#{msg.label__image_filter_blur}', visible: false },
                sharpen: { label: '#{msg.label__image_filter_sharpen}' },
                invert: { label: '#{msg.label__image_filter_invert}' },
                hue: { label: '#{msg.label__image_filter_rotate}' },
            },
            messages: { clearAll: '#{msg.action__reset_all_image_filters}' },
        };
        //]]>
    </script>
</ui:composition>
