<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:jsf="http://xmlns.jcp.org/jsf">
    <!-- IMAGE VIEWER, START ORDER IS 0-BASED -->
    <div
        jsf:id="immersiveImage"
        class="immersive__image-map"
        rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionImage}"
        data-immersive-image=""
        data-pi="#{activeDocumentBean.viewManager.pi}"
        data-api-base="#{request.contextPath}/api/v1"
        data-start-order="#{activeDocumentBean.viewManager.currentImageOrder - 1}"
        data-max-zoom="#{activeDocumentBean.viewManager.currentPage.getMaxImageZoom(navigationHelper.currentPageType)}"
        data-allow-zoom="#{activeDocumentBean.viewManager.currentPage.accessPermissionImageZoom}"
        data-msg-denied="#{msg.errHttp403Msg}" />

    <!-- ACCESS DENIED CONTENT -->
    <ui:fragment rendered="#{activeDocumentBean.viewManager.isRecordImageAccessRestricted()}">
        <div
            id="immersiveDeniedContent"
            hidden="hidden">
            <ui:fragment rendered="#{activeDocumentBean.viewManager.getRecordAccessDeniedImageUrl(navigationHelper.locale) != null}">
                <img
                    class="immersive__page-denied-img"
                    src="#{activeDocumentBean.viewManager.getRecordAccessDeniedImageUrl(navigationHelper.locale)}"
                    alt="#{msg.errHttp403Msg}" />
            </ui:fragment>
            <ui:fragment rendered="#{activeDocumentBean.viewManager.getRecordAccessDeniedImageUrl(navigationHelper.locale) == null}">
                <img
                    class="immersive__page-denied-img"
                    src="#{request.contextPath}/resources/images/access_denied.png"
                    alt="#{msg.errHttp403Msg}" />
            </ui:fragment>
            <ui:fragment rendered="#{activeDocumentBean.viewManager.getRecordAccessDeniedText(navigationHelper.locale) != null}">
                <div class="immersive__page-denied-text">
                    <h:outputText
                        escape="false"
                        value="#{activeDocumentBean.viewManager.getRecordAccessDeniedText(navigationHelper.locale)}" />
                </div>
            </ui:fragment>
        </div>
    </ui:fragment>

    <!-- STAGE LOADER, HIDDEN BY MODULES.MJS -->
    <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionImage}">
        <div
            id="immersiveStageLoader"
            class="immersive__stage-loader"
            role="status">
            <img
                src="#{request.contextPath}/resources/images/infinity_loader.svg"
                class="ajax-loader__animated-image"
                alt="" />
        </div>
    </ui:fragment>

    <!-- IMAGE DENIED -->
    <ui:fragment rendered="#{!activeDocumentBean.viewManager.currentPage.accessPermissionImage}">
        <div
            class="immersive__image-denied"
            role="status">
            <div class="immersive__image-denied-inner">
                <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedImageUrl(navigationHelper.locale) != null}">
                    <img
                        class="immersive__image-denied-img"
                        src="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedImageUrl(navigationHelper.locale)}"
                        alt="#{msg.errHttp403Msg}" />
                </ui:fragment>
                <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedImageUrl(navigationHelper.locale) == null}">
                    <img
                        class="immersive__image-denied-img"
                        src="#{request.contextPath}/resources/images/access_denied.png"
                        alt="#{msg.errHttp403Msg}" />
                </ui:fragment>
                <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForImage(navigationHelper.locale) != null}">
                    <div class="immersive__image-denied-text">
                        <h:outputText
                            escape="false"
                            value="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForImage(navigationHelper.locale)}" />
                    </div>
                </ui:fragment>
            </div>
        </div>
    </ui:fragment>

    <!-- IMAGE VIEW SCRIPT -->
    <script
        type="text/javascript"
        src="#{request.contextPath}/resources/js/dist/imageView.min.js" />

    <!-- IMAGE FILTER LABELS FOR THE RIOT TAG -->
    <script type="text/javascript">
        //<![CDATA[
        window.immersiveFilterConfig = {
            filters: {
                brightness: { label: '#{msg.label__image_filter_brightness}' },
                contrast: { label: '#{msg.label__image_filter_contrast}' },
                saturate: { label: '#{msg.label__image_filter_saturate}' },
                grayscale: { label: '#{msg.label__image_filter_grayscale}' },
                threshold: { label: '#{msg.label__image_filter_bitonal}' },
                blur: { label: '#{msg.label__image_filter_blur}', visible: false },
                sharpen: { label: '#{msg.label__image_filter_sharpen}' },
                invert: { label: '#{msg.label__image_filter_invert}' },
                hue: { label: '#{msg.label__image_filter_rotate}' },
            },
            messages: { clearAll: '#{msg.action__reset_all_image_filters}' },
        };
        //]]>
    </script>
</ui:composition>
