<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <ui:fragment rendered="#{displayConditions.matchPage('{contentType:[TEXT, ALTO], accessCondition: VIEW_FULLTEXT}')}">
        <aside
            id="immersivePanelFulltext"
            class="immersive__panel immersive__panel-left immersive__panel-fulltext"
            aria-label="#{msg.fulltext}"
            aria-hidden="true"
            inert="inert">
            <div class="immersive__panel-header">
                <span class="immersive__panel-title">#{activeDocumentBean.titleBarLabel}</span>
            </div>
            <div class="immersive__fulltext-toolbar">
                <dl
                    class="immersive__fulltext-legend"
                    title="#{msg.fulltext__granularity_label}">
                    <dt class="sr-only">#{msg.fulltext__granularity_label}</dt>
                    <dd class="immersive__fulltext-legend-item immersive__fulltext-legend-item-block">#{msg.fulltext__granularity_block}</dd>
                    <dd class="immersive__fulltext-legend-item immersive__fulltext-legend-item-line">#{msg.fulltext__granularity_line}</dd>
                    <dd class="immersive__fulltext-legend-item immersive__fulltext-legend-item-word">#{msg.fulltext__granularity_word}</dd>
                </dl>
                <div
                    class="immersive__anno-toggle"
                    hidden="hidden">
                    <input
                        type="checkbox"
                        id="immersiveAnnotationsToggle"
                        class="immersive__anno-checkbox" />
                    <label
                        for="immersiveAnnotationsToggle"
                        class="immersive__anno-label">
                        #{msg.annotations}
                    </label>
                </div>
            </div>
            <div
                class="immersive__anno-columns"
                id="immersiveAnnotationsColumns"
                hidden="hidden">
                <span class="immersive__anno-columns-main">#{msg.fulltext__annotation_printed}</span>
                <span class="immersive__anno-columns-side">#{msg.annotations}</span>
            </div>
            <div
                class="immersive__fulltext-loader"
                id="immersiveFulltextLoader"
                role="status"
                hidden="hidden">
                <img
                    src="#{request.contextPath}/resources/images/infinity_loader.svg"
                    class="ajax-loader__animated-image"
                    alt="" />
            </div>
            <div
                class="immersive__fulltext"
                id="immersiveFulltext"
                data-label-empty="#{msg.noFulltextAvailable}"
                data-label-error="#{msg.immersive__fulltext_error}" />
        </aside>
    </ui:fragment>
</ui:composition>
