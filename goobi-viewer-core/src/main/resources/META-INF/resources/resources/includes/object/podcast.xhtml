<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <!-- VIEW PODCAST EPISODE -->
    <div
        id="viewObjectContent"
        class="view-object-content">
        <div class="view-object-content__objects">
            <!-- ACCESS DENIED DESCRIPTION TEXT -->
            <h:panelGroup
                styleClass="view-object__access-denied-text"
                rendered="#{!activeDocumentBean.viewManager.currentPage.accessPermissionAudio and activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForAudio(navigationHelper.locale) != null}">
                <h:outputText
                    escape="false"
                    value="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForAudio(navigationHelper.locale)}" />
            </h:panelGroup>

            <!-- PODLOVE PLAYER -->
            <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionAudio}">
                <script src="#{request.contextPath}/resources/javascript/libs/podlove-player/embed.js?#{navigationHelper.buildVersion}" />
                <!-- The player renders itself into an iframe, the variant selects the bundled layout template -->
                <div
                    id="podcastPlayer"
                    class="view-object-content__audio"
                    data-variant="xl" />
                <script>
                    (function () {
                        const restApiUrl = "#{configurationBean.restApiUrlV1}".replace(/\/$/, "");
                        const pi = "#{activeDocumentBean.viewManager.pi}";
                        const episode = restApiUrl + "/records/" + encodeURIComponent(pi) + "/podlove/episode.json";
                        const config = {
                            version: 5,
                            // Location of the lazy-loaded player assets; podlove would otherwise load them from the server root
                            base: "#{request.contextPath}/resources/javascript/libs/podlove-player/",
                            activeTab: "chapters",
                            share: {
                                channels: ["link", "mail"],
                                sharePlaytime: true
                            }
                        };
                        if (typeof podlovePlayer === "undefined") {
                            console.error("Podlove player library not loaded");
                            return;
                        }
                        podlovePlayer("#podcastPlayer", episode, config);
                    })();
                </script>
            </ui:fragment>
        </div>
    </div>
</ui:composition>
