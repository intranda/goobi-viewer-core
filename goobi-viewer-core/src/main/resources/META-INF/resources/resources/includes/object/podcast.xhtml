<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <!-- VIEW PODCAST EPISODE -->
    <div
        id="viewObjectContent"
        class="view-object-content -podcast">
        <div class="view-object-content__podlove">
            <!-- ACCESS DENIED DESCRIPTION TEXT -->
            <h:panelGroup
                styleClass="view-object__access-denied-text"
                rendered="#{!activeDocumentBean.viewManager.currentPage.accessPermissionAudio and activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForAudio(navigationHelper.locale) != null}">
                <h:outputText
                    escape="false"
                    value="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForAudio(navigationHelper.locale)}" />
            </h:panelGroup>

            <!-- PODLOVE PLAYER -->
            <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionAudio}">
                <script src="#{request.contextPath}/resources/javascript/libs/podlove-player/embed.js?#{navigationHelper.buildVersion}" />
                <!-- The player renders itself into an iframe. The layout template podcast-player-template.html is a copy of the bundled
                     "xl" variant (@podlove/web-player 5.13.0) with "flex-shrink-0" on the poster column and "min-w-0" on the player column.
                     Without them, hovering the progress bar over a chapter with a long title shrinks the poster, which moves the progress bar
                     under the cursor to another chapter and makes the layout flicker. Compare the template with variant-xl when updating the player. -->
                <div
                    id="podcastPlayer"
                    class="view-object-content__podlove-player"
                    data-template="#{request.contextPath}/resources/includes/object/podcast-player-template.html?#{navigationHelper.buildVersion}" />
                <script>
                    (function () {
                        const restApiUrl = "#{configurationBean.restApiUrlV1}".replace(/\/$/, "");
                        const pi = "#{activeDocumentBean.viewManager.pi}";
                        const episode = restApiUrl + "/records/" + encodeURIComponent(pi) + "/podlove/episode.json";
                        const config = {
                            version: 5,
                            // Location of the lazy-loaded player assets; podlove would otherwise load them from the server root
                            base: "#{request.contextPath}/resources/javascript/libs/podlove-player/",
                            activeTab: "chapters",
                            share: {
                                channels: ["link", "mail"],
                                sharePlaytime: true
                            }
                        };
                        // Player colors from the theme. The player renders in an iframe, so CSS variables of this page do not reach it
                        // and are handed over as theme tokens instead. A theme sets the custom properties listed below on this element
                        // or an ancestor; tokens without a value keep the Podlove default. Colors are converted to hex because the player
                        // expects plain color values, not color-mix() or relative color syntax.
                        const colorTokens = {
                            brand: "--podcast-player-brand",
                            brandDark: "--podcast-player-brand-dark",
                            brandDarkest: "--podcast-player-brand-darkest",
                            brandLightest: "--podcast-player-brand-lightest",
                            shadeDark: "--podcast-player-shade-dark",
                            shadeBase: "--podcast-player-shade-base",
                            contrast: "--podcast-player-contrast",
                            alt: "--podcast-player-alt"
                        };
                        const probe = document.createElement("canvas").getContext("2d");
                        const toHex = function (color) {
                            if (!CSS.supports("color", color)) {
                                return null;
                            }
                            // Paint over white so that semi-transparent colors resolve to a visible opaque color
                            probe.fillStyle = "#ffffff";
                            probe.fillRect(0, 0, 1, 1);
                            probe.fillStyle = color;
                            probe.fillRect(0, 0, 1, 1);
                            const rgb = probe.getImageData(0, 0, 1, 1).data;
                            return "#" + [rgb[0], rgb[1], rgb[2]].map(function (channel) {
                                return channel.toString(16).padStart(2, "0");
                            }).join("");
                        };
                        const playerStyle = getComputedStyle(document.getElementById("podcastPlayer"));
                        const tokens = {};
                        Object.keys(colorTokens).forEach(function (token) {
                            const value = playerStyle.getPropertyValue(colorTokens[token]).trim();
                            const hex = value ? toHex(value) : null;
                            if (hex) {
                                tokens[token] = hex;
                            }
                        });
                        if (Object.keys(tokens).length > 0) {
                            config.theme = { tokens: tokens };
                        }
                        // RSS feed of the show (legal deposit copy, blocked from directories). Only clients that subscribe by feed URL are
                        // offered; directory clients such as Apple Podcasts or Spotify would point to a listing that does not exist for this feed.
                        const showPi = "#{activeDocumentBean.viewManager.topStructElement.getMetadataValue('GROUPID_PODCAST')}";
                        if (showPi) {
                            config["subscribe-button"] = {
                                feed: restApiUrl + "/records/" + encodeURIComponent(showPi) + "/podcast/feed.rss",
                                clients: [{ id: "rss" }]
                            };
                        }
                        if (typeof podlovePlayer === "undefined") {
                            console.error("Podlove player library not loaded");
                            return;
                        }
                        // Accessibility fixes inside the player iframe, applied once the player has created it. The iframe is written by
                        // the player itself and therefore same-origin, so this page can adjust it without touching the vendor files.
                        const improveAccessibility = function () {
                            const iframe = document.querySelector("#podcastPlayer iframe");
                            if (!iframe) {
                                return;
                            }
                            // The player names the iframe "Podlove Web Player: [episode title]" in English only
                            const playerTitle = "#{msg.podcast_player__title}";
                            const localizedTitle = iframe.title.replace(/^Podlove Web Player/, playerTitle);
                            iframe.title = localizedTitle;
                            iframe.setAttribute("aria-label", localizedTitle);
                            const frameDocument = iframe.contentDocument;
                            if (!frameDocument || !frameDocument.head) {
                                return;
                            }
                            // The player document has no lang attribute, so screen readers would use the voice of the wrong language. The
                            // player picks its labels from the browser language among the languages of the bundled version (5.13.0) and
                            // falls back to English.
                            const playerLanguages = ["en", "de", "eo", "fr", "cs", "ar"];
                            const browserLanguage = (navigator.language || "en").split("-")[0];
                            frameDocument.documentElement.lang = playerLanguages.indexOf(browserLanguage) > -1 ? browserLanguage : "en";
                            // Same double ring as the rest of the viewer (core tokens, see .mx-focus-visible); the fallbacks are the
                            // Podlove default for the contrast token and white
                            const focusRing = toHex(playerStyle.getPropertyValue("--outline-focus").trim()) || tokens.contrast || "#000000";
                            const focusInner = toHex(playerStyle.getPropertyValue("--outline-focus-inner").trim()) || "#ffffff";
                            const style = frameDocument.createElement("style");
                            // 1. The player removes the focus outline of its sliders; show one for keyboard users (WCAG 2.4.7).
                            // 2. Its placeholder color is a fixed light gray at half opacity (about 1.4:1); derive it from the text color
                            //    instead (WCAG 1.4.3).
                            // 3. Respect the reduced motion setting (WCAG 2.3.3).
                            // 4. The player moves keyboard focus into visually hidden controls (a screen reader chapter list and a second
                            //    progress slider), where no ring can be seen. Show the ring on the visible counterpart instead (WCAG 2.4.7);
                            //    it is drawn inside the element so that scroll containers do not clip it.
                            style.textContent =
                                "#app :focus-visible { outline: 2px solid " + focusInner + "; outline-offset: -2px; box-shadow: 0 0 0 4px " + focusRing + "; }" +
                                "#app [data-focus-proxy] { outline: 2px solid " + focusRing + "; outline-offset: -2px; box-shadow: inset 0 0 0 4px " + focusInner + "; }" +
                                "#app .input::placeholder { color: inherit; opacity: 0.75; }" +
                                "@media (prefers-reduced-motion: reduce) { #app *, #app *::before, #app *::after { animation: none !important; transition: none !important; } }";
                            frameDocument.head.appendChild(style);
                            const clearFocusProxy = function () {
                                frameDocument.querySelectorAll("[data-focus-proxy]").forEach(function (element) {
                                    element.removeAttribute("data-focus-proxy");
                                });
                            };
                            frameDocument.addEventListener("focusout", clearFocusProxy);
                            frameDocument.addEventListener("focusin", function (event) {
                                clearFocusProxy();
                                const hidden = event.target.closest(".sr-only");
                                if (!hidden) {
                                    return;
                                }
                                // Chapter buttons and timers sit in a list that mirrors the visible chapter rows by index
                                const item = event.target.closest("li[index]");
                                const proxy = item
                                    ? frameDocument.querySelector('[data-test="tab-chapters--entry"][index="' + item.getAttribute("index") + '"]')
                                    : hidden.parentElement;
                                if (proxy) {
                                    proxy.setAttribute("data-focus-proxy", "");
                                    proxy.scrollIntoView({ block: "nearest" });
                                }
                            });
                        };
                        Promise.resolve(podlovePlayer("#podcastPlayer", episode, config))
                            .then(improveAccessibility)
                            .catch(function (error) {
                                console.warn("Podlove player accessibility adjustments failed", error);
                            });
                    })();
                </script>
            </ui:fragment>
        </div>
    </div>
</ui:composition>
