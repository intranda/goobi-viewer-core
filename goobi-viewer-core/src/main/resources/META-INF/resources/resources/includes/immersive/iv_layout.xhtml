<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:util="http://goobi.io/util">
    <div class="immersive">
        <h1 class="sr-only">#{activeDocumentBean.titleBarLabel}</h1>
        <!-- VIEWER HERO -->
        <section class="immersive__viewer">
            <!-- HEADER OVERLAY -->
            <ui:include src="/resources/includes/immersive/iv_title.xhtml" />

            <!-- LEFT TOOLBAR -->
            <ui:include src="/resources/includes/immersive/iv_toolbar_left.xhtml" />

            <!-- TOC PANEL -->
            <ui:include src="/resources/includes/immersive/iv_panel_toc.xhtml" />
            <!-- METADATA PANEL -->
            <ui:include src="/resources/includes/immersive/iv_panel_metadata.xhtml" />
            <!-- SEARCH PANEL -->
            <ui:include src="/resources/includes/immersive/iv_panel_search.xhtml" />
            <!-- FULLTEXT PANEL -->
            <ui:include src="/resources/includes/immersive/iv_panel_fulltext.xhtml" />
            <!-- LAYOUT TAGS PANEL -->
            <ui:include src="/resources/includes/immersive/iv_panel_layout_tags.xhtml" />

            <!-- MEDIA CANVAS -->
            <div class="immersive__canvas">
                <!-- VIEW IMAGE -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.allowsImageView}">
                    <ui:include src="/resources/includes/immersive/iv_image.xhtml" />
                </h:panelGroup>
                <!-- VIEW VIDEO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.video}">
                    <ui:include src="/resources/includes/object/video.xhtml" />
                </h:panelGroup>
                <!-- VIEW AUDIO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.audio}">
                    <ui:include src="/resources/includes/object/audio.xhtml" />
                </h:panelGroup>
                <!-- VIEW 3D OBJECT -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.is3DModel()}">
                    <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/voyager3d.xhtml" />
                    </ui:fragment>
                    <ui:fragment rendered="#{!activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/object3d.xhtml" />
                    </ui:fragment>
                </h:panelGroup>
                <!-- VIEW TEXT -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.sandboxedHtml}">
                    <ui:include src="/resources/includes/object/text.xhtml" />
                </h:panelGroup>
            </div>

            <!-- PAGE-TURN CHEVRONS -->
            <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.accessPermissionImage}">
                <button
                    type="button"
                    class="immersive__chevron immersive__chevron-left"
                    data-immersive-page="prev"
                    aria-label="#{msg.prevImage}">
                    <util:icon
                        icon="chevron-left"
                        svgClass="immersive__chevron-icon" />
                </button>
                <button
                    type="button"
                    class="immersive__chevron immersive__chevron-right"
                    data-immersive-page="next"
                    aria-label="#{msg.nextImage}">
                    <util:icon
                        icon="chevron-right"
                        svgClass="immersive__chevron-icon" />
                </button>
            </ui:fragment>

            <!-- RIGHT TOOLBAR -->
            <ui:include src="/resources/includes/immersive/iv_toolbar_right.xhtml" />

            <!-- BOTTOM BAR -->
            <ui:include src="/resources/includes/immersive/iv_bottombar.xhtml" />

            <!-- OVERVIEW GRID -->
            <ui:include src="/resources/includes/immersive/iv_grid_overlay.xhtml" />

            <!-- KEYBOARD SHORTCUTS MODAL -->
            <ui:include src="/resources/includes/immersive/iv_shortcuts_modal.xhtml" />
        </section>

        <!-- CONTENT REGION + POPOVERS -->
        <ui:include src="/resources/includes/immersive/iv_content.xhtml" />
    </div>

    <script type="text/javascript">
        viewerJS.normdata.init({
            path: '#{request.contextPath}',
            lang: {
                popoverTitle: '#{msg.normdataPopoverTitle}',
                popoverClose: '#{msg.normdataPopoverClose}',
                showNormdata: '#{msg.normdataExpand}',
            },
        });
    </script>
</ui:composition>
