<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:util="http://goobi.io/util"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets"
    xmlns:c="http://java.sun.com/jsp/jstl/core">
    <div class="immersive">
        <!-- Page-level heading for the immersive view (visually hidden): gives screen
             readers and the document outline a top-level heading without adding visible
             chrome. The visible work title lives in the overlay title-trigger. -->
        <h1 class="sr-only">#{activeDocumentBean.titleBarLabel}</h1>
        <!-- VIEWER HERO: dark canvas + centered media + overlay slots -->
        <section class="immersive__viewer">
            <!-- Header overlay: back-to-results (left) + work title (centered) -->
            <div
                class="immersive__overlay-top"
                id="immersiveOverlayTop">
                <ui:fragment rendered="#{searchBean.hitsCount > 0}">
                    <a
                        class="immersive__back"
                        href="#{searchBean.lastUsedSearchUrl}"
                        title="#{msg.returnToHitlist}">
                        <util:icon-text
                            icon="arrow-narrow-left"
                            iconSvgClass="immersive__back-icon"
                            text="#{msg.returnToHitlist}" />
                    </a>
                </ui:fragment>
                <div class="immersive__title">
                    <button
                        type="button"
                        class="immersive__title-trigger"
                        data-immersive-title-trigger="true"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-controls="immersivePageDropdown"
                        title="#{msg.aria_label__select_page}"
                        aria-label="#{msg.aria_label__select_page}">
                        <util:icon
                            icon="book"
                            svgClass="immersive__title-icon" />
                        <span class="immersive__title-text">#{activeDocumentBean.titleBarLabel}</span>
                        <span
                            class="immersive__title-page"
                            id="immersiveTitlePage" />
                        <util:icon
                            icon="chevron-down"
                            svgClass="immersive__title-caret" />
                    </button>
                    <div
                        class="immersive__page-dropdown"
                        id="immersivePageDropdown"
                        hidden="hidden">
                        <div class="immersive__page-dropdown-jump">
                            <label
                                class="immersive__page-dropdown-label"
                                for="immersivePageInput">
                                #{msg.aria__label_pagination_goto}
                            </label>
                            <input
                                type="number"
                                min="1"
                                id="immersivePageInput"
                                class="immersive__page-dropdown-input"
                                inputmode="numeric"
                                autocomplete="off" />
                        </div>
                        <ul
                            class="immersive__page-dropdown-list"
                            id="immersivePageList"
                            role="listbox" />
                    </div>
                </div>
            </div>

            <!-- Left toolbar: record-info menu + in-work search slide-out toggles -->
            <div
                class="immersive__toolbar immersive__toolbar--left"
                id="immersiveToolbarLeft">
                <button
                    type="button"
                    class="immersive__tool-btn"
                    data-immersive-panel="immersivePanelMenu"
                    aria-controls="immersivePanelMenu"
                    aria-expanded="false"
                    title="#{msg.toc}"
                    aria-label="#{msg.toc}">
                    <util:icon
                        icon="list"
                        svgClass="immersive__tool-icon" />
                </button>
                <!-- Fulltext (page OCR) toggle; only rendered when the work has fulltext.
                     modules.mjs disables it in double-page mode (single-page only). -->
                <ui:fragment rendered="#{activeDocumentBean.viewManager.topStructElement.fulltextAvailable}">
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-immersive-panel="immersivePanelFulltext"
                        data-title-disabled="#{msg.fulltextOnlySinglePage}"
                        aria-controls="immersivePanelFulltext"
                        aria-expanded="false"
                        title="#{msg.fulltext}"
                        aria-label="#{msg.fulltext}">
                        <util:icon
                            icon="file-text"
                            svgClass="immersive__tool-icon" />
                    </button>
                </ui:fragment>
                <button
                    type="button"
                    class="immersive__tool-btn"
                    data-immersive-panel="immersivePanelSearch"
                    aria-controls="immersivePanelSearch"
                    aria-expanded="false"
                    title="#{msg.search}"
                    aria-label="#{msg.search}">
                    <util:icon
                        icon="search"
                        svgClass="immersive__tool-icon" />
                </button>
                <button
                    type="button"
                    class="immersive__tool-btn"
                    data-immersive-panel="immersivePanelMetadata"
                    aria-controls="immersivePanelMetadata"
                    aria-expanded="false"
                    title="#{msg.metadata}"
                    aria-label="#{msg.metadata}">
                    <util:icon
                        icon="info-circle"
                        svgClass="immersive__tool-icon" />
                </button>
            </div>

            <!-- Left slide-out menu (burger): the record's table of contents, for
                 jumping between structural sections without leaving the image view.
                 TOC clicks navigate in place (modules.mjs); closing is handled by
                 re-clicking the burger toggle. -->
            <aside
                id="immersivePanelMenu"
                class="immersive__panel immersive__panel--left immersive__panel--menu"
                aria-label="#{msg.toc}"
                aria-hidden="true">
                <!-- Record header: work title + (only when the TOC nests) the expand/
                     collapse-all toggle, where the close button used to sit. The panel
                     closes via Escape or by re-clicking the burger. -->
                <div class="immersive__panel-header">
                    <span class="immersive__panel-title">#{activeDocumentBean.titleBarLabel}</span>
                    <button
                        type="button"
                        class="immersive__toc-collapse"
                        data-immersive-toc-toggle="true"
                        data-label-collapse="#{msg.allClose}"
                        data-label-expand="#{msg.allOpen}"
                        title="#{msg.allClose}"
                        aria-label="#{msg.allClose}"
                        hidden="hidden">
                        <util:icon
                            icon="square-rounded-minus"
                            svgClass="immersive__toc-collapse-icon immersive__toc-collapse-icon--collapse" />
                        <util:icon
                            icon="square-rounded-plus"
                            svgClass="immersive__toc-collapse-icon immersive__toc-collapse-icon--expand" />
                    </button>
                </div>
                <widgetComponent:widget_toc />
            </aside>
            <aside
                id="immersivePanelMetadata"
                class="immersive__panel immersive__panel--left immersive__panel--metadata"
                aria-label="#{msg.metadata}"
                aria-hidden="true">
                <div class="immersive__panel-header">
                    <span class="immersive__panel-title">#{activeDocumentBean.titleBarLabel}</span>
                </div>
                <div class="metadata immersive__metadata">
                    <c:set
                        var="mdList"
                        value="#{metadataBean.metadataElementList}" />
                    <!-- Visible blocks: ISANCHOR:true (multivolume work + volume) -> 2, else
                         -> 1. Deeper structural blocks (chapters) fold under a "more / less
                         metadata" toggle (config-independent). -->
                    <c:set
                        var="mdCount"
                        value="#{not empty mdList and mdList[0].anchor ? 2 : 1}" />
                    <c:forEach
                        items="#{mdList}"
                        var="metadataElement"
                        varStatus="status">
                        <ui:fragment rendered="#{status.index lt mdCount}">
                            <ui:include src="/resources/includes/metadata/metadataElement.xhtml">
                                <ui:param
                                    name="metadataElement"
                                    value="#{metadataElement}" />
                            </ui:include>
                        </ui:fragment>
                    </c:forEach>
                    <ui:fragment rendered="#{not empty mdList and mdList.size() gt mdCount}">
                        <div
                            class="immersive__metadata-more"
                            id="immersiveMetadataMore"
                            hidden="hidden">
                            <c:forEach
                                items="#{mdList}"
                                var="metadataElement"
                                varStatus="status">
                                <ui:fragment rendered="#{status.index ge mdCount}">
                                    <ui:include src="/resources/includes/metadata/metadataElement.xhtml">
                                        <ui:param
                                            name="metadataElement"
                                            value="#{metadataElement}" />
                                    </ui:include>
                                </ui:fragment>
                            </c:forEach>
                        </div>
                        <button
                            type="button"
                            class="immersive__metadata-toggle"
                            data-immersive-metadata-toggle="immersiveMetadataMore"
                            aria-controls="immersiveMetadataMore"
                            aria-expanded="false">
                            <span class="immersive__metadata-toggle-more">#{msg.metadata__fold_show_more}</span>
                            <span class="immersive__metadata-toggle-less">#{msg.metadata__fold_show_less}</span>
                        </button>
                    </ui:fragment>
                </div>
            </aside>
            <aside
                id="immersivePanelSearch"
                class="immersive__panel immersive__panel--left"
                aria-label="#{msg.search}"
                aria-hidden="true">
                <!-- Record header: just the work title (closes via Escape or the burger). -->
                <div class="immersive__panel-header">
                    <span class="immersive__panel-title">#{activeDocumentBean.titleBarLabel}</span>
                </div>
                <widgetComponent:widget_searchInCurrentItem />
                <!-- In-place fulltext search results (populated by modules.mjs) -->
                <div
                    id="immersiveSearchResults"
                    class="immersive__results"
                    data-label-hits="#{msg.hits}"
                    data-label-empty="#{msg.hitsZero}"
                    data-label-reset="#{msg.searchList_resetCurrentSearch}"
                    hidden="hidden">
                    <div class="immersive__results-head">
                        <span
                            class="immersive__results-count"
                            id="immersiveHitCounter"
                            aria-live="polite"
                            aria-atomic="true" />
                        <span class="immersive__results-nav">
                            <button
                                type="button"
                                class="immersive__results-navbtn"
                                data-immersive-hit="prev"
                                aria-label="#{msg.previousHit}">
                                <util:icon
                                    icon="chevron-left"
                                    svgClass="immersive__results-navicon" />
                            </button>
                            <button
                                type="button"
                                class="immersive__results-navbtn"
                                data-immersive-hit="next"
                                aria-label="#{msg.nextHit}">
                                <util:icon
                                    icon="chevron-right"
                                    svgClass="immersive__results-navicon" />
                            </button>
                        </span>
                    </div>
                    <ul
                        class="immersive__results-list"
                        id="immersiveResultsList" />
                </div>
            </aside>
            <!-- Fulltext (page OCR) panel: title header + the current page's transcription,
                 fetched per page by modules.mjs (DFG-Viewer-like). Single-page only. -->
            <ui:fragment rendered="#{activeDocumentBean.viewManager.topStructElement.fulltextAvailable}">
                <aside
                    id="immersivePanelFulltext"
                    class="immersive__panel immersive__panel--left immersive__panel--fulltext"
                    aria-label="#{msg.fulltext}"
                    aria-hidden="true">
                    <div class="immersive__panel-header">
                        <span class="immersive__panel-title">#{activeDocumentBean.titleBarLabel}</span>
                        <div
                            class="immersive__fulltext-granularity"
                            role="group"
                            aria-label="#{msg.fulltext__granularity_label}">
                            <button
                                type="button"
                                class="immersive__fulltext-granularity-btn is-active"
                                data-immersive-granularity="line"
                                aria-pressed="true">
                                #{msg.fulltext__granularity_line}
                            </button>
                            <button
                                type="button"
                                class="immersive__fulltext-granularity-btn"
                                data-immersive-granularity="word"
                                aria-pressed="false">
                                #{msg.fulltext__granularity_word}
                            </button>
                        </div>
                    </div>
                    <div
                        class="immersive__fulltext-loader"
                        id="immersiveFulltextLoader"
                        hidden="hidden">
                        <img
                            src="#{request.contextPath}/resources/images/infinity_loader.svg"
                            class="ajax-loader__animated-image"
                            alt="" />
                    </div>
                    <div
                        class="immersive__fulltext"
                        id="immersiveFulltext"
                        data-label-empty="#{msg.noFulltextAvailable}" />
                </aside>
            </ui:fragment>

            <!-- Central canvas: media-type dependent (universal view, mirrors viewObject.xhtml) -->
            <div
                class="immersive__canvas"
                id="immersiveCanvas">
                <!-- IMAGE (OSD, client-driven in-place navigation) -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.allowsImageView}">
                    <ui:include src="/resources/includes/immersive/iv_image.xhtml" />
                </h:panelGroup>
                <!-- VIDEO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.video}">
                    <ui:include src="/resources/includes/object/video.xhtml" />
                </h:panelGroup>
                <!-- AUDIO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.audio}">
                    <ui:include src="/resources/includes/object/audio.xhtml" />
                </h:panelGroup>
                <!-- 3D -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.is3DModel()}">
                    <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/voyager3d.xhtml" />
                    </ui:fragment>
                    <ui:fragment rendered="#{!activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/object3d.xhtml" />
                    </ui:fragment>
                </h:panelGroup>
                <!-- TEXT (sandboxed HTML) -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.sandboxedHtml}">
                    <ui:include src="/resources/includes/object/text.xhtml" />
                </h:panelGroup>
            </div>

            <!-- Big page-turn chevrons (left/right, vertically centered) -->
            <button
                type="button"
                class="immersive__chevron immersive__chevron--left"
                data-immersive-page="prev"
                aria-label="#{msg.prevImage}">
                <util:icon
                    icon="chevron-left"
                    svgClass="immersive__chevron-svg" />
            </button>
            <button
                type="button"
                class="immersive__chevron immersive__chevron--right"
                data-immersive-page="next"
                aria-label="#{msg.nextImage}">
                <util:icon
                    icon="chevron-right"
                    svgClass="immersive__chevron-svg" />
            </button>

            <!-- Right toolbar (actions / views) -->
            <div
                class="immersive__toolbar immersive__toolbar--right"
                id="immersiveToolbarRight">
                <!-- ACTIONS: download / share / cite -->
                <h:panelGroup
                    layout="block"
                    styleClass="immersive__toolbar-group"
                    rendered="#{activeDocumentBean.accessPermissionPdf or configurationBean.displaySocialMediaShareLinks or configurationBean.displaySidebarWidgetUsageCitationLinks}">
                    <!-- DOWNLOAD: whole-work PDF (B8) -->
                    <ui:fragment rendered="#{activeDocumentBean.accessPermissionPdf}">
                        <a
                            class="immersive__tool-btn"
                            href="#{activeDocumentBean.viewManager.pdfDownloadLink}"
                            target="_blank"
                            rel="noopener"
                            title="#{msg.action__search_hit_download_pdf}"
                            aria-label="#{msg.action__search_hit_download_pdf}">
                            <util:icon
                                icon="download"
                                svgClass="immersive__tool-icon" />
                        </a>
                    </ui:fragment>
                    <!-- SHARE (B6): reuse social-media share widget in a popover -->
                    <ui:fragment rendered="#{configurationBean.displaySocialMediaShareLinks}">
                        <button
                            type="button"
                            class="immersive__tool-btn"
                            data-popover-element="#immersiveSharePopover"
                            data-popover-placement="left"
                            data-popover-dismiss="click-outside"
                            aria-haspopup="dialog"
                            aria-expanded="false"
                            aria-controls="immersiveSharePopover"
                            title="#{msg.action__share}"
                            aria-label="#{msg.action__share}">
                            <util:icon
                                icon="share"
                                svgClass="immersive__tool-icon" />
                        </button>
                    </ui:fragment>
                    <!-- CITE (B7): reuse citation widget in a popover -->
                    <ui:fragment rendered="#{configurationBean.displaySidebarWidgetUsageCitationLinks}">
                        <button
                            type="button"
                            class="immersive__tool-btn"
                            data-popover-element="#immersiveCitationPopover"
                            data-popover-placement="left"
                            data-popover-dismiss="click-outside"
                            aria-haspopup="dialog"
                            aria-expanded="false"
                            aria-controls="immersiveCitationPopover"
                            title="#{msg.widget_citation}"
                            aria-label="#{msg.widget_citation}">
                            <util:icon
                                icon="quote"
                                svgClass="immersive__tool-icon" />
                        </button>
                    </ui:fragment>
                </h:panelGroup>

                <!-- VIEWS: double-page / overview / fullscreen -->
                <h:panelGroup
                    layout="block"
                    styleClass="immersive__toolbar-group">
                    <!-- DOUBLE PAGE: book-spread toggle -->
                    <ui:fragment rendered="#{activeDocumentBean.viewManager.imagesCount ge 2}">
                        <button
                            type="button"
                            class="immersive__tool-btn"
                            data-immersive-action="double-page"
                            aria-pressed="false"
                            title="#{msg.doublePageView}"
                            aria-label="#{msg.doublePageView}">
                            <util:icon
                                icon="book"
                                svgClass="immersive__tool-icon" />
                        </button>
                    </ui:fragment>
                    <!-- OVERVIEW: thumbnail grid overlay (in-place navigation) -->
                    <ui:fragment rendered="#{activeDocumentBean.viewManager.imagesCount ge 2}">
                        <button
                            type="button"
                            class="immersive__tool-btn"
                            data-immersive-action="overview"
                            title="#{msg.fullscreen_showThumbs}"
                            aria-label="#{msg.fullscreen_showThumbs}">
                            <util:icon
                                icon="layout-grid"
                                svgClass="immersive__tool-icon" />
                        </button>
                    </ui:fragment>
                    <!-- FULLSCREEN (H3): real browser fullscreen on the viewer hero -->
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-immersive-action="fullscreen"
                        data-label-enter="#{msg.fullscreen_enter}"
                        data-label-exit="#{msg.fullscreen_exit}"
                        title="#{msg.fullscreen_enter}"
                        aria-label="#{msg.fullscreen_enter}"
                        aria-pressed="false">
                        <util:icon
                            icon="maximize"
                            svgClass="immersive__tool-icon" />
                    </button>
                </h:panelGroup>
            </div>

            <!-- Bottom bar: navigation / zoom / rotate -->
            <div
                class="immersive__bottombar"
                id="immersiveBottomBar">
                <!-- NAVIGATION -->
                <div class="immersive__bottombar-group">
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-page="prev"
                        title="#{msg.prevImage}"
                        aria-label="#{msg.prevImage}">
                        <util:icon
                            icon="chevron-left"
                            svgClass="immersive__bar-icon" />
                    </button>
                    <span
                        class="immersive__page-indicator"
                        id="immersivePageIndicator"
                        aria-live="polite"
                        aria-atomic="true">
                        #{activeDocumentBean.viewManager.currentImageOrder}
                    </span>
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-page="next"
                        title="#{msg.nextImage}"
                        aria-label="#{msg.nextImage}">
                        <util:icon
                            icon="chevron-right"
                            svgClass="immersive__bar-icon" />
                    </button>
                </div>
                <!-- ZOOM -->
                <div class="immersive__bottombar-group">
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-action="zoom-in"
                        title="#{msg.zoomIn}"
                        aria-label="#{msg.zoomIn}">
                        <util:icon
                            icon="plus"
                            svgClass="immersive__bar-icon" />
                    </button>
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-action="zoom-out"
                        title="#{msg.zoomOut}"
                        aria-label="#{msg.zoomOut}">
                        <util:icon
                            icon="minus"
                            svgClass="immersive__bar-icon" />
                    </button>
                </div>
                <!-- ROTATE -->
                <div class="immersive__bottombar-group">
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-action="rotate-left"
                        title="#{msg.rotateLeft}"
                        aria-label="#{msg.rotateLeft}">
                        <util:icon
                            icon="rotate"
                            svgClass="immersive__bar-icon" />
                    </button>
                    <button
                        type="button"
                        class="immersive__bar-btn"
                        data-immersive-action="rotate-right"
                        title="#{msg.rotateRight}"
                        aria-label="#{msg.rotateRight}">
                        <util:icon
                            icon="rotate-clockwise"
                            svgClass="immersive__bar-icon" />
                    </button>
                </div>
                <!-- FILTER: image adjustments (reused imageFilters riot tag in a popover) -->
                <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.allowsImageView}">
                    <div class="immersive__bottombar-group">
                        <button
                            type="button"
                            class="immersive__bar-btn"
                            data-popover-element="#immersiveFilterPopover"
                            data-popover-placement="top"
                            data-popover-dismiss="click-outside"
                            aria-haspopup="dialog"
                            aria-expanded="false"
                            aria-controls="immersiveFilterPopover"
                            title="#{msg.label__image_filter_toolkit}"
                            aria-label="#{msg.label__image_filter_toolkit}">
                            <util:icon
                                icon="adjustments"
                                svgClass="immersive__bar-icon" />
                        </button>
                    </div>
                </ui:fragment>
            </div>

            <!-- Overview thumbnail grid overlay (lazy-mounted riot tag) -->
            <div
                class="immersive__grid"
                id="immersiveGridOverlay"
                hidden="hidden">
                <!-- Close button is a direct, non-scrolling child of the overlay so it
                     stays pinned top-right while the thumbnails scroll in __grid-scroll. -->
                <button
                    type="button"
                    class="immersive__grid-close"
                    data-immersive-action="overview"
                    aria-label="#{msg.closeWindow}">
                    <util:icon
                        icon="x"
                        svgClass="immersive__close-icon" />
                </button>
                <div class="immersive__grid-scroll">
                    <!-- Loading screen shown until the first thumbnails appear (hidden by JS) -->
                    <div
                        id="immersiveGridLoader"
                        class="immersive__grid-loader">
                        <img
                            src="#{request.contextPath}/resources/images/infinity_loader.svg"
                            class="ajax-loader__animated-image"
                            alt="" />
                    </div>
                    <div
                        id="immersiveThumbnails"
                        class="immersive__grid-mount" />
                </div>
            </div>
        </section>

        <!-- CONTENT REGION below the viewer - existing includes reused -->
        <div
            class="immersive__content container"
            id="immersiveContent">
            <div class="row immersive__content-row">
                <!-- Main content (metadata, annotations, comments, related groups), reused from viewObject.xhtml.
                     Full width now that the record sidebar lives in the left slide-out menu. -->
                <div class="immersive__main col-12">
                    <!-- Bibliographic metadata (needs activeMetadataView from the preRenderView events on the page) -->
                    <h:panelGroup rendered="#{metadataBean.activeMetadataView != null}">
                        <ui:include src="/resources/includes/metadata/metadata.xhtml">
                            <ui:param
                                name="metadataViewIndex"
                                value="#{metadataBean.activeMetadataView.index}" />
                            <ui:param
                                name="metadataViewLabel"
                                value="#{metadataBean.activeMetadataView.label != null ? metadataBean.activeMetadataView.label : metadataBean.defaultMetadataLabel}" />
                        </ui:include>
                    </h:panelGroup>

                    <!-- Module contributions (e.g. crowdsourcing) -->
                    <c:forEach
                        var="module"
                        items="#{configurationBean.modules}">
                        <c:forEach
                            var="contribution"
                            items="#{module.getWidgets('viewImage')}">
                            <ui:include src="/#{contribution}" />
                        </c:forEach>
                    </c:forEach>

                    <!-- User generated content (annotations) of the current page -->
                    <h:panelGroup id="userGeneratedContentGroup">
                        <ui:fragment
                            rendered="#{configurationBean.displayUserGeneratedContentBelowImage and contentBean.getUserGeneratedContentsOfPageForDisplay(activeDocumentBean.viewManager.currentPage).size() > 0}">
                            <div
                                id="view_image_user_generated_content"
                                class="view-object__user_generated_content">
                                <h2>
                                    <span>#{msg.admin__crowdsourcing_annotations}</span>
                                </h2>
                                <viewerComponent:annotationList
                                    contentList="#{contentBean.getUserGeneratedContentsOfPageForDisplay(activeDocumentBean.viewManager.currentPage)}"
                                    sidebar="false" />
                            </div>
                        </ui:fragment>
                    </h:panelGroup>

                    <!-- User comments -->
                    <ui:include src="/resources/includes/user/userComments.xhtml" />

                    <!-- Related groups grid -->
