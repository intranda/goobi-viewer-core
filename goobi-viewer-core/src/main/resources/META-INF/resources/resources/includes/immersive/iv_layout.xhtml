<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:util="http://goobi.io/util"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <div class="immersive">
        <!-- VIEWER HERO: dark canvas + centered media + overlay slots -->
        <section class="immersive__viewer">
            <!-- Header overlay: back-to-results (left) + work title (centered) -->
            <div
                class="immersive__overlay-top"
                id="immersiveOverlayTop">
                <a
                    class="immersive__back"
                    href="#{searchBean.lastUsedSearchUrl}"
                    title="#{msg.returnToHitlist}">
                    <util:icon-text
                        icon="arrow-narrow-left"
                        iconSvgClass="immersive__back-icon"
                        text="#{msg.returnToHitlist}" />
                </a>
                <div class="immersive__title">
                    <util:icon
                        icon="book"
                        svgClass="immersive__title-icon" />
                    <span class="immersive__title-text">#{activeDocumentBean.titleBarLabel}</span>
                </div>
            </div>

            <!-- Left toolbar: TOC + in-work search slide-out toggles -->
            <div
                class="immersive__toolbar immersive__toolbar--left"
                id="immersiveToolbarLeft">
                <ui:fragment rendered="#{activeDocumentBean.toc.hasChildren}">
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-immersive-panel="immersivePanelToc"
                        title="#{msg.sidebarTocAnchor}"
                        aria-label="#{msg.sidebarTocAnchor}">
                        <util:icon
                            icon="list"
                            svgClass="immersive__tool-icon" />
                    </button>
                </ui:fragment>
                <button
                    type="button"
                    class="immersive__tool-btn"
                    data-immersive-panel="immersivePanelSearch"
                    title="#{msg.search}"
                    aria-label="#{msg.search}">
                    <util:icon
                        icon="search"
                        svgClass="immersive__tool-icon" />
                </button>
            </div>

            <!-- Left slide-out panels (reused TOC + in-work search widgets) -->
            <ui:fragment rendered="#{activeDocumentBean.toc.hasChildren}">
                <aside
                    id="immersivePanelToc"
                    class="immersive__panel immersive__panel--left"
                    aria-hidden="true">
                    <widgetComponent:widget_toc />
                </aside>
            </ui:fragment>
            <aside
                id="immersivePanelSearch"
                class="immersive__panel immersive__panel--left"
                aria-hidden="true">
                <widgetComponent:widget_searchInCurrentItem />
            </aside>

            <!-- Central canvas: media-type dependent (universal view, mirrors viewObject.xhtml) -->
            <main
                class="immersive__canvas"
                id="immersiveCanvas">
                <!-- IMAGE (OSD, client-driven in-place navigation) -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.allowsImageView}">
                    <ui:include src="/resources/includes/immersive/iv_image.xhtml" />
                </h:panelGroup>
                <!-- VIDEO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.video}">
                    <ui:include src="/resources/includes/object/video.xhtml" />
                </h:panelGroup>
                <!-- AUDIO -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.audio}">
                    <ui:include src="/resources/includes/object/audio.xhtml" />
                </h:panelGroup>
                <!-- 3D -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.is3DModel()}">
                    <ui:fragment rendered="#{activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/voyager3d.xhtml" />
                    </ui:fragment>
                    <ui:fragment rendered="#{!activeDocumentBean.viewManager.currentPage.mimeType.matches('.*\\/gl(tf|b)(\\+json)?')}">
                        <ui:include src="/resources/includes/object/object3d.xhtml" />
                    </ui:fragment>
                </h:panelGroup>
                <!-- TEXT (sandboxed HTML) -->
                <h:panelGroup rendered="#{activeDocumentBean.viewManager.currentPage.mediaType.sandboxedHtml}">
                    <ui:include src="/resources/includes/object/text.xhtml" />
                </h:panelGroup>
            </main>

            <!-- Big page-turn chevrons (left/right, vertically centered) -->
            <button
                type="button"
                class="immersive__chevron immersive__chevron--left"
                data-immersive-page="prev"
                aria-label="#{msg.prevImage}">
                <util:icon
                    icon="chevron-left"
                    svgClass="immersive__chevron-svg" />
            </button>
            <button
                type="button"
                class="immersive__chevron immersive__chevron--right"
                data-immersive-page="next"
                aria-label="#{msg.nextImage}">
                <util:icon
                    icon="chevron-right"
                    svgClass="immersive__chevron-svg" />
            </button>

            <!-- Right toolbar (download / share / cite / overview / fullscreen) -->
            <div
                class="immersive__toolbar immersive__toolbar--right"
                id="immersiveToolbarRight">
                <!-- DOWNLOAD: whole-work PDF (B8) -->
                <ui:fragment rendered="#{activeDocumentBean.accessPermissionPdf}">
                    <a
                        class="immersive__tool-btn"
                        href="#{activeDocumentBean.viewManager.pdfDownloadLink}"
                        target="_blank"
                        rel="noopener"
                        title="#{msg.action__search_hit_download_pdf}"
                        aria-label="#{msg.action__search_hit_download_pdf}">
                        <util:icon
                            icon="download"
                            svgClass="immersive__tool-icon" />
                    </a>
                </ui:fragment>
                <!-- SHARE (B6): reuse social-media share widget in a popover -->
                <ui:fragment rendered="#{configurationBean.displaySocialMediaShareLinks}">
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-popover-element="#immersiveSharePopover"
                        data-popover-placement="left"
                        data-popover-dismiss="click-outside"
                        title="#{msg.action__share}"
                        aria-label="#{msg.action__share}">
                        <util:icon
                            icon="share"
                            svgClass="immersive__tool-icon" />
                    </button>
                </ui:fragment>
                <!-- CITE (B7): reuse citation widget in a popover -->
                <ui:fragment rendered="#{configurationBean.displaySidebarWidgetUsageCitationLinks}">
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-popover-element="#immersiveCitationPopover"
                        data-popover-placement="left"
                        data-popover-dismiss="click-outside"
                        title="#{msg.widget_citation}"
                        aria-label="#{msg.widget_citation}">
                        <util:icon
                            icon="quote"
                            svgClass="immersive__tool-icon" />
                    </button>
                </ui:fragment>
                <!-- OVERVIEW: thumbnail grid overlay (in-place navigation) -->
                <ui:fragment rendered="#{activeDocumentBean.viewManager.imagesCount ge 2}">
                    <button
                        type="button"
                        class="immersive__tool-btn"
                        data-immersive-action="overview"
                        title="#{msg.fullscreen_showThumbs}"
                        aria-label="#{msg.fullscreen_showThumbs}">
                        <util:icon
                            icon="layout-grid"
                            svgClass="immersive__tool-icon" />
                    </button>
                </ui:fragment>
                <!-- FULLSCREEN (H3): real browser fullscreen on the viewer hero -->
                <button
                    type="button"
                    class="immersive__tool-btn"
                    data-immersive-action="fullscreen"
                    title="#{msg.fullscreen_enter}"
                    aria-label="#{msg.fullscreen_enter}">
                    <util:icon
                        icon="maximize"
                        svgClass="immersive__tool-icon" />
                </button>
            </div>

            <!-- Bottom bar: paging + zoom (Mockup) -->
            <div
                class="immersive__bottombar"
                id="immersiveBottomBar">
                <button
                    type="button"
                    class="immersive__bar-btn"
                    data-immersive-page="prev"
                    title="#{msg.prevImage}"
                    aria-label="#{msg.prevImage}">
                    <util:icon
                        icon="chevron-left"
                        svgClass="immersive__bar-icon" />
                </button>
                <span
                    class="immersive__page-indicator"
                    id="immersivePageIndicator">
                    #{activeDocumentBean.viewManager.currentImageOrder}
                </span>
                <button
                    type="button"
                    class="immersive__bar-btn"
                    data-immersive-action="zoom-in"
                    title="#{msg.zoomIn}"
                    aria-label="#{msg.zoomIn}">
                    <util:icon
                        icon="plus"
                        svgClass="immersive__bar-icon" />
                </button>
                <button
                    type="button"
                    class="immersive__bar-btn"
                    data-immersive-action="zoom-out"
                    title="#{msg.zoomOut}"
                    aria-label="#{msg.zoomOut}">
                    <util:icon
                        icon="minus"
                        svgClass="immersive__bar-icon" />
                </button>
                <button
                    type="button"
                    class="immersive__bar-btn"
                    data-immersive-page="next"
                    title="#{msg.nextImage}"
                    aria-label="#{msg.nextImage}">
                    <util:icon
                        icon="chevron-right"
                        svgClass="immersive__bar-icon" />
                </button>
            </div>

            <!-- Overview thumbnail grid overlay (lazy-mounted riot tag) -->
            <div
                class="immersive__grid"
                id="immersiveGridOverlay"
                hidden="hidden">
                <button
                    type="button"
                    class="immersive__grid-close"
                    data-immersive-action="overview"
                    aria-label="#{msg.closeWindow}">
                    <util:icon
                        icon="x"
                        svgClass="immersive__tool-icon" />
                </button>
                <div
                    id="immersiveThumbnails"
                    class="immersive__grid-mount" />
            </div>
        </section>

        <!-- CONTENT REGION below the viewer - existing includes reused -->
        <div
            class="immersive__content container"
            id="immersiveContent">
            <!-- Related groups grid, reused from viewObject.xhtml -->
            <ui:include src="/resources/includes/record/relatedGroupsSection.xhtml" />
            <!-- Recommendations widget: re-enable once PR #104 adds recommendationsSection.xhtml to develop.
                 ui:remove strips the include at compile time so the missing file is never resolved. -->
            <ui:remove>
                <ui:include src="/resources/includes/record/recommendationsSection.xhtml" />
            </ui:remove>
            <!-- Bibliographic metadata, reused from viewObject.xhtml
                 (needs activeMetadataView from the preRenderView events on the page) -->
            <h:panelGroup rendered="#{metadataBean.activeMetadataView != null}">
                <ui:include src="/resources/includes/metadata/metadata.xhtml">
                    <ui:param
                        name="metadataViewIndex"
                        value="#{metadataBean.activeMetadataView.index}" />
                    <ui:param
                        name="metadataViewLabel"
                        value="#{metadataBean.activeMetadataView.label != null ? metadataBean.activeMetadataView.label : metadataBean.defaultMetadataLabel}" />
                </ui:include>
            </h:panelGroup>
            <!-- NET-NEW (#27445 TP3): administrative data box + function button cluster -
                 does not exist as an include yet -->
        </div>

        <!-- Popovers for the right-toolbar share/cite controls (global Bootstrap popover system) -->
        <ui:fragment rendered="#{configurationBean.displaySocialMediaShareLinks}">
            <popover id="immersiveSharePopover">
                <widgetComponent:widget_socialMedia_share />
            </popover>
        </ui:fragment>
        <ui:fragment rendered="#{configurationBean.displaySidebarWidgetUsageCitationLinks}">
            <popover id="immersiveCitationPopover">
                <widgetComponent:widget_citation id="immersiveCitationWidget" />
            </popover>
        </ui:fragment>
    </div>
</ui:composition>
