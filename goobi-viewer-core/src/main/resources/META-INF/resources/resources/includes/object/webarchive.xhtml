<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:viewer="http://xmlns.jcp.org/jsf/composite/components/partner"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:widgetComponent="http://xmlns.jcp.org/jsf/composite/components/widgets">
    <!-- VIEW VIDEO -->

    <script src="#{request.contextPath}/resources/javascript/libs/replaywebpage/ui.js" />

    <style>
        .replay-overlay {
    		  position: fixed;
			  left: 0;
			  top: 0;
			  width: 100vw;
			  height: 100vh;
			  z-index: 1001;
    	}
    	.replay-overlay__header {
		  height: 0;
		}
		.overlay-plain .close {
			top: 10px;
		}
    </style>

    <div
        id="webarchiveContainer"
        class="view-object__webarchive"
        data-allow-download="#{activeDocumentBean.viewManager.currentPage.accessPermissionImageDownload}">
        <!-- WEBARCHIVE -->
        <div
            class="metadata-custom__wrapper"
            data-access="#{activeDocumentBean.viewManager.isAccessPermission('VIEW_IMAGES')}"
            jsf:id="webArchiveArea"
            rendered="#{activeDocumentBean.viewManager.webArchive and activeDocumentBean.viewManager.isAccessPermission('VIEW_IMAGES')}">
            <div class="metadata-custom__webarchive-inner">
                <button
                    class="btn btn--full"
                    id="overlayButton">
                    #{msg.show}
                </button>
            </div>

            <div
                class="test-wrapper"
                data-overlay="content"
                data-overlay-trigger="overlayButton"
                data-overlay-fullscreen="true">
                <viewerComponent:webarchive logo="#{adminThemesBean.getLogo('/images/goobi_logo.svg', 200, 120)}" />
            </div>
        </div>

        <!-- ACCESS DENIED DESCRIPTION TEXT -->
        <h:panelGroup
            styleClass="view-object__access-denied-text"
            rendered="#{!activeDocumentBean.viewManager.currentPage.accessPermissionObject and activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForVideo(navigationHelper.locale) != null}">
            <h:outputText
                escape="false"
                value="#{activeDocumentBean.viewManager.currentPage.getAccessDeniedDescriptionTextForVideo(navigationHelper.locale)}" />
        </h:panelGroup>
    </div>
</ui:composition>
