<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components">
    <!-- CHANGE RECORD LOCALE -->
    <viewerComponent:changeRecordLocale />

    <!-- METADATA -->
    <div
        id="metadataElementWrapper"
        class="metadata">
        <!-- FORCED RELOAD, KEPT FOR THE REQUEST -->
        <c:set
            scope="request"
            var="metadataElementList"
            value="#{metadataBean.getMetadataElementList(metadataViewIndex, true)}" />

        <!-- TITLE -->
        <div class="metadata__title-wrapper">
            <div
                id="title"
                class="title">
                <!-- TITLE HEADER -->
                <div class="title__header">
                    <h1 class="h2">
                        <!-- PAGE TYPE -->
                        <span class="title__header-page-type">
                            <h:outputText
                                value="#{msg[navigationHelper.currentView]}"
                                escape="false" />
                            :
                        </span>

                        <!-- RECORD TITLE -->
                        <span class="title__header-label">#{activeDocumentBean.titleBarLabel}</span>

                        <!-- ADD TO BOOKMARK -->
                        <ui:fragment rendered="#{configurationBean.bookmarksEnabled and activeDocumentBean.viewManager.metadataViewOnly}">
                            <button
                                type="button"
                                class="btn btn--icon metadata__bookmark-button bookmark-toggle__button"
                                aria-label="#{msg.bookmarkList_addToBookmarkList}"
                                data-bookmark-list-type="add"
                                data-pi="#{activeDocumentBean.viewManager.pi}"
                                data-page="#{activeDocumentBean.viewManager.currentImageOrder}"
                                title="#{msg.bookmarkList_addToBookmarkList}"
                                data-bookmark-list-title-add="#{msg.bookmarkList_addToBookmarkList}"
                                data-bookmark-list-title-added="#{msg.bookmarkList_removeFromBookmarkList}"
                                data-toggle="tooltip"
                                data-placement="top">
                                <span class="bookmark-toggle">
                                    <util:icon
                                        icon="bookmark"
                                        svgClass="icon icon-lg"
                                        styleClass="bookmark-toggle__icon bookmark-toggle__icon--outline" />
                                    <util:icon
                                        icon="bookmark"
                                        filled="true"
                                        svgClass="icon icon-lg"
                                        styleClass="bookmark-toggle__icon bookmark-toggle__icon--filled" />
                                </span>
                            </button>
                        </ui:fragment>

                        <!-- COPYRIGHT INDICATOR -->
                        <ui:fragment rendered="#{configurationBean.copyrightIndicatorStyle == 'trafficlight'}">
                            <viewerComponent:copyrightIndicator />
                        </ui:fragment>
                    </h1>
                </div>
            </div>
        </div>

        <!-- BORN DIGITAL MATERIALS -->
        <h:panelGroup rendered="#{activeDocumentBean.viewManager.hasDownloadResources or activeDocumentBean.viewManager.hasExternalResources}">
            <viewerComponent:bornDigital />
            <viewerComponent:modalDownloadTicket />
            <div class="clearfix" />
        </h:panelGroup>

        <!-- METADATA ELEMENTS -->
        <c:forEach
            items="#{metadataElementList}"
            var="metadataElement"
            varStatus="status">
            <ui:include src="/resources/includes/metadata/metadataElement.xhtml">
                <ui:param
                    name="metadataElement"
                    value="#{metadataElement}" />
            </ui:include>
        </c:forEach>

        <!-- EVENT METADATA -->
        <c:forEach
            items="#{metadataBean.events}"
            var="event">
            <div class="metadata__events">
                <div class="metadata__elements metadata__elements-level-0 metadata__grouped-wrapper">
                    <h3 class="metadata__heading level-0">
                        <h:outputText
                            value="#{msg[event.label]}"
                            escape="false" />
                    </h3>
                    <c:forEach
                        items="#{event.metadata}"
                        var="metadata">
                        <ui:fragment rendered="#{!metadata.blank}">
                            <div class="metadata__event-inside-wrapper">
                                <dl class="dl-horizontal metadata__event-dl">
                                    <dt title="#{metadata.label}">
                                        <h:outputText
                                            value="#{msg[metadata.label]}:"
                                            escape="false" />
                                    </dt>

                                    <!-- STANDARD STRUCTURE FOR METADATA -->
                                    <ui:fragment>
                                        <!-- GROUPED VALUES -->
                                        <ui:fragment rendered="#{metadata.group}">
                                            <c:forEach
                                                items="#{metadata.values}"
                                                var="val">
                                                <dd>
                                                    <ui:fragment rendered="#{val.accessRestricted}">
                                                        <span
                                                            class="metadata__locked-value-icon"
                                                            data-toggle="tooltip"
                                                            title="#{msg.metadata__restricted_value_tooltip}">
                                                            <util:icon icon="lock-open-2" />
                                                        </span>
                                                    </ui:fragment>
                                                    <h:outputFormat
                                                        value="#{val.getDisplayValue(navigationHelper.locale, true)}"
                                                        escape="false" />
                                                </dd>
                                            </c:forEach>
                                        </ui:fragment>

                                        <!-- UNGROUPED VALUES -->
                                        <ui:fragment rendered="#{!metadata.group}">
                                            <c:forEach
                                                items="#{metadata.values}"
                                                var="val">
                                                <dd>
                                                    <span class="metadata__element-value">
                                                        <h:outputFormat
                                                            value="#{val.getDisplayValue(navigationHelper.locale)}"
                                                            escape="false" />
                                                    </span>
                                                </dd>
                                            </c:forEach>
                                        </ui:fragment>
                                    </ui:fragment>
                                </dl>
                            </div>
                        </ui:fragment>
                    </c:forEach>
                </div>
            </div>
        </c:forEach>
    </div>
    <div class="clearfix" />
</ui:composition>
