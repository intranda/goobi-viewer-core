<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <composite:interface />

    <composite:implementation>
        <h:panelGroup
            styleClass="admin__breadcrumbs-wrapper"
            layout="block">
            <div
                id="admin__breadcrumbs"
                class="admin__breadcrumbs-inner">
                <nav
                    class="admin__breadcrumbs"
                    aria-label="admin__breadcrumbs">
                    <ul class="admin__breadcrumbs-list">
                        <ui:repeat
                            value="#{breadcrumbBean.breadcrumbs}"
                            var="breadcrumb"
                            varStatus="status">
                            <!-- FIRST BREADCRUMB, TEXT ON THE HOMEPAGE -->
                            <h:panelGroup rendered="#{(status.first and status.last)}">
                                <li
                                    class="admin__breadcrumbs-crumb-point"
                                    aria-current="page">
                                    <span class="admin__breadcrumbs-crumb">
                                        <h:outputText
                                            escape="false"
                                            value="#{msg[breadcrumb.name]}" />
                                    </span>
                                </li>
                            </h:panelGroup>

                            <!-- FIRST BREADCRUMB, LINK ELSEWHERE -->
                            <h:panelGroup rendered="#{(status.first and !status.last and breadcrumb.link)}">
                                <li class="admin__breadcrumbs-crumb-point">
                                    <a
                                        class="admin__breadcrumbs-crumb"
                                        href="#{breadcrumb.url}">
                                        <h:outputText
                                            escape="false"
                                            value="#{msg[breadcrumb.name]}" />
                                    </a>
                                </li>
                            </h:panelGroup>

                            <!-- BREADCRUMB TEXT LINKS - PAGES IN BETWEEN  -->
                            <h:panelGroup rendered="#{!status.last and !status.first and breadcrumb.link}">
                                <li class="admin__breadcrumbs-crumb-point">
                                    <a
                                        class="admin__breadcrumbs-crumb"
                                        href="#{breadcrumb.url}">
                                        <h:outputText
                                            escape="false"
                                            value="#{msg[breadcrumb.name]}" />
                                    </a>
                                </li>
                            </h:panelGroup>

                            <!-- BREADCRUMB TEXT - ACTUAL PAGE USER IS ON -->
                            <h:panelGroup rendered="#{(!status.first and status.last)}">
                                <li
                                    class="admin__breadcrumbs-crumb-point -actualPage"
                                    aria-current="page">
                                    <span class="admin__breadcrumbs-crumb">
                                        <h:outputText
                                            escape="false"
                                            value="#{msg[breadcrumb.name]}" />
                                    </span>
                                </li>
                            </h:panelGroup>
                        </ui:repeat>
                    </ul>
                </nav>
            </div>
        </h:panelGroup>
    </composite:implementation>
</ui:composition>
