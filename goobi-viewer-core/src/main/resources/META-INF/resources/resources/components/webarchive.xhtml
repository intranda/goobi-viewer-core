<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:util="http://goobi.io/util"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <composite:interface>
        <composite:attribute
            name="archiveUrl"
            required="false"
            default="#{request.contextPath}/api/v1/records/#{activeDocumentBean.viewManager.pi}/webarchives.json" />
        <composite:attribute
            name="startPageUrl"
            required="false"
            default="#{activeDocumentBean.viewManager.webArchiveSeedUrl}" />
        <composite:attribute
            name="logo"
            required="false" />
    </composite:interface>

    <composite:implementation>
        <script src="#{request.contextPath}/resources/javascript/libs/replaywebpage/ui-modded.js" />

        <div class="replay-overlay">
            <div class="replay-overlay__header">
                <div class="replay-overlay__header-inner">
                    <div class="replay-overlay__header-logo">
                        <ui:fragment rendered="#{not empty cc.attrs.logo}">
                            <a href="#{request.contextPath}/">
                                <img
                                    src='#{adminThemesBean.getLogo("/images/template/svgs/zlb_logo_color.svg", 200, 120)}'
                                    alt="#{adminThemesBean.getThemeLabel(configurationBean.name)} Logo" />
                            </a>
                        </ui:fragment>
                    </div>
                    <div class="replay-overlay__header-text-wrapper">
                        <div class="replay-overlay__header-text">
                            <h:outputText
                                value="#{navigationHelper.getTranslationWithParamsUnescaped(msg.customer__webarchive_head_description, activeDocumentBean.viewManager.topStructElement.getMetadataValue('MD_DATECRAWLED'))}"
                                escape="false" />
                        </div>
                    </div>
                    <div class="replay-overlay__header-close">
                        <button
                            data-overlay-action="dismiss"
                            aria-label="Close">
                            <util:icon icon="x" />
                        </button>
                    </div>
                </div>
            </div>

            <!--                                  <replay-web-page -->
            <!--      					            embed="full" -->
            <!--      					            replayBase="#{request.contextPath}/resources/javascript/libs/replaywebpage/" -->
            <!--      					            url="https://www.gedenktafeln-in-berlin.de/" -->
            <!--      					            source="https://app.browsertrix.com/api/orgs/e77cf10b-dfc8-4c14-811c-24bb338bdf10/collections/312ab30f-5a13-46a9-81a3-e9a43c3e40bf/public/replay.json" /> -->
            <replay-web-page
                embed="full"
                noMediaDownload="true"
                url="#{cc.attrs.startPageUrl}"
                replayBase="#{request.contextPath}/resources/javascript/libs/replaywebpage/"
                source="#{cc.attrs.archiveUrl}" />

            <script>
		 		//HIDE FOWNLOAD BUTTON
			  //<![CDATA[
		 		document.addEventListener('DOMContentLoaded', function () {
			      var rwp = document.querySelector('replay-web-page');
			      if (!rwp) return;
	
			      function injectCSS(wrItem) {
			    	  console.log("inject css ", wrItem);
			    	  window.item = wrItem;
			          if (!wrItem.shadowRoot) return;
			          console.log("create style")
			          var style = document.createElement('style');
			          style.textContent =
			              'a.dropdown-item[href$=".json"] { display: none !important; }' +
			              'hr.dropdown-divider:has(+ a.dropdown-item[href$=".json"]) { display: none !important; }';
			          wrItem.shadowRoot.appendChild(style);
			      }
	
			      function waitForWrItem(doc) {
			          var replayApp = doc.querySelector('replay-app-main');
			          if (!replayApp || !replayApp.shadowRoot) {
			              setTimeout(function () { waitForWrItem(doc); }, 300);
			              return;
			          }
			          var wrItem = replayApp.shadowRoot.querySelector('wr-item');
			          if (wrItem) { injectCSS(wrItem); return; }
			          var obs = new MutationObserver(function () {
			              var wi = replayApp.shadowRoot.querySelector('wr-item');
			              if (wi) { obs.disconnect(); injectCSS(wi); }
			          });
			          obs.observe(replayApp.shadowRoot, { childList: true, subtree: true });
			      }
	
			      function waitForIframe() {
			          if (!rwp.shadowRoot) { setTimeout(waitForIframe, 100); return; }
			          var iframe = rwp.shadowRoot.querySelector('iframe');
			          if (!iframe) { setTimeout(waitForIframe, 100); return; }
			          iframe.addEventListener('load', function () {
			              if (iframe.contentDocument) waitForWrItem(iframe.contentDocument);
			          });
			          if (iframe.contentDocument && iframe.contentDocument.readyState !== 'loading')
			              waitForWrItem(iframe.contentDocument);
			      }
	
			      waitForIframe();
			  });
		 		//]]>
			</script>
        </div>
    </composite:implementation>
</ui:composition>
