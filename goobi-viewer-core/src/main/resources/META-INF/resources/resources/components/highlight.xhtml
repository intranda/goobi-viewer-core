<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html">
    <composite:interface>
        <composite:attribute
            name="imageSizeWidth"
            required="false"
            default="2000" />
        <composite:attribute
            name="imageSizeHeight"
            required="false"
            default="2100" />
        <composite:attribute
            name="displayMetadata"
            required="false"
            default="#{false}" />
    </composite:interface>

    <composite:implementation>
        <!-- HIGHLIGHT FOR THE CURRENT DATE -->
        <c:set
            scope="request"
            var="highlight"
            value="#{highlightsBean.currentHighlight}" />
        <h:panelGroup
            styleClass="highlighted-object"
            layout="block"
            rendered="#{highlight != null}">
            <!-- WITH IMAGE, LINK AND TITLE -->
            <ui:fragment rendered="#{highlight.hasImageURI()}">
                <a
                    class="highlighted-object__link"
                    href="#{highlightsBean.getUrl(highlight)}"
                    title="#{msg.action__open_record}: #{highlight.data.name.textOrDefault}">
                    <figure class="highlighted-object__figure">
                        <img
                            class="highlighted-object__image"
                            alt="#{highlight.data.name.textOrDefault}"
                            title="#{msg.image}: #{highlight.data.name.textOrDefault}"
                            src="#{highlight.getImageURI(cc.attrs.imageSizeWidth, cc.attrs.imageSizeHeight)}" />
                        <figcaption class="highlighted-object__image-title">#{highlight.data.name.textOrDefault}</figcaption>
                    </figure>
                </a>
            </ui:fragment>

            <!-- WITHOUT IMAGE, LINK ONLY -->
            <ui:fragment rendered="#{!highlight.hasImageURI()}">
                <a
                    class="highlighted-object__no-image-link"
                    href="#{highlightsBean.getUrl(highlight)}"
                    title="#{msg.action__open_record}: #{highlight.data.name.textOrDefault}">
                    #{highlight.data.name.textOrDefault}
                </a>
            </ui:fragment>
            <ui:fragment rendered="#{not empty highlight.metadataList}">
                <c:forEach
                    items="#{highlight.metadataList}"
                    var="metadata">
                    <h:panelGroup rendered="#{!metadata.blank}">
                        <!-- GROUPED VALUES -->
                        <h:panelGroup rendered="#{metadata.group}">
                            <!-- SINGLE STRING -->
                            <h:panelGroup rendered="#{metadata.singleString}">
                                <ui:include src="/resources/includes/metadata/metadataSingleString.xhtml">
                                    <ui:param
                                        name="metadata"
                                        value="#{metadata}" />
                                </ui:include>
                            </h:panelGroup>

                            <!-- KEY VALUE PAIRS -->
                            <h:panelGroup rendered="#{!metadata.singleString}">
                                <ui:include src="/resources/includes/metadata/metadataKeyValuePairs.xhtml">
                                    <ui:param
                                        name="metadata"
                                        value="#{metadata}" />
                                </ui:include>
                            </h:panelGroup>
                        </h:panelGroup>

                        <!-- UNGROUPED VALUES -->
                        <h:panelGroup
                            styleClass="metadata__ungrouped-wrapper"
                            layout="block"
                            rendered="#{!metadata.group}">
                            <dl class="dl-horizontal metadata__element-dl metadata__element-ungrouped">
                                <dt title="#{metadata.label}">
                                    <h:outputText
                                        value="#{msg[metadata.label]}:"
                                        escape="false" />
                                </dt>
                                <ui:repeat
                                    value="#{metadata.values}"
                                    var="val">
                                    <dd>
                                        <span class="metadata__element-value">
                                            <h:outputFormat
                                                value="#{val.getDisplayValue(navigationHelper.locale)}"
                                                escape="false" />
                                        </span>
                                    </dd>
                                </ui:repeat>
                            </dl>
                        </h:panelGroup>
                    </h:panelGroup>
                </c:forEach>
            </ui:fragment>
        </h:panelGroup>
    </composite:implementation>
</ui:composition>
