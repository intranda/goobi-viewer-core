<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <!-- INTERFACE -->
    <composite:interface>
        <!-- THEME PATH -->
        <composite:attribute
            name="themePath"
            required="true"
            default="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/" />

        <!-- IMAGE PATH IN THE THEME FOLDER -->
        <composite:attribute
            name="imagePath"
            required="true"
            default="images/gallery/" />

        <!-- JSON FILE PATH IN THE THEME FOLDER -->
        <composite:attribute
            name="imageDataFile"
            required="true"
            default="javascript/data/responsiveGalleryData.json" />

        <!-- GALLERY COLUMNS, MAX 4 -->
        <composite:attribute
            name="maxColumnCount"
            required="true"
            default="3" />

        <!-- IMAGES PER COLUMN -->
        <composite:attribute
            name="maxImagesPerColumn"
            required="true"
            default="3" />

        <!-- FIXED IMAGE HEIGHT FOR MIXED SIZES -->
        <composite:attribute
            name="fixedHeight"
            required="true"
            default="false" />

        <!-- FIXED HEIGHT IN PX -->
        <composite:attribute
            name="maxHeight"
            required="true"
            default="150px" />

        <!-- IMAGE CAPTION -->
        <composite:attribute
            name="caption"
            required="true"
            default="true" />

        <!-- MOUSEOVER COLOR, HEX -->
        <composite:attribute
            name="overlayColor"
            required="true"
            default="#304d6f" />

        <!-- LIGHTBOX -->
        <composite:attribute
            name="lbActive"
            required="true"
            default="true" />

        <!-- LIGHTBOX CAPTION -->
        <composite:attribute
            name="lbCaption"
            required="true"
            default="true" />
    </composite:interface>

    <!-- CONTENT -->
    <composite:implementation>
        <!-- RESPONSIVE COLUMN GALLERY -->
        <div id="responsiveColumnGallery" />

        <!-- GALLERY SCRIPT -->
        <script type="text/javascript">
            var rcgConfig = {
                themePath: "#{cc.attrs.themePath}",
                imagePath: "#{cc.attrs.imagePath}",
                imageDataFile: "#{cc.attrs.imageDataFile}",
                galleryObject: $('#responsiveColumnGallery'),
                maxColumnCount: #{cc.attrs.maxColumnCount},
                maxImagesPerColumn: #{cc.attrs.maxImagesPerColumn},
                fixedHeight: #{cc.attrs.fixedHeight},
                maxHeight: "#{cc.attrs.maxHeight}",
                caption: #{cc.attrs.caption},
                overlayColor: "#{cc.attrs.overlayColor}",
                lightbox: {
                    active: #{cc.attrs.lbActive},
                    caption: #{cc.attrs.lbCaption},
                },
                lang: {
                    close: "#{msg.rcg_closeWindow}",
                    showLightbox: "#{msg.rcg_showLightbox}",
                    goToWork: "#{msg.rcg_goToWork}",
                },
            };

            viewerJS.responsiveColumnGallery.init(rcgConfig);
        </script>
    </composite:implementation>
</ui:composition>
