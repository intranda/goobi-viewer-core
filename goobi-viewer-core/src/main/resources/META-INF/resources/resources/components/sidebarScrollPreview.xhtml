<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface />

    <composite:implementation>
        <div
            id="sidebarScrollPreview"
            class="sidebar-scroll-preview">
            <div class="sidebar-scroll-preview__inner">
                <div
                    class="sidebar-scroll-preview__grid"
                    data-target="sidebarScrollPreviewContainer">
                    <ui:repeat
                        var="page"
                        value="#{activeDocumentBean.viewManager.allPages}">
                        <div class="sidebar-scroll-preview__item">
                            <ui:fragment rendered="#{page != null}">
                                <!-- NON SEQUENCE MODE LINKS -->
                                <ui:fragment rendered="#{!page.mediaType.allowsImageView or activeDocumentBean.viewManager.pageNavigation.name() != 'SEQUENCE'}">
                                    <h:outputLink
                                        styleClass="sidebar-scroll-preview__link"
                                        value="#{activeDocumentBean.getPageUrl(page.order)}#topDocAnchor">
                                        <span class="sidebar-scroll-preview__image-wrapper">
                                            <img
                                                data-script="fadeIn"
                                                loading="lazy"
                                                class="sidebar-scroll-preview__image"
                                                alt=""
                                                data-viewer-thumbnail="thumbnail"
                                                src="#{imageDelivery.thumbs.getThumbnailUrl(page, 400, 400)}"
                                                data-viewer-access-denied-url="#{page.getAccessDeniedThumbnailUrl(navigationHelper.locale)}" />
                                            <span class="sidebar-scroll-preview__button-text">#{msg.page} #{page.order}:#{page.orderLabel}</span>
                                        </span>
                                        <f:passThroughAttribute
                                            name="data-target"
                                            value="pageNumber-#{page.order}" />
                                    </h:outputLink>
                                </ui:fragment>

                                <!-- SEQUENCE MODE BUTTONS -->
                                <ui:fragment rendered="#{page.mediaType.allowsImageView and activeDocumentBean.viewManager.pageNavigation.name() == 'SEQUENCE'}">
                                    <button
                                        type="button"
                                        class="sidebar-scroll-preview__button"
                                        data-target="pageNumber-#{page.order}">
                                        <span class="sidebar-scroll-preview__image-wrapper">
                                            <img
                                                data-script="fadeIn"
                                                loading="lazy"
                                                class="sidebar-scroll-preview__image"
                                                data-viewer-thumbnail="thumbnail"
                                                src="#{imageDelivery.thumbs.getThumbnailUrl(page, 400, 400)}"
                                                data-viewer-access-denied-url="#{page.getAccessDeniedThumbnailUrl(navigationHelper.locale)}" />
                                            <span class="sidebar-scroll-preview__button-text">#{page.order}:#{page.orderLabel}</span>
                                        </span>
                                    </button>
                                </ui:fragment>
                            </ui:fragment>
                        </div>
                    </ui:repeat>
                </div>
            </div>
        </div>

        <!-- SCROLL PREVIEW SCRIPT -->
        <script>
            // <![CDATA[
            $('[data-script="fadeIn"]').each(function () {
                var $img = $(this);
                if (this.complete && this.naturalWidth > 0) {
                    $img.addClass('-loaded');
                } else {
                    $img.on('load', function () {
                        $(this).addClass('-loaded');
                    });
                }
            });

            $(document).ready(function () {
                // console.log('current picture is:' + #{activeDocumentBean.viewManager.currentImageOrder})

                const sidebarScrollPreviewContainer = $('[data-target="sidebarScrollPreviewContainer"]');
                const loadPageSelector = '[data-target="pageNumber-' + #{activeDocumentBean.viewManager.currentImageOrder} + '"]';
                new SimpleBar($(sidebarScrollPreviewContainer)[0], { autoHide: false, scrollbarMinSize: 30 });
                const sidebarScrollPreviewSimplebarContainer = $('.simplebar-content-wrapper');

                function scrollSidebarPreviewFunction(imageActiveIndexSidebar, jumpStraight) {
                    if (typeof sidebarScrollPreviewSimplebarContainer !== 'undefined') {
                        if (jumpStraight == 1) {
                            $(sidebarScrollPreviewSimplebarContainer).animate(
                                {
                                    scrollTop:
                                        $(sidebarScrollPreviewSimplebarContainer).scrollTop() +
                                        ($(imageActiveIndexSidebar).offset().top - $(sidebarScrollPreviewSimplebarContainer).offset().top),
                                },
                                0
                            );
                        } else {
                            $(sidebarScrollPreviewSimplebarContainer).animate(
                                {
                                    scrollTop:
                                        $(sidebarScrollPreviewSimplebarContainer).scrollTop() +
                                        ($(imageActiveIndexSidebar).offset().top - $(sidebarScrollPreviewSimplebarContainer).offset().top),
                                },
                                180
                            );
                        }
                    }
                    $('[data-target^=pageNumber-]').removeClass('-highlighted');
                    $(imageActiveIndexSidebar).addClass('-highlighted');

                    $('[data-target^=pageNumber-]').removeAttr('aria-label');
                    $(imageActiveIndexSidebar).attr('aria-label', '#{msg.a11y__active_page}');
                }

                scrollSidebarPreviewFunction(loadPageSelector, (jumpStraight = 1));

                imageOrderChanged.subscribe((pageNo) => {
                    pageNumberSelector = '[data-target="pageNumber-' + pageNo + '"]';
                    scrollSidebarPreviewFunction(pageNumberSelector, (jumpStraight = 0));
                });

                $('button[data-target^=pageNumber-]').on('click', function () {
                    var setDataTargetOnClickVarValue = $(this).attr('data-target');

                    var extractedPageNumber = setDataTargetOnClickVarValue.replace(/[^0-9]/gi, '');

                    changeImageOrder.next(extractedPageNumber);

                    var scrollOnClickPageNumberTarget = '[data-target="pageNumber-' + extractedPageNumber + '"]';
                    scrollSidebarPreviewFunction(scrollOnClickPageNumberTarget, (jumpStraight = 0));

                    $('[data-target^=pageNumber-]').removeClass('-highlighted');
                    $(this).addClass('-highlighted');
                });
            });
            // ]]>
        </script>
    </composite:implementation>
</ui:composition>
