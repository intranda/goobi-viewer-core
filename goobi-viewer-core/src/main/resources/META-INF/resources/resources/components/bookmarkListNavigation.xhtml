<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <!-- INTERFACE -->
    <composite:interface />

    <!-- CONTENT -->
    <composite:implementation>
        <ui:fragment rendered="#{configurationBean.bookmarksEnabled}">
            <!-- BOOKMARK LIST NAVIGATION -->
            <div class="bookmark-navigation">
                <!-- BOOKMARK LIST NAVIGATION DROPDOWN WRAPPER -->
                <div class="bookmark-navigation__dropdown-wrapper">
                    <!-- BOOKMARK LIST NAVIGATION TOGGLE DROPDOWN -->
                    <button
                        type="button"
                        class="btn btn--clean"
                        data-bookmark-list-type="dropdown">
                        <!-- BOOKMARK LIST NAVIGATION STRING -->
                        <span class="bookmark-navigation__string">#{msg.bookmarkList}</span>

                        <!-- BOOKMARK LIST NAVIGATION COUNTER -->
                        <span
                            class="bookmark-navigation__counter"
                            data-bookmark-list-type="counter"
                            data-toggle="tooltip"
                            data-placement="bottom"
                            data-trigger="hover"
                            title="#{msg.wl_watchListItems}" />
                    </button>
                </div>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
