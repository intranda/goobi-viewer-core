<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:component="http://xmlns.jcp.org/jsf/composite/components">
    <!-- RECURSION VIA UI:INCLUDE, A SELF-INCLUDING COMPOSITE OVERFLOWS -->
    <!-- C:FOREACH, NOT UI:REPEAT (ITS VAR RECURSES IN THE NESTED UI:PARAM) -->
    <ul class="view-sitemap__list">
        <c:forEach
            var="navItem"
            items="#{items}">
            <h:panelGroup rendered="#{navItem.valid and navItem.shouldDisplay}">
                <li class="view-sitemap__list-item">
                    <component:navigationLink
                        navItem="#{navItem}"
                        linkClass="view-sitemap__list-link" />
                    <h:panelGroup rendered="#{!navItem.activeChildItems.isEmpty()}">
                        <ui:include src="/resources/components/sitemapNavTree.xhtml">
                            <ui:param
                                name="items"
                                value="#{navItem.activeChildItems}" />
                        </ui:include>
                    </h:panelGroup>
                </li>
            </h:panelGroup>
        </c:forEach>
    </ul>
</ui:composition>
