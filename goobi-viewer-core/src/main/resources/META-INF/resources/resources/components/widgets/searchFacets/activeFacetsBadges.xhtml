<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:util="http://goobi.io/util">
    <!-- INTERFACE OPTIONS -->
    <composite:interface>
        <composite:attribute
            name="mode"
            type="java.lang.String"
            required="false"
            default="widgets" />
        <composite:attribute
            name="cmsPage"
            type="io.goobi.viewer.model.cms.pages.CMSPage"
            required="false"
            default="#{null}" />
    </composite:interface>

    <!-- COMPONENT CONTENT -->
    <composite:implementation>
        <h:panelGroup
            layout="block"
            styleClass="active-facets-badges #{cc.attrs.mode eq 'combined' ? '' : 'widget widget-active-facets'}"
            rendered="#{not empty searchBean.facets.activeFacets}">
            <ui:fragment rendered="#{cc.attrs.mode ne 'combined'}">
                <div class="widget__topbar widget-active-facets__topbar">
                    <h2 class="widget__title widget-active-facets__title">#{msg.search__active_facets__title}</h2>
                    <h:outputLink
                        styleClass="widget-active-facets__reset"
                        value="#{navigationHelper.getSearchUrl(searchBean.activeSearchType, cc.attrs.cmsPage)}/#{searchBean.activeContext}/#{searchBean.exactSearchString}/1/#{searchBean.sortString}/-/#{navigationHelper.subThemeQueryParam}"
                        title="#{msg.search__combined_facets__reset_all}">
                        <util:icon-text
                            icon="x"
                            iconSvgClass="widget-active-facets__reset-icon-svg"
                            text="#{msg.search__combined_facets__reset_all}"
                            textClass="widget-active-facets__reset-label" />
                    </h:outputLink>
                </div>
            </ui:fragment>
            <h:form styleClass="#{cc.attrs.mode eq 'combined' ? '' : 'widget__body widget-active-facets__body'}">
                <ul
                    class="active-facets-badges__list"
                    data-badges="activeFacets"
                    data-more-label="#{msg.search__active_facets__more}">
                    <c:forEach
                        items="#{searchBean.facets.activeFacets}"
                        var="facet">
                        <li class="active-facets-badges__list-item">
                            <h:commandLink
                                styleClass="active-facets-badges__badge #{facet.excluded ? '-excluded' : ''}"
                                action="#{searchBean.removeFacetAction(facet.link)}"
                                title="#{msg.removeFacet}">
                                <f:passThroughAttribute
                                    name="data-badge"
                                    value="facet" />
                                <ui:fragment rendered="#{facet.excluded}">
                                    <span class="sr-only">#{msg.search__active_facets__excluded}:</span>
                                </ui:fragment>
                                <c:if test="#{searchBean.facets.geoFacetFields.contains(facet.field) or not empty facet.value2}">
                                    <span class="active-facets-badges__badge-field">#{msg[facet.field]}:</span>
                                </c:if>
                                <span class="active-facets-badges__badge-label">
                                    <c:choose>
                                        <c:when test="#{searchBean.facets.geoFacetFields.contains(facet.field)}">#{msg.search__active_facets__geo}</c:when>
                                        <c:when test="#{not empty facet.value2}">
                                            #{facet.value} &#8211; #{facet.value2}
                                        </c:when>
                                        <c:otherwise>#{facet.translatedLabel}</c:otherwise>
                                    </c:choose>
                                </span>
                                <span class="sr-only">(#{msg.removeFacet})</span>
                                <span
                                    class="active-facets-badges__badge-remove"
                                    aria-hidden="true">
                                    <util:icon
                                        icon="x"
                                        svgClass="active-facets-badges__badge-remove-icon-svg" />
                                </span>
                            </h:commandLink>
                        </li>
                    </c:forEach>
                </ul>
            </h:form>
            <script>viewerJS.activeFacetsBadges.init();</script>
        </h:panelGroup>
    </composite:implementation>
</ui:composition>
