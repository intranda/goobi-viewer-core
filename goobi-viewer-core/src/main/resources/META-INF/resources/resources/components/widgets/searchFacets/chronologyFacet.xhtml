<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:util="http://goobi.io/util">
    <!-- INTERFACE OPTIONS -->
    <composite:interface>
        <composite:attribute
            name="field"
            type="java.lang.String"
            required="true" />
        <composite:attribute
            name="index"
            type="java.lang.Integer"
            required="true" />
        <composite:attribute
            name="headingLevel"
            type="java.lang.String"
            required="false"
            default="2" />
    </composite:interface>

    <!-- COMPONENT CONTENT -->
    <composite:implementation>
        <h:outputScript
            name="resources/javascript/libs/chartjs/chart.umd.js"
            target="head" />

        <!--  WIDGET CHRONOLOGY -->
        <ui:fragment rendered="#{searchBean.facets.hasRangeFacets and !searchBean.facets.getValueRange(cc.attrs.field).isEmpty()}">
            <div class="widget widget-chronology-slider">
                <div class="widget__topbar widget-chronology-slider__topbar">
                    <div class="widget-chronology-slider__item chronology-slider-label">
                        <h2
                            class="widget__title widget-chronology-slider__title"
                            aria-level="#{cc.attrs.headingLevel}">
                            #{msg.widgetChronology_label}: #{msg[cc.attrs.field]}
                        </h2>
                    </div>
                    <div class="widget-chronology-slider__item chronology-slider-actions">
                        <div
                            id="chronologyLoader-#{cc.attrs.index}"
                            class="widget-chronology-slider__item chronology-slider-action-loader">
                            <img
                                src="#{request.contextPath}/resources/images/infinity_loader.svg"
                                alt="" />
                        </div>
                        <div class="widget-chronology-slider__item chronology-slider-action-reset #{searchBean.facets.isRangeFacetActive(cc.attrs.field) ? 'active':''}">
                            <h:form>
                                <button
                                    class="widget-chronology-slider__action-reset-button"
                                    title="#{msg.removeFacet}"
                                    data-toggle="tooltip"
                                    data-placement="top"
                                    data-reset="chrono-slider"
                                    jsf:action="#{searchBean.removeRangeFacetAction(cc.attrs.field)}"
                                    aria-label="#{msg.removeFacet}">
                                    <util:icon
                                        icon="x"
                                        svgClass="widget__topbar-icon-svg widget-chronology-slider__topbar-icon-svg" />
                                </button>
                            </h:form>
                        </div>
                    </div>
                    <!-- SECTION COLLAPSE -->
                    <button
                        type="button"
                        class="btn btn--clean widget-search-facets__section-toggle"
                        data-section-toggle="#{cc.attrs.field}"
                        aria-expanded="true"
                        aria-label="#{msg.widgetChronology_label}: #{msg[cc.attrs.field]}">
                        <util:icon
                            icon="chevron-down"
                            svgClass="widget-search-facets__section-toggle-icon-svg" />
                    </button>
                </div>

                <p class="sr-only">#{msg.a11y__widget_chronology_reloaded}</p>

                <div
                    id="chronoSlider_#{cc.attrs.index}"
                    class="widget__body widget-chronology-slider__body"
                    year-list="#{searchBean.facets.getValueRange(cc.attrs.field)}"
                    start-year="#{searchBean.facets.getCurrentMinRangeValue(cc.attrs.field)}"
                    end-year="#{searchBean.facets.getCurrentMaxRangeValue(cc.attrs.field)}"
                    value-input="#{cc.clientId}:chronologySliderForm:chronologySliderInput"
                    update-facet="#{cc.clientId}:chronologySliderForm:chronologySliderSet"
                    loader="chronologyLoader-#{cc.attrs.index}"
                    show-tooltip="true" />

                <script>
                    // chronologySlider.tag and chronologyGraph.tag for widget chronology
                    (() => {
                        let values = #{searchBean.facets.getValueRangeAsJsonMap(cc.attrs.field)};
                        let valueMap = new Map(Object.entries(values));

                        let graphType = "#{searchBean.facets.getRangeFacetStyle(cc.attrs.field)}";
                        graphType = graphType ? graphType : "slider";

                        riot.mount("#chronoSlider_#{cc.attrs.index}", "chronology" + graphType, {
                            datamap: valueMap,
                            msg: {
                                enterYearStart: "#{msg.widgetChronology__year_start}",
                                enterYearEnd: "#{msg.widgetChronology__year_end}",
                                ok: "#{msg.ok}",
                                hits: "#{msg.hits}",
                                description: '#{msg[configurationBean.getFacetFieldDescriptionKey(cc.attrs.field)]}',
                            },
                        });
                    })();
                </script>
            </div>
        </ui:fragment>

        <!-- HIDDEN FORM TO UPDATE SEARCHHITS - outside ui:fragment so it is always in the component tree -->
        <h:form
            id="chronologySliderForm"
            styleClass="hidden">
            <h:inputHidden
                id="chronologySliderInput"
                value="#{searchBean.facets.tempValue}" />
            <h:commandButton
                id="chronologySliderSet"
                action="#{searchBean.updateFacetItem(cc.attrs.field, false)}" />
        </h:form>
    </composite:implementation>
</ui:composition>
