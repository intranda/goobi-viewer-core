<!-- Widget to display facets of a field independently from a current search -->
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="widget"
            type="io.goobi.viewer.model.cms.widget.CustomSidebarWidget"
            required="true" />
    </composite:interface>
    <composite:implementation>
        <ui:fragment rendered="#{not empty cc.attrs.widget.facetField}">
            <div
                id="searchListFacetsWrapper"
                class="widget-search-facets #{cc.attrs.widget.styleClass}">
                <h:form
                    id="searchListFacetsForm"
                    prependId="false">
                    <!-- DRILL DOWN -->
                    <ui:param
                        name="field"
                        value="#{cc.attrs.widget.facetField}" />
                    <div
                        class="widget widget-search-facets__collection"
                        data-facet="searchFacetFilter"
                        data-facetfield="#{field}">
                        <div class="widget__topbar widget-search-facets__topbar">
                            <h3
                                class="widget__title widget-search-facets__title"
                                data-heading="searchFacetFilter">
                                #{msg[field.concat('_DD')]}
                            </h3>
                            <!-- FILTER FACETS -->
                            <ui:fragment rendered="#{configurationBean.isFacetFieldDisplayValueFilter(field)}">
                                <div
                                    class="widget-search-facets__filter"
                                    data-wrapper="searchFacetFilter">
                                    <input
                                        type="text"
                                        class="widget-search-facets__filter-input -no-outline"
                                        placeholder="#{msg.placeholder__filter_search_results}"
                                        aria-label="#{msg.placeholder__filter_search_results}"
                                        data-input="searchFacetFilter" />
                                    <button
                                        type="button"
                                        class="btn btn--clean widget-search-facets__filter-button"
                                        data-toggle="searchFacetFilter"
                                        aria-expanded="false"
                                        aria-label="#{msg.placeholder__filter_search_results}">
                                        <util:icon
                                            icon="search"
                                            svgClass="widget__topbar-icon-svg widget-search-facets__topbar-icon-svg" />
                                    </button>
                                    <span
                                        class="sr-only"
                                        role="status"
                                        data-filter-status=""
                                        data-filter-status-label="#{msg.search__facets__filter_matches}"
                                        data-filter-status-empty-label="#{msg.search__facets__filter_no_matches}" />
                                </div>
                            </ui:fragment>
                        </div>

                        <p class="sr-only">#{msg.a11y__widget_facets_reloaded}</p>

                        <div class="widget__body widget-search-facets__body">
                            <ul class="widget-search-facets__list">
                                <!-- ACTIVE FACETS -->
                                <ui:repeat
                                    value="#{searchBean.facets.getActiveFacetsForField(field)}"
                                    var="facet">
                                    <li class="active #{facet.excluded ? '-excluded' : ''}">
                                        <h:commandLink action="#{searchBean.removeFacetAction(facet.link)}">
                                            <div class="row">
                                                <div class="col-11">
                                                    <ui:fragment rendered="#{facet.excluded}">
                                                        <span class="widget-search-facets__list-item-exclude">#{msg.searchOperator_NOT}</span>
                                                    </ui:fragment>
                                                    #{facet.translatedLabel}
                                                </div>
                                                <div class="col-1">
                                                    <util:icon
                                                        icon="x"
                                                        svgClass="widget__body-icon-svg widget-search-facets__body-icon-svg" />
                                                </div>
                                            </div>
                                            <f:passThroughAttribute
                                                name="data-toggle"
                                                value="tooltip" />
                                            <f:passThroughAttribute
                                                name="data-placement"
                                                value="top" />
                                            <f:passThroughAttribute
                                                name="data-original-title"
                                                value="#{msg.removeFacet}" />
                                            <f:passThroughAttribute
                                                name="aria-label"
                                                value="#{facet.excluded ? msg.searchOperator_NOT.concat(' ') : ''}#{msg[field.concat('_DD')]}: #{facet.translatedLabel} (#{msg.removeFacet})" />
                                        </h:commandLink>
                                    </li>
                                </ui:repeat>

                                <!-- AVAILABLE FACETS -->
                                <ui:repeat
                                    value="#{searchBean.getFieldFacetValues(field, cc.attrs.widget.numEntries, cc.attrs.widget.getCombinedFilterQuery(cmsBean.currentPage))}"
                                    var="facet">
                                    <li class="widget-search-facets__list-item">
                                        <!-- POSITIVE (INCLUDE) SELECTION -->
                                        <h:outputLink
                                            styleClass="widget-search-facets__list-item-link"
                                            value="#{navigationHelper.getSearchUrl(0,cmsBean.currentPage)}/-/#{empty cc.attrs.widget.filterQuery ? '-' : cc.attrs.widget.filterQuery}/1/-/#{facet.urlEscapedLink}/">
                                            <span
                                                class="widget-search-facets__list-item-control -include"
                                                aria-hidden="true">
                                                <util:icon
                                                    icon="plus"
                                                    svgClass="widget-search-facets__list-item-control-icon-svg" />
                                            </span>
                                            <span class="widget-search-facets__list-item-text">
                                                <span class="widget-search-facets__list-item-label">#{msg[facet.label]}</span>
                                                <span class="widget-search-facets__list-item-count">(#{facet.count})</span>
                                            </span>
                                            <f:passThroughAttribute
                                                name="aria-label"
                                                value="#{msg[field.concat('_DD')]}: #{msg[facet.label]} (#{facet.count})" />
                                        </h:outputLink>
                                        <!-- NEGATIVE (EXCLUDE) SELECTION -->
                                        <h:outputLink
                                            styleClass="widget-search-facets__list-item-control-link"
                                            value="#{navigationHelper.getSearchUrl(0,cmsBean.currentPage)}/-/#{empty cc.attrs.widget.filterQuery ? '-' : cc.attrs.widget.filterQuery}/1/-/#{facet.excludeUrlEscapedLink}/"
                                            title="#{msg.searchOperator_NOT}: #{msg[facet.label]}">
                                            <span
                                                class="widget-search-facets__list-item-control -exclude"
                                                aria-hidden="true">
                                                <util:icon
                                                    icon="minus"
                                                    svgClass="widget-search-facets__list-item-control-icon-svg" />
                                            </span>
                                            <f:passThroughAttribute
                                                name="aria-label"
                                                value="#{msg.searchOperator_NOT} #{msg[field.concat('_DD')]}: #{msg[facet.label]}" />
                                        </h:outputLink>
                                    </li>
                                </ui:repeat>
                            </ul>
                        </div>
                    </div>
                </h:form>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
