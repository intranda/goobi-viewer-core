<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:jsf="http://xmlns.jcp.org/jsf">
    <composite:interface>
        <composite:attribute
            name="showFlags"
            required="false"
            default="false" />
        <composite:attribute
            name="showLabels"
            required="false"
            default="true" />
        <composite:attribute
            name="displayAll"
            required="false"
            default="true" />
        <composite:attribute
            name="singleLanguage"
            required="false" />
        <composite:attribute
            name="toggleLanguage"
            required="false"
            default="true" />
        <composite:attribute
            name="longLanguageStrings"
            required="false"
            default="false" />
        <composite:attribute
            name="selector"
            required="false"
            default="changeLocal" />
    </composite:interface>

    <composite:implementation>
        <nav
            id="#{cc.attrs.selector}"
            aria-label="#{msg.a11y__language_selection_nav}"
            class="change-local clearfix">
            <!-- standard language select -->
            <h:panelGroup rendered="#{cc.attrs.displayAll == true and cc.attrs.toggleLanguage == false}">
                <h:form
                    id="changeLocalForm1"
                    prependId="false">
                    <ul>
                        <ui:repeat
                            var="lang"
                            value="#{navigationHelper.supportedLanguages}">
                            <li>
                                <!-- aria-label instead of title: a <button> with visible text content
                                     computes its accessible name from that content, not from title
                                     (title is only used as a fallback name source when no other name
                                     exists) - so the longer "FR - Français" wording never reached
                                     screen readers as title, only as an unused mouse tooltip. -->
                                <button
                                    aria-label="#{msg['changeLocal_' += lang]} - #{msg['changeLocal_long_' += lang]}"
                                    type="submit"
                                    lang="#{lang}"
                                    aria-current="#{navigationHelper.localeString == lang ? 'true' : null}"
                                    class="#{navigationHelper.localeString == lang ?'activeLang':''}"
                                    jsf:action="#{navigationHelper.setLocaleString(lang)}">
                                    <h:panelGroup rendered="#{cc.attrs.showFlags == true}">
                                        <img
                                            src="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/images/lang/flag_#{lang}.gif"
                                            alt="Flag Icon" />
                                    </h:panelGroup>

                                    <!-- RENDER SHORT LANGUAGE STRINGS -->
                                    <ui:fragment rendered="#{cc.attrs.longLanguageStrings == false}">
                                        <h:outputText
                                            value="#{msg['changeLocal_' += lang]}"
                                            rendered="#{cc.attrs.showLabels == true}" />
                                    </ui:fragment>

                                    <!-- RENDER LONG LANGUAGE STRINGS -->
                                    <ui:fragment rendered="#{cc.attrs.longLanguageStrings == true}">
                                        <h:outputText
                                            value="#{msg['changeLocal_long_' += lang]}"
                                            rendered="#{cc.attrs.showLabels == true}" />
                                    </ui:fragment>
                                </button>
                            </li>
                        </ui:repeat>
                    </ul>
                </h:form>
            </h:panelGroup>

            <!-- toggle language -->
            <h:panelGroup rendered="#{cc.attrs.displayAll == true and cc.attrs.toggleLanguage == true}">
                <h:form
                    id="changeLocalForm2"
                    prependId="false">
                    <ul>
                        <ui:repeat
                            var="lang"
                            value="#{navigationHelper.supportedLanguages}"
                            end="1">
                            <h:panelGroup rendered="#{navigationHelper.localeString ne lang}">
                                <li>
                                    <!-- RENDER SHORT LANGUAGE STRINGS -->
                                    <ui:fragment rendered="#{cc.attrs.longLanguageStrings == false}">
                                        <button
                                            class="flag #{navigationHelper.localeString eq lang ?'activeLang':''}"
                                            lang="#{lang}"
                                            jsf:action="#{navigationHelper.setLocaleString(lang)}">
                                            <h:outputText
                                                value="#{msg['changeLocal_' += lang]}"
                                                rendered="#{cc.attrs.showLabels == true}" />
                                            <h:panelGroup rendered="#{cc.attrs.showFlags == true}">
                                                <img
                                                    src="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/images/lang/flag_#{lang}.gif"
                                                    alt="Flag Icon" />
                                            </h:panelGroup>
                                        </button>
                                    </ui:fragment>

                                    <!-- RENDER LONG LANGUAGE STRINGS -->
                                    <ui:fragment rendered="#{cc.attrs.longLanguageStrings == true}">
                                        <button
                                            class="flag #{navigationHelper.localeString eq lang ?'activeLang':''}"
                                            lang="#{lang}"
                                            jsf:action="#{navigationHelper.setLocaleString(lang)}">
                                            <h:outputText
                                                value="#{msg['changeLocal_long_' += lang]}"
                                                rendered="#{cc.attrs.showLabels == true}" />
                                            <h:panelGroup rendered="#{cc.attrs.showFlags == true}">
                                                <img
                                                    src="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/images/lang/flag_#{lang}.gif"
                                                    alt="Flag Icon" />
                                            </h:panelGroup>
                                        </button>
                                    </ui:fragment>
                                </li>
                            </h:panelGroup>
                        </ui:repeat>
                    </ul>
                </h:form>
            </h:panelGroup>

            <!-- single language select -->
            <h:panelGroup rendered="#{cc.attrs.displayAll == false and cc.attrs.toggleLanguage == false}">
                <h:form
                    id="changeLocalForm3"
                    prependId="false">
                    <ul>
                        <li>
                            <button lang="#{cc.attrs.singleLanguage}" jsf:action="#{navigationHelper.setLocaleString(cc.attrs.singleLanguage)}">
                                <h:panelGroup rendered="#{cc.attrs.showFlags == true}">
                                    <img
                                        src="#{request.contextPath}/resources/themes/#{navigationHelper.theme}/images/lang/flag_#{cc.attrs.singleLanguage}.gif"
                                        alt="Flag Icon" />
                                </h:panelGroup>
                                <h:outputText
                                    value="#{msg[cc.attrs.singleLanguage]}"
                                    rendered="#{cc.attrs.showLabels == true}" />
                            </button>
                        </li>
                    </ul>
                </h:form>
            </h:panelGroup>
        </nav>
    </composite:implementation>
</ui:composition>
