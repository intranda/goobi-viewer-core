<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="value"
            required="true" />
        <composite:attribute
            name="items"
            required="false"
            method-signature="java.util.List complete(java.lang.String)" />
        <composite:attribute
            name="placeholder"
            default="" />
        <composite:attribute
            name="id"
            default="#{cc.attrs.id}" />
        <composite:attribute
            name="arialabel"
            default="#{msg.search}" />
        <composite:attribute
            name="styleclass"
            default="" />
    </composite:interface>

    <composite:implementation>
        <div class="ui-autocomplete ui-inputwrapper-filled search-input-wrapper">
            <input
                class="#{cc.attrs.styleclass} ui-autocomplete-input ui-inputfield ui-widget ui-state-default ui-corner-all -no-outline -active-border ui-state-filled"
                type="text"
                jsf:id="#{cc.attrs.id}"
                id="#{cc.attrs.id}"
                value="#{cc.attrs.value}"
                placeholder="#{cc.attrs.placeholder}"
                aria-label="#{cc.attrs.arialabel}" />
            <script>
                function initAutocomplete() {
                    const autocompleteResponseListener_#{cc.attrs.id} = new rxjs.Subject();
                    const socket = new viewerJS.WebSocket(window.location.host, "#{request.contextPath}", viewerJS.WebSocket.PATH_SEARCH_AUTOCOMPLETE);
                    const input = document.getElementById("#{cc.attrs.id}");

                    socket.onMessage.subscribe((event) => {
                        if (event.data) {
                            autocompleteResponseListener_#{cc.attrs.id}.next(JSON.parse(event.data));
                        }
                    });

                    let autocomplete__#{cc.attrs.id} = $("##{cc.attrs.id}").autocomplete({
                        source: function (request, response) {
                            socket.sendMessage(JSON.stringify({ term: request.term }));
                            autocompleteResponseListener_#{cc.attrs.id}.pipe(rxjs.operators.first()).subscribe((resp) => {
                                response(resp);
                            });
                        },
                        minLength: 3,
                        delay: 300, //ms
                        //appendTo: $("##{cc.attrs.id}").parent(),
                        change: function (event, ui) {
                            // REFOCUS LATER, JQUERY DEFOCUSES THE FIELD FIRST
                            setTimeout(() => $("##{cc.attrs.id}").focus(), 0);
                        },
                    });
                }

                initAutocomplete();

                $("##{cc.attrs.id}").on('keyup', (e) => {
                    if (e.originalEvent.key == 'Enter') {
                        let $button = $(event.target).closest('form').find('input[type=submit]:first');
                        $button.click();
                    }
                });
            </script>
        </div>
    </composite:implementation>
</ui:composition>
