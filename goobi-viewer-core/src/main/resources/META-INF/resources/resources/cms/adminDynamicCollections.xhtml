<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/templateAdmin.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPageAdmin('adminDynamicCollections')}" />
            <f:event
                type="preRenderView"
                listener="#{cmsBean.init()}" />
        </f:metadata>
    </ui:define>

    <!-- CONTENT -->
    <ui:define name="content">
        <ui:fragment
            id="dynamicCollectionsAccessControl"
            rendered="#{userBean.user.isHasCmsPrivilege('CMS_COLLECTIONS')}">
            <div
                id="adminDynamicCollections"
                class="admin__cms-collections">
                <!-- TITLE -->
                <div class="admin__title-bar">
                    <h1 class="admin__title">#{msg.admin__dynamic_collections}</h1>
                    <h:outputLink
                        value="#{navigationHelper.applicationUrl}admin/cms/dynamic-collections/new/"
                        styleClass="btn btn--default admin__title-bar-action">
                        <span>#{msg.admin__dynamic_collections_add}</span>
                    </h:outputLink>
                </div>

                <viewerComponent:adminBreadcrumbs />

                <div class="admin__content-inner-content">
                    <!-- GENERAL DESCRIPTION -->
                    <div class="admin__info-text">#{msg.admin__dynamic_collections_desc}</div>

                    <h:form
                        id="dynamicCollectionsForm"
                        prependId="false">
                        <div class="admin__content-wrapper">
                            <div class="admin__content-main">
                                <div class="admin__default-block">
                                    <ui:fragment rendered="#{empty dynamicCollectionsBean.collections}">
                                        <div class="admin__form-help-text in">#{msg.admin__dynamic_collections_empty}</div>
                                    </ui:fragment>
                                    <ul class="admin__cms-collections-tree-listing">
                                        <ui:repeat
                                            var="collection"
                                            value="#{dynamicCollectionsBean.collections}">
                                            <li class="row no-gutters admin__cms-collections-entry">
                                                <div class="col-2 collection__structure-col">
                                                    <h:panelGroup rendered="#{collection.hasImage()}">
                                                        <img
                                                            src="#{collection.getIconURI(60, 60)}"
                                                            class="img-fluid"
                                                            alt="" />
                                                    </h:panelGroup>
                                                </div>
                                                <div class="col-8">
                                                    <!-- LABEL (translated) as title, links to edit -->
                                                    <div class="collection__title">
                                                        <h:outputLink value="#{navigationHelper.applicationUrl}admin/cms/dynamic-collections/edit/#{collection.identifier}/">
                                                            <h:outputText value="#{collection.getLabel(navigationHelper.locale)}" />
                                                        </h:outputLink>
                                                    </div>
                                                    <!-- IDENTIFIER -->
                                                    <div class="admin__form-help-text in">#{collection.identifier}</div>
                                                    <!-- SOLR QUERY -->
                                                    <div class="admin__form-help-text in">#{collection.solrQuery}</div>
                                                    <!-- LINK TO COLLECTION CONTENT LISTING -->
                                                    <div>
                                                        <h:outputLink
                                                            target="_blank"
                                                            value="#{dynamicCollectionsBean.getSearchUrl(collection)}">
                                                            <h:outputText value="#{msg.admin__dynamic_collections_show_records}" />
                                                        </h:outputLink>
                                                    </div>
                                                </div>
                                                <div class="col-2 admin__cms-collections-entry-end">
                                                    <button
                                                        class="btn btn--clean -redlink"
                                                        data-require-confirmation="true"
                                                        data-confirmation-text="#{navigationHelper.getTranslationWithParamsUnescaped(msg.confirm__delete_dynamic_collection, collection.identifier)}"
                                                        jsf:action="#{dynamicCollectionsBean.deleteCollection(collection)}"
                                                        title="#{msg.delete}"
                                                        aria-label="#{msg.delete}: #{collection.identifier}">
                                                        <util:icon
                                                            icon="trash"
                                                            svgClass="icon icon-md" />
                                                    </button>
                                                </div>
                                            </li>
                                        </ui:repeat>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </h:form>
                </div>
            </div>
        </ui:fragment>
    </ui:define>
</ui:composition>
