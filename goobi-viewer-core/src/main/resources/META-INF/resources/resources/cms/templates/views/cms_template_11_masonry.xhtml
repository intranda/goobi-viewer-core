<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="text"
            required="false"
            default="#{cc.attrs.component.getContentItem('text')}" />
        <composite:attribute
            name="grid"
            required="false"
            default="#{cc.attrs.component.getContentItem('grid')}" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateMasonry"
            class="tpl-masonry content-component__legacy-full-width">
            <div class="tpl-masonry__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.text.content.text.textOrDefault}" />
            </div>

            <!-- LOADER -->
            <div
                class="tpl-masonry__loader"
                style="display: none">
                <img
                    src="#{request.contextPath}/resources/images/infinity_loader.gif"
                    alt="Masonry Loader" />
                #{msg.cms_masonryLoading}...
            </div>

            <!-- MASONRY -->
            <div class="grid">
                <div class="grid-sizer" />
                <div class="gutter-sizer" />
            </div>

            <!-- MASONRY SCRIPT -->
            <script
                type="text/javascript"
                src="#{request.contextPath}/resources/javascript/libs/masonry/masonry.min.js" />
            <script type="text/javascript">
                $.ajax({
                    url: '#{cc.attrs.grid.content.tileGridUrl}',
                    type: 'GET',
                    dataType: 'json',
                })
                    .then(function (data) {
                        $(document).ready(() => {
                            const masonryConfig = {
                                $grid: $('#templateMasonry .grid'),
                                language: currentLang,
                            };
                            cmsJS.masonry.init(masonryConfig, data);
                        });
                    })
                    .fail(function (jqXHR, textStatus, errorThrown) {
                        console.error('Masonry: failed to load tile grid', textStatus, errorThrown);
                    });
            </script>
        </div>
    </composite:implementation>
</ui:composition>
