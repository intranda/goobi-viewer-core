<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateStaticGrid"
            class="tpl-static-grid #{cmsPage.wrapperElementClass}">
            <div class="tpl-static-grid__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text')}" />
            </div>

            <!-- STATIC GRID -->
            <div class="tpl-static-grid__grid" />

            <!-- STATIC GRID SCRIPT -->
            <script type="text/javascript">
                $.ajax({
                    url: "#{cc.attrs.component.getContent('grid').tileGridUrl}",
                    type: 'GET',
                    datatype: 'JSON',
                }).then(function (data) {
                    var staticGridConfig = {
                        gridSelector: '.tpl-static-grid__grid',
                        language: currentLang,
                    };

                    cmsJS.staticGrid.init(staticGridConfig, data);
                });
            </script>
        </div>
    </composite:implementation>
</ui:composition>
