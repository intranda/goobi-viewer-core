<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateTags"
            class="tpl-tags content-component__legacy-full-width">
            <div class="tpl-tags__content">
                <!-- TEXT -->
                <ui:fragment rendered="#{cc.attrs.component.hasContent('text')}">
                    <div class="tpl-tags__text">
                        <h:outputText
                            escape="false"
                            value="#{cc.attrs.component.getContentData('text')}" />
                    </div>
                </ui:fragment>

                <!-- TAGS -->
                <ui:include src="/resources/includes/search/tags.xhtml" />
            </div>
        </div>
    </composite:implementation>
</ui:composition>
