<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="contentItem"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div class="admin__content-item-text">
            <!-- LABEL -->
            <ui:fragment rendered="#{not empty cc.attrs.contentItem.label}">
                <div class="admin__content-component-input-label">#{msg[cc.attrs.contentItem.label]}#{cc.attrs.contentItem.mandatory?'*':''}:</div>
            </ui:fragment>
            <h:panelGroup
                layout="block"
                id="inputGroup"
                styleClass="admin__content-component-content-item-end">
                <h:inputText
                    value="#{cc.attrs.contentItem.content.text.text}"
                    id="inputFieldContentItemText"
                    label="input"
                    styleClass="form-control">
                    <f:passThroughAttribute
                        name="aria-label"
                        value="text box" />
                </h:inputText>
            </h:panelGroup>
        </div>
    </composite:implementation>
</ui:composition>
