<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="content-component content-component__htmltext -width-#{cc.attrs.width} #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>

                <!-- RENDER THE HTML OUTPUT/CONTENT -->
                <!-- SANITIZED BY HTMLSANITIZERBEAN, DEFENSE AGAINST STORED XSS -->
                <h:outputText
                    escape="false"
                    value="#{htmlSanitizer.cleanRichText(cc.attrs.component.firstContentItem.content.text.textOrDefault)}" />
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
