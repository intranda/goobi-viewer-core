<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateCollection"
            class="tpl-collection content-component__legacy-full-width">
            <div class="tpl-collection__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('description')}" />
            </div>
            <div class="tpl-collection__wrapper">
                <ui:include src="/resources/crowdsourcing/includes/crowdsourcingCampaignsOverview.xhtml" />
            </div>
        </div>
    </composite:implementation>
</ui:composition>
