<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="random"
            required="false"
            default="false"
            type="java.lang.Boolean" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="content-component content-component__pages-tiled -width-100 #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>
                <div class="content-component__pages-tiled-list">
                    <ui:repeat
                        var="subPage"
                        value="#{cc.attrs.component.getContentItem('pagelist').content.getNestedPages(cc.attrs.random, cmsBean.templateManager)}">
                        <div class="content-component__pages-tiled-item-outer">
                            <div class="content-component__pages-tiled-item-inner">
                                <ui:repeat
                                    var="previewItem"
                                    value="#{subPage.previewItems}">
                                    <ui:fragment rendered="#{!previewItem.isEmpty()}">
                                        <ui:fragment rendered="#{previewItem.isMedia()}">
                                            <!-- IMAGE -->
                                            <a href="#{cmsBean.getUrl(subPage)}">
                                                <img
                                                    src="#{previewItem.content.url}"
                                                    alt="#{previewItem.content.mediaName}" />
                                                <ui:include src="/resources/images/icons/external-link.svg" />
                                            </a>
                                            <figcaption>#{previewItem.content.mediaDescription}</figcaption>
                                        </ui:fragment>
                                    </ui:fragment>
                                </ui:repeat>
                                <ui:repeat
                                    var="previewItem"
                                    value="#{subPage.previewItems}">
                                    <ui:fragment rendered="#{previewItem.isShortText()}">
                                        <!-- CAPTION -->
                                        <h2>#{previewItem.content.text}</h2>
                                    </ui:fragment>
                                    <ui:fragment rendered="#{previewItem.isHtmlText()}">
                                        <!-- HTML -->
                                        <div class="tpl-news-overview__preview-text">
                                            <h:outputText
                                                escape="false"
                                                value="#{previewItem.content.text}" />
                                        </div>
                                    </ui:fragment>
                                </ui:repeat>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
