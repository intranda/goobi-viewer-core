<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="imagelistItem"
            required="false"
            default="#{cc.attrs.component.firstContentItem}" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="tpl-masonry content-component content-component__masonry -width-100 #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>
                <div class="content-component__masonry-inner">
                    <!-- LOADER -->
                    <div
                        class="tpl-masonry__loader tpl-masonry__loader#{cc.clientId} content-component__masonry-loader"
                        style="display: none">
                        <img
                            src="#{request.contextPath}/resources/images/infinity_loader.gif"
                            alt="Masonry Loader" />
                        #{msg.cms_masonryLoading}...
                    </div>

                    <!-- MASONRY -->
                    <div
                        id="masonry#{cc.clientId}"
                        class="grid">
                        <div class="grid-sizer grid-sizer#{cc.clientId}" />
                        <div class="gutter-sizer gutter-sizer#{cc.clientId}" />
                    </div>
                </div>

                <!-- MASONRY SCRIPT -->
                <script
                    type="text/javascript"
                    src="#{request.contextPath}/resources/javascript/libs/masonry/masonry.min.js" />
                <script type="text/javascript">
                    $.ajax({
                        url: '#{cc.attrs.imagelistItem.content.tileGridUrl}',
                        type: 'GET',
                        dataType: 'json',
                    })
                        .then(function (data) {
                            $(document).ready(() => {
                                var masonryConfig = {
                                    $grid: $('#masonry#{cc.clientId}'),
                                    language: currentLang,
                                    loaderSelector: '.tpl-masonry__loader#{cc.clientId}',
                                };
                                cmsJS.masonry.init(masonryConfig, data);
                            });
                        })
                        .fail(function (jqXHR, textStatus, errorThrown) {
                            console.error('Masonry: failed to load tile grid', textStatus, errorThrown);
                        });
                </script>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
