<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        default="#{cc.attrs.component.firstContentItem.content}" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                id="templateStaticGrid"
                class="tpl-static-grid content-component content-component__static-grid -width-100 #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>

                <!-- STATIC GRID -->
                <ui:fragment rendered="#{!cc.attrs.logoTiles}">
                    <ul class="tpl-static-grid__grid">
                        <ui:repeat
                            var="mediaItem"
                            value="#{cc.attrs.component.getContent('grid').mediaItems}">
                            <li class="tpl-static-grid__item">
                                <a
                                    aria-label="#{msg.a11y__open_link_to}: #{mediaItem.label.getValueOrFallback(navigationHelper.locale)}"
                                    href="#{empty mediaItem.link ? '#' : mediaItem.link }"
                                    class="grid-tile">
                                    <div class="grid-tile__title">
                                        <span class="grid-tile__text">#{mediaItem.label.getValueOrFallback(navigationHelper.locale)}</span>
                                    </div>
                                    <div
                                        class="grid-tile__image"
                                        style="background-image: url('#{mediaItem.image.id}')"
                                        title="#{mediaItem.altText}" />
                                </a>
                            </li>
                        </ui:repeat>
                    </ul>
                </ui:fragment>

                <!-- LOGO TILES -->
                <ui:fragment rendered="#{cc.attrs.logoTiles}">
                    <ul class="tpl-static-grid__logo-grid">
                        <ui:repeat
                            var="mediaItem"
                            value="#{cc.attrs.component.getContent('grid').mediaItems}">
                            <li class="tpl-static-grid__item">
                                <a
                                    aria-label="#{msg.a11y__open_link_to}: #{mediaItem.label.getValueOrFallback(navigationHelper.locale)}"
                                    href="#{empty mediaItem.link ? '#' : mediaItem.link }"
                                    class="logo-tile">
                                    <img
                                        class="logo-tile__image"
                                        src="#{mediaItem.image.id}"
                                        alt="#{mediaItem.altText}" />
                                    <span class="logo-tile__text">#{mediaItem.label.getValueOrFallback(navigationHelper.locale)}</span>
                                </a>
                            </li>
                        </ui:repeat>
                    </ul>
                </ui:fragment>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
