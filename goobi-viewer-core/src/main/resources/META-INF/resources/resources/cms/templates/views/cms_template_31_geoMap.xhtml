<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateGeoMap"
            class="tpl-geomap content-component__legacy-full-width">
            <ui:fragment rendered="#{cc.attrs.component.hasContent('text01')}">
                <div class="tpl-geomap__text">
                    <h:outputText
                        escape="false"
                        value="#{cc.attrs.component.getContentData('text01')}" />
                </div>
            </ui:fragment>
            <ui:fragment rendered="#{cc.attrs.component.hasContent('geomap')}">
                <viewerComponent:geoMap
                    popoverOnHover="false"
                    geoMap="#{cc.attrs.component.getContentItem('geomap').content.map}" />
            </ui:fragment>
        </div>
    </composite:implementation>
</ui:composition>
