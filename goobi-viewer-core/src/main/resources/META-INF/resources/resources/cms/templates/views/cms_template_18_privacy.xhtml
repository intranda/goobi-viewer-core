<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templatePrivacy"
            class="tpl-privacy content-component__legacy-full-width">
            <div class="tpl-privacy__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text01')}" />

                <!-- PIWIK IFRAME -->
                <ui:fragment rendered="#{configurationBean.piwikTrackingEnabled}">
                    <iframe
                        title="web analytics"
                        src="//#{configurationBean.piwikBaseURL}/index.php?module=CoreAdminHome&amp;action=optOut&amp;language=#{navigationHelper.localeString}" />
                </ui:fragment>
                <ui:fragment rendered="#{cc.attrs.component.hasContent('text02')}">
                    <div class="tpl-privacy__text-bottom">
                        <h:outputText
                            escape="false"
                            value="#{cc.attrs.component.getContentData('text02')}" />
                    </div>
                </ui:fragment>
            </div>
        </div>
    </composite:implementation>
</ui:composition>
