<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/templateAdmin.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPageAdmin('adminCmsRecordNotes')}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div
            id="recordNotes"
            class="record-notes">
            <h:panelGroup rendered="#{userBean.user.cmsAdmin}">
                <h:form prependId="false">
                    <div class="admin__title-bar">
                        <!-- TITLE -->
                        <h1 class="admin__title">#{msg.cms__record_notes__title_plural}</h1>

                        <!-- CREATE NEW NOTE -->
                        <ui:fragment rendered="#{userBean.user.cmsAdmin}">
                            <a
                                href="#{navigationHelper.applicationUrl}admin/cms/recordnotes/new/"
                                class="btn btn--default admin__title-bar-action">
                                <span>#{msg.add}</span>
                            </a>
                        </ui:fragment>
                    </div>
                    <viewerComponent:adminBreadcrumbs />
                    <div class="admin__content-inner-content">
                        <div class="admin__info-text">#{msg.cms__record_notes_overview__description}</div>
                        <div class="admin__table-tools">
                            <!-- PAGINATOR -->
                            <div class="admin__table-paginator">
                                <viewerComponent:dataTablePaginator tableValues="#{cmsRecordNotesBean.dataProvider}" />
                            </div>

                            <!-- FILTER -->
                            <div class="admin__table-filter">
                                <viewerComponent:dataTableColumnFilter
                                    key="cms__record_notes__search"
                                    filter="#{cmsRecordNotesBean.dataProvider.getFilter('PI_OR_TITLE')}" />
                            </div>
                        </div>

                        <!-- ALL PAGES TABLE -->
                        <div
                            class="admin__table-content"
                            role="grid"
                            aria-label="#{msg.cms__record_notes__title_plural}: #{msg.aria_label__table__actions}">
                            <!-- TITLE ROW -->
                            <div
                                class="row no-gutters admin__table-title"
                                role="row">
                                <!-- PAGE COL -->
                                <div
                                    class="col-12 d-flex"
                                    role="columnheader">
                                    #{msg.cms__record_notes_table__text_heading}
                                </div>
                            </div>

                            <!-- INDIVIDUAL ROWS -->
                            <ui:repeat
                                var="note"
                                value="#{cmsRecordNotesBean.dataProvider.paginatorList}">
                                <div
                                    class="row no-gutters admin__table-entry #{note.displayNote ? '' : '-unpublished'}"
                                    role="row">
                                    <div
                                        class="col-12 d-flex"
                                        role="presentation">
                                        <div class="admin__record-notes-table-img align-self-center">
                                            <ui:fragment rendered="#{note.isSingleRecordNote() and !cmsRecordNotesBean.isArchiveNote(note)}">
                                                <img
                                                    alt="#{note.recordPi}"
                                                    title="#{note.recordPi}"
                                                    src="#{cmsRecordNotesBean.getThumbnailUrl(note, 160, 160)}" />
                                            </ui:fragment>
                                            <ui:fragment rendered="#{cmsRecordNotesBean.isArchiveNote(note) and not empty cmsRecordNotesBean.getArchiveImageUrl(note)}">
                                                <img
                                                    alt="#{note.recordPi}"
                                                    title="#{note.recordPi}"
                                                    src="#{cmsRecordNotesBean.getArchiveImageUrl(note)}" />
                                            </ui:fragment>
                                            <ui:fragment rendered="#{cmsRecordNotesBean.isArchiveNote(note) and empty cmsRecordNotesBean.getArchiveImageUrl(note)}">
                                                <div class="admin__record-notes-solr-query-img">
                                                    <util:icon
                                                        icon="archive"
                                                        svgClass="icon icon-xxxxl"
                                                        aria-hidden="true" />
                                                </div>
                                            </ui:fragment>
                                            <ui:fragment rendered="#{note.isMultiRecordNote()}">
                                                <div class="admin__record-notes-solr-query-img">
                                                    <util:icon
                                                        icon="list-details"
                                                        svgClass="icon icon-xxxxl"
                                                        aria-hidden="true" />
                                                </div>
                                            </ui:fragment>
                                        </div>
                                        <div
                                            class="admin__table-data"
                                            role="gridcell">
                                            <ui:fragment rendered="#{note.isSingleRecordNote()}">
                                                <div class="admin__table-name">
                                                    #{note.recordTitle.getText(navigationHelper.locale)} |
                                                    #{note.recordPi}
                                                </div>
                                            </ui:fragment>
                                            <ui:fragment rendered="#{note.isMultiRecordNote()}">
                                                <div class="admin__table-name">#{note.query}</div>
                                            </ui:fragment>
                                            <div class="admin__table-data-content">
                                                <label
                                                    jsf:escape="false"
                                                    value="#{note.noteText.getTextOrDefault(navigationHelper.locale, navigationHelper.defaultLocale)}" />
                                            </div>
                                            <div>
                                                <!-- EDIT -->
                                                <a
                                                    href="#{navigationHelper.applicationUrl}admin/cms/recordnotes/edit/#{note.id}/"
                                                    class="admin__table-action-link"
                                                    aria-label="#{msg.edit}: #{note.noteTitle.getTextOrDefault(navigationHelper.locale, navigationHelper.defaultLocale)}">
                                                    #{msg.edit}
                                                </a>

                                                <!-- PREVIEW -->
                                                <ui:fragment rendered="#{note.isSingleRecordNote()}">
                                                    <a
                                                        class="admin__table-action-link"
                                                        target="_blank"
                                                        href="#{cmsRecordNotesBean.getRecordUrl(note)}"
                                                        aria-label="#{msg.title__preview}: #{note.noteTitle.getTextOrDefault(navigationHelper.locale, navigationHelper.defaultLocale)}">
                                                        #{msg.show}
                                                    </a>
                                                </ui:fragment>
                                                <ui:fragment rendered="#{note.isMultiRecordNote()}">
                                                    <a
                                                        href="#{cmsRecordNotesBean.getSearchUrlForNote(note)}"
                                                        class="admin__table-action-link"
                                                        target="_blank">
                                                        #{msg.show}
                                                    </a>
                                                </ui:fragment>

                                                <!-- DELETE -->
                                                <button
                                                    class="admin__table-action-link -redlink"
                                                    title="#{navigationHelper.getTranslationWithParamsUnescaped(msg.cms__record_notes__delete_confirmation, note.noteTitle.getTextOrDefault(navigationHelper.locale, navigationHelper.defaultLocale))}"
                                                    data-require-confirmation="true"
                                                    data-confirmation-text="#{navigationHelper.getTranslationWithParamsUnescaped(msg.cms__record_notes__delete_confirmation, note.noteTitle.getTextOrDefault(navigationHelper.locale, navigationHelper.defaultLocale))}"
                                                    jsf:action="#{cmsRecordNotesBean.deleteNote(note)}"
                                                    aria-label="#{msg.delete}">
                                                    #{msg.delete}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </ui:repeat>
                        </div>
                    </div>
                </h:form>
            </h:panelGroup>
        </div>

        <!-- RECORD NOTES SCRIPT -->
        <script type="text/javascript">
            $(document).ready(function () {
                var dataTableConfig = {
                    dataTablePaginator: '#dataTablePaginator',
                    txtField1: '#txtMoveTo1',
                    txtField2: '#txtMoveTo2',
                    totalCount: '#totalCount',
                    reloadBtn: 'input[id*="cmdMoveTo"]',
                };

                viewerJS.dataTable.init(dataTableConfig);
            });

            if ($('.admin__table-entry').length == 0) {
                $('.admin__table-content').append(document.createElement('br'), $(document.createElement('p')).text(#{navigationHelper.getTranslationsAsJson(['hitsZero'])}.hitsZero));
            }
        </script>
    </ui:define>
</ui:composition>
