<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:util="http://goobi.io/util">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CENTERED SECTION HEADING WITH OPTIONAL ICON CIRCLE -->
            <div
                class="cms-section-header content-component -width-100 #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>

                <ui:fragment rendered="#{not empty cc.attrs.component.getContentData('icon')}">
                    <span class="cms-section-header__icon">
                        <util:icon icon="#{cc.attrs.component.getContentData('icon')}" />
                    </span>
                </ui:fragment>
                <ui:fragment rendered="#{not empty cc.attrs.component.getContentData('heading')}">
                    <h2 class="cms-section-header__heading">
                        <h:outputText value="#{cc.attrs.component.getContentData('heading')}" />
                    </h2>
                </ui:fragment>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
