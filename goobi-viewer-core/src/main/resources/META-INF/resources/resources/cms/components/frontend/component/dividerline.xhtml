<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="random"
            required="false"
            default="false"
            type="java.lang.Boolean" />
        <composite:attribute
            name="paged"
            required="false"
            default="false"
            type="java.lang.Boolean" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="content-component content-component__divider-line #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>

                <!-- RENDER THE HTML OUTPUT/CONTENT -->
                <div class="content-component__divider-line-element" />
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
