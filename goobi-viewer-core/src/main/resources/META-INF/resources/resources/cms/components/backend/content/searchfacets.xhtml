<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="contentItem"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div class="admin__content-component-input-group">
            <!-- LABEL -->
            <ui:fragment rendered="#{not empty cc.attrs.contentItem.label}">
                <div class="admin__content-component-input-label">#{msg[cc.attrs.contentItem.label]}#{cc.attrs.contentItem.mandatory?'*':''}:</div>
            </ui:fragment>

            <!-- AREA FOR AJAX REFRESH -->
            <h:panelGroup
                id="emptySearchResultsGroup"
                layout="block"
                styleClass="admin__content-component-input-field">
                <!-- VALIDATION MESSAGE -->
                <div class="cms-module__option-message">
                    <h:messages
                        for="emptySearchResults"
                        infoClass="cms-module__option-message-status success"
                        warnClass="cms-module__option-message-status warning"
                        errorClass="cms-module__option-message-status danger" />
                    <div class="cms-module__option-message-mark">
                        <i
                            class="fa fa-check"
                            aria-hidden="true" />
                        <i
                            class="fa fa-exclamation"
                            aria-hidden="true" />
                    </div>
                </div>

                <!-- AREA FOR AJAX REFRESH -->
                <h:panelGroup id="facettingGroup">
                    <!-- VALIDATION MESSAGE -->
                    <div class="cms-module__option-message">
                        <h:messages
                            for="facetting"
                            infoClass="cms-module__option-message-status success"
                            warnClass="cms-module__option-message-status warning"
                            errorClass="cms-module__option-message-status danger" />
                        <div class="cms-module__option-message-mark">
                            <i
                                class="fa fa-check"
                                aria-hidden="true" />
                            <i
                                class="fa fa-exclamation"
                                aria-hidden="true" />
                        </div>
                    </div>

                    <!-- FACET FIELD -->
                    <h:panelGroup id="facetFieldGroup">
                        <h:inputText
                            id="facetField"
                            styleClass="form-control"
                            value="#{cc.attrs.contentItem.content.facetField}" />
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGroup>
        </div>
    </composite:implementation>
</ui:composition>
