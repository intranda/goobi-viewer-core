<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateBrowse"
            class="tpl-solr-query content-component__legacy-full-width">
            <div class="tpl-browse-terms__content">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text01')}" />
            </div>

            <!-- BROWSE TERMS LIST -->
            <ui:include src="/resources/includes/search/browseTerms.xhtml">
                <ui:param
                    name="baseUrl"
                    value="#{cc.attrs.component.owningPage.pageUrl}" />
            </ui:include>
        </div>
    </composite:implementation>
</ui:composition>
