<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="textItem"
            required="false"
            default="#{cc.attrs.component.getContentItem('text')}" />
        <composite:attribute
            name="collectionItem"
            required="false"
            default="#{cc.attrs.component.getContentItem('collection')}" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateStckedCollection"
            class="tpl-stacked-collection content-component__legacy-full-width">
            <div class="tpl-stacked-collection__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text')}" />
            </div>
            <div class="tpl-stacked-collection__collections">
                <collectionView
                    url="#{request.contextPath}/api/v1/collections/#{cc.attrs.collectionItem.content.collectionField}/"
                    restapi="#{configurationBean.restApiUrl}"
                    baseCollection="#{cc.attrs.collectionItem.content.baseCollection}"
                    grouping="#{cc.attrs.collectionItem.content.groupBy}"
                    language="#{navigationHelper.localeString}"
                    defaultlanguage="#{navigationHelper.defaultLocale.language}"
                    blacklist="#{cc.attrs.collectionItem.content.ignoreCollections}"
                    sorting="#{cc.attrs.collectionItem.content.sorting}"
                    depth="2" />
            </div>

            <!-- STACKED COLLECTION INIT -->
            <script type="text/javascript">riot.mount('collectionView');</script>
        </div>
    </composite:implementation>
</ui:composition>
