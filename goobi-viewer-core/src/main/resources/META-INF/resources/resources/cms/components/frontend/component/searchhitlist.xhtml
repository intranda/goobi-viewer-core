<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="tpl-search-list content-component content-component__search-hitlist -width-100 #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>
                <div
                    id="templateSearchListCustom"
                    class="tpl-search-list-custom content-component__legacy-full-width search-list__hits">
                    <ui:include src="/resources/includes/search/searchHitList.xhtml">
                        <ui:param
                            name="listStyle"
                            value="#{cc.attrs.component.getContent('recordlist').view.cssClass}" />
                        <ui:param
                            name="searchParam"
                            value="#{sessionBean.get('cmsSearch')}" />
                        <ui:param
                            name="showOptions"
                            value="#{cc.attrs.component.getContent('recordlist').showOptions}" />
                        <ui:param
                            name="showSorting"
                            value="#{empty cc.attrs.component.getContent('recordlist').sortField}" />
                        <ui:param
                            name="groupPreviewMode"
                            value="#{false}" />
                    </ui:include>
                </div>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
