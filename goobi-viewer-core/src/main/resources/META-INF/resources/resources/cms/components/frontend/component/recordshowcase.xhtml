<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    xmlns:util="http://goobi.io/util">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <div
                class="cms-record-showcase content-component -fullbleed #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <ui:fragment
                    rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>

                <!-- STAGE -->
                <div class="cms-record-showcase__stage">
                    <div class="cms-record-showcase__header">
                        <ui:fragment rendered="#{not empty cc.attrs.component.getContentData('heading')}">
                            <h2 class="cms-record-showcase__heading">
                                <h:outputText value="#{cc.attrs.component.getContentData('heading')}" />
                            </h2>
                        </ui:fragment>
                        <ui:fragment rendered="#{not empty cc.attrs.component.getContentData('subline')}">
                            <p class="cms-record-showcase__subline">
                                <h:outputText value="#{cc.attrs.component.getContentData('subline')}" />
                            </p>
                        </ui:fragment>
                    </div>

                    <!-- RAIL -->
                    <ui:fragment rendered="#{cc.attrs.component.hasContent('slider')}">
                        <div class="cms-record-showcase__rail slider-showcase">
                            <viewerComponent:cmsSlider slider="#{cc.attrs.component.getContent('slider').slider}" />
                        </div>

                        <!-- CONTROLS -->
                        <div
                            class="cms-record-showcase__controls"
                            hidden="hidden">
                            <div class="cms-record-showcase__progress">
                                <input
                                    type="range"
                                    class="cms-record-showcase__scrubber"
                                    min="0"
                                    max="1000"
                                    step="1"
                                    value="0"
                                    aria-label="#{msg['a11y__swiper__pagination_msg']}" />
                                <span
                                    class="cms-record-showcase__track"
                                    aria-hidden="true" />
                            </div>
                            <div class="cms-record-showcase__steps">
                                <button
                                    type="button"
                                    class="cms-record-showcase__step cms-record-showcase__step--prev"
                                    aria-label="#{msg.previous}">
                                    <util:icon icon="arrow-narrow-left" />
                                </button>
                                <button
                                    type="button"
                                    class="cms-record-showcase__step cms-record-showcase__step--next"
                                    aria-label="#{msg.next}">
                                    <util:icon icon="arrow-narrow-right" />
                                </button>
                            </div>
                        </div>
                    </ui:fragment>
                </div>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
