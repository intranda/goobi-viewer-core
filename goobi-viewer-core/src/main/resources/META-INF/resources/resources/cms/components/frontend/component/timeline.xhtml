<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.component.hasAccess(userBean.user)}">
            <!-- CONTENT ITEM WITH SELECTED OPTIONS -->
            <div
                class="content-component content-component__timeline -width-100 #{cc.attrs.hideOnScreenSizes} #{cc.attrs.hideOnScreenSizes == 'hideMobile' ? '-hiddenOnMobile' : ''} #{cc.attrs.hideOnScreenSizes == 'hideDesktop' ? '-hiddenOnDesktop' : ''} #{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user) ? '-isPrivate' : ''}">
                <!-- INFO: CONTENT ITEM IS NOT PUBLISHED YET -->
                <ui:fragment rendered="#{cc.attrs.component.isPrivate() and cc.attrs.component.hasAccess(userBean.user)}">
                    <div class="content-component__not-published-info">#{msg.cms__content_not_published_yet}</div>
                </ui:fragment>
                <div
                    id="templateTimematrix"
                    class="tpl-timeMatrix">
                    <!-- TEXT -->
                    <div class="tpl-timeMatrix__text">
                        <h:outputText
                            escape="false"
                            value="#{cc.attrs.component.getContentData('text01')}" />
                    </div>
                    <ui:include src="/resources/includes/search/timematrix.xhtml">
                        <ui:param
                            name="subtheme"
                            value="#{cmsPage.subTheme}" />
                    </ui:include>
                </div>
            </div>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
