<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateRSSFeed"
            class="tpl-rss content-component__legacy-full-width">
            <h:outputText
                escape="false"
                value="#{cc.attrs.component.getContentData('text')}" />
        </div>
        <div class="tpl-rss__feed">
            <ui:repeat
                var="item"
                value="#{rssBean.getRssFeedChannel(cc.attrs.component.getContentItem('rss').content.elementsPerPage, cc.attrs.filterQuery, cc.attrs.widget.sortField, cc.attrs.widget.descendingSorting).items}">
                <div class="tpl-rss__item">
                    <div class="row">
                        <!-- LEFT -->
                        <div class="col-12 col-md-4">
                            <ui:fragment rendered="#{item.description.image != null}">
                                <div class="tpl-rss__item-image">
                                    <a href="#{item.link}">
                                        <image
                                            class="mg-fluid"
                                            src="#{item.description.image}"
                                            alt="#{item.title}"
                                            data-viewer-thumbnail="thumbnail"
                                            data-viewer-access-denied-url="#{item.getAccessDeniedThumbnailUrl(navigationHelper.locale)}" />
                                    </a>
                                </div>
                            </ui:fragment>
                        </div>

                        <!-- RIGHT -->
                        <div class="col-12 col-md-8">
                            <div class="tpl-rss__item-title">
                                <h2 class="h3">
                                    <a href="#{item.link}">#{item.title}</a>
                                </h2>
                            </div>
                            <dl class="tpl-rss__item-metadata">
                                <ui:repeat
                                    var="metadata"
                                    value="#{item.description.metadata}">
                                    <dt>#{metadata.label}:</dt>
                                    <dd>#{metadata.value}</dd>
                                </ui:repeat>
                            </dl>
                        </div>
                    </div>
                </div>
            </ui:repeat>
        </div>
    </composite:implementation>
</ui:composition>
