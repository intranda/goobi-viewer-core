<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="openExpanded"
            required="false"
            default="false"
            type="java.lang.Boolean" />
        <composite:attribute
            name="displayParents"
            required="false"
            default="false"
            type="java.lang.Boolean" />
        <composite:attribute
            name="ignoreHierarchy"
            required="false"
            default="false"
            type="java.lang.Boolean" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateCollectionTiled"
            class="tpl-collection-tiled content-component__legacy-full-width">
            <div class="tpl-collection-tiled__text content-component__legacy-full-width">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text01')}" />
            </div>
            <div class="tpl-collection-tiled__wrapper">
                <viewerComponent:collectionViewTiled
                    id="collection"
                    collection="#{collectionViewBean.getCollection(cc.attrs.component.getContentItem('collection01').content)}" />
            </div>
        </div>
    </composite:implementation>
</ui:composition>
