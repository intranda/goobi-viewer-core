<ui:composition
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
        <composite:attribute
            name="cmsContent"
            required="false"
            default="#{cc.attrs.component.firstContentItem.content}" />
        <composite:attribute
            name="document"
            required="false"
            default="#{cc.attrs.cmsContent.mediaItem}" />
    </composite:interface>

    <composite:implementation>
        <ui:fragment rendered="#{cc.attrs.cmsContent != null and cc.attrs.document != null and cc.attrs.component.hasAccess(userBean.user)}">
            <div class="content-component content-component__document">
                <img
                    id="documentLoader_#{cc.clientId}"
                    class="content-component__loader"
                    src="#{request.contextPath}/resources/images/infinity_loader.gif" />
                <h:outputText
                    id="content-component__document__html"
                    escape="false" />
                <div
                    id="documentWrapper_#{cc.clientId}"
                    class="content-component__document__pdf" />
            </div>

            <!-- DOCUMENT SCRIPT -->
            <script type="text/javascript">
                //<![CDATA[
                function loadPdf(pdfUrl, element, loader) {
                    if (pdfUrl) {
                        if (pdfUrl.toLowerCase().endsWith('.pdf')) {
                            riot.mount(element, 'pdfdocument', {
                                data: pdfUrl,
                                loaderSelector: loader,
                            });
                        } else {
                            $.ajax({
                                url: pdfUrl,
                                type: 'GET',
                                datatype: 'HTML',
                            }).then(function (data) {
                                document.getElementById('literature').innerHTML = data;
                                $(loader).hide();
                            });
                        }
                    } else {
                        $('#documentLoader_#{cc.clientId}').hide();
                    }
                }

                loadPdf('#{cc.attrs.cmsContent.url}', '#documentWrapper_#{cc.clientId}', '#documentLoader_#{cc.clientId}');
                //]]>
            </script>
        </ui:fragment>
    </composite:implementation>
</ui:composition>
