<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <composite:interface>
        <composite:attribute
            name="component"
            required="true" />
    </composite:interface>

    <composite:implementation>
        <div
            id="templateTimematrix"
            class="tpl-timeMatrix content-component__legacy-full-width">
            <!-- TEXT -->
            <div class="tpl-timeMatrix__text">
                <h:outputText
                    escape="false"
                    value="#{cc.attrs.component.getContentData('text01')}" />
            </div>
            <ui:include src="/resources/includes/search/timematrix.xhtml">
                <ui:param
                    name="subtheme"
                    value="#{cmsPage.subTheme}" />
            </ui:include>
        </div>
    </composite:implementation>
</ui:composition>
