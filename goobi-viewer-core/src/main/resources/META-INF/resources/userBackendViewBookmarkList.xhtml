<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:util="http://goobi.io/util"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:viewerComponent="http://xmlns.jcp.org/jsf/composite/components"
    template="/resources/themes/#{navigationHelper.theme}/template.html">
    <ui:define name="metadata">
        <f:metadata>
            <f:event
                type="preRenderView"
                listener="#{navigationHelper.setCurrentPage('bookmarks', false, true)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('admin__user_profile', request.contextPath.concat('/user/'), userBean.loggedIn ? 1 : -1)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb('bookmarkList_bookmarkLists',navigationHelper.applicationUrl.concat(userBean.loggedIn ? 'user/bookmarks' : 'bookmarks'),userBean.loggedIn ? 2 :  1)}" />
            <f:event
                type="preRenderView"
                listener="#{breadcrumbBean.addStaticLinkToBreadcrumb(bookmarkBean.currentBookmarkList.name, userBean.loggedIn ? 3 : 2)}" />
        </f:metadata>
    </ui:define>

    <ui:define name="breadcrumbs">
        <viewerComponent:breadcrumbs
            showIcon="false"
            showStartText="true" />
    </ui:define>

    <ui:define name="content">
        <div
            id="viewBookmarkList"
            class="view-bookmark">
            <ui:fragment rendered="#{bookmarkBean.currentBookmarkListShared or (userBean.loggedIn and bookmarkBean.currentBookmarkList.isMayView(userBean.user))}">
                <div class="view-bookmark__head">
                    <div class="view-bookmark__head-row">
                        <h1>
                            <span class="-sr-only">#{msg.bookmarkList_myBookmarkLists}:</span>
                            #{bookmarkBean.currentBookmarkList.name}
                        </h1>
                        <h:form
                            id="viewBookmarkListActionForm"
                            prependId="false"
                            styleClass="view-bookmark__actions">
                            <h:commandLink
                                styleClass="view-bookmark__action"
                                rendered="#{bookmarkBean.currentBookmarkList.isMayEdit(userBean.user)}"
                                action="#{bookmarkBean.editBookmarkListAction(bookmarkBean.currentBookmarkList)}">
                                <util:icon-text
                                    icon="edit"
                                    text="#{msg.edit}" />
                            </h:commandLink>
                            <h:commandLink
                                styleClass="view-bookmark__action -danger"
                                rendered="#{bookmarkBean.currentBookmarkList.isMayEdit(userBean.user)}"
                                action="#{bookmarkBean.deleteCurrentBookmarkListAction}">
                                <util:icon-text
                                    icon="trash"
                                    text="#{msg.bookmarkList_delete}" />
                                <f:passThroughAttribute
                                    name="data-require-confirmation"
                                    value="true" />
                                <f:passThroughAttribute
                                    name="data-confirmation-text"
                                    value="#{msg.bookmarks_confirmDeleteBookmarkList}" />
                            </h:commandLink>
                        </h:form>
                    </div>
                    <ui:fragment rendered="#{bookmarkBean.currentBookmarkList.hasDescription()}">
                        <p class="view-bookmark__intro">#{bookmarkBean.currentBookmarkList.description}</p>
                    </ui:fragment>
                </div>

                <!-- BOOKMARKS DISABLED -->
                <ui:fragment rendered="#{!configurationBean.bookmarksEnabled}">
                    <div
                        class="alert alert-warning"
                        role="alert">
                        #{msg.errFunctionalityDisabled}
                    </div>
                </ui:fragment>

                <!-- LIST CONTENT -->
                <ui:fragment rendered="#{configurationBean.bookmarksEnabled and !bookmarkBean.newBookmarkList}">
                    <ui:fragment rendered="#{bookmarkBean.currentBookmarkList.items.isEmpty()}">
                        <div class="view-bookmark__empty">
                            <p class="view-bookmark__empty-text">#{msg.bookmarkList_noEntryWarning}</p>
                        </div>
                    </ui:fragment>

                    <!-- BOOKMARK ENTRIES, NO SEARCH-LIST CLASS (IT STARTS HIDDEN) -->
                    <ui:fragment rendered="#{!bookmarkBean.currentBookmarkList.items.isEmpty()}">
                        <div class="view-bookmark__entries">
                            <ui:repeat
                                value="#{bookmarkBean.currentBookmarkList.items}"
                                var="item"
                                varStatus="status">
                                <ui:fragment rendered="#{item.browseElement != null}">
                                    <div class="view-bookmark__entry">
                                        <h:form
                                            id="viewBookmarkForm"
                                            prependId="false">
                                            <ui:include src="/resources/includes/search/browseElement.xhtml">
                                                <ui:param
                                                    name="browseElement"
                                                    value="#{item.browseElement}" />
                                                <ui:param
                                                    name="showBookmarkIcon"
                                                    value="true" />
                                            </ui:include>
                                        </h:form>
                                    </div>
                                </ui:fragment>
                            </ui:repeat>
                        </div>
                    </ui:fragment>
                </ui:fragment>
            </ui:fragment>
        </div>
    </ui:define>

    <ui:define name="sidebar" />
</ui:composition>
