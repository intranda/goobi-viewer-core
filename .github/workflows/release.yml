name: Create Release

on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Extract build version
        id: version
        run: |
          BUILD_VERSION=$(mvn -f pom.xml -q -N -Dchangelist='' \
            help:evaluate -Dexpression=project.version -DforceStdout)
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
      - name: Create viewer.war
        run: mvn -f pom.xml clean package -Drevision=${{ steps.version.outputs.build_version }} -Dchangelist="" -U -B
      - name: Create install.tar.gz
        run: |
          tar -czf install.tar.gz -C goobi-viewer-config/install --exclude=./docker .
      - name: Create a Github release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload viewer.war to Github Release
        uses: actions/upload-release-asset@v1.0.1
        id: upload-release-asset 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./goobi-viewer-theme-reference/target/viewer.war
          asset_name: viewer.war
          asset_content_type: application/zip
      - name: Upload install.tar.gz to Github Release
        uses: actions/upload-release-asset@v1.0.1
        id: upload-install-asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./install.tar.gz
          asset_name: install.tar.gz
          asset_content_type: application/gzip

