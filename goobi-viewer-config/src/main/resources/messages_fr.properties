admin__comment_groups_info_text=Lorsque cette fonctionnalit\u00E9 est active, les utilisateurs peuvent ajouter leurs propres commentaires sous les images. Une vue d'ensemble de tous les commentaires existants est \u00E0 la disposition des administrateurs. Ceux-ci peuvent \u00EAtre consult\u00E9s, modifi\u00E9s ou supprim\u00E9s.<br /><br/>Il est en outre possible de cr\u00E9er et de g\u00E9rer des groupes de commentaires. Ils contiennent tous les commentaires des enregistrements correspondant \u00E0 une requ\u00EAte Solr donn\u00E9e. Les groupes de commentaires peuvent \u00EAtre partag\u00E9s avec des groupes d'utilisateurs. zzz
