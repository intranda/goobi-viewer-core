admin__themes__footer_contact__help=Saisissez ici le lien vers votre page de contact. Si seul <span style\="font-weight\:bold;"> \#feedback</span> est indiqu\u00E9 comme lien, un formulaire de contact s'ouvre directement sur la page en cours.<br /><br />Si plusieurs destinataires sont enregistr\u00E9s dans le fichier de configuration, l'un d'entre eux peut \u00EAtre transmis directement \u00E0 l'ouverture du formulaire de contact \: il suffit d'ajouter <span style\="font-weight\:bold;"> \:recipient\=id</span> et d'utiliser l'id d'une entr\u00E9e d'adresse du fichier config_viewer.xml. Un exemple complet serait \: <span style\="font-weight\:bold;"> \#feedback\:recipient\=unicorn</span> zzz
