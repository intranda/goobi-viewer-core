cms__slider_type_description__records=Cr\u00E9e un slider \u00E0 partir d'ouvrages s\u00E9lectionn\u00E9s au moyen d'une requ\u00EAte Solr. Pour chaque ouvrage, le repr\u00E9sentant et le titre sont affich\u00E9s. zzz
