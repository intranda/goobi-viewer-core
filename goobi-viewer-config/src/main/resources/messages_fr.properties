cms__record_notes_text_editor_hints__text=Si seul <span style\="font-weight\:bold;"> \#feedback</span> est indiqu\u00E9 comme lien, le formulaire de retour s'ouvre directement sur la page o\u00F9 la note est visible.<br /><br />Si plusieurs destinataires sont enregistr\u00E9s dans le fichier de configuration, l'un d'entre eux peut \u00EAtre transmis directement \u00E0 l'ouverture du formulaire \: il suffit d'ajouter <span style\="font-weight\:bold;"> \:recipient\=id</span> et d'utiliser l'id d'une entr\u00E9e d'adresse du fichier config_viewer.xml. Un exemple complet serait \: <span style\="font-weight\:bold;"> \#feedback\:recipient\=unicorn</span> zzz
cms__record_notes_visibility=Visibilit\u00E9 zzz
cms__recordnote__css__help=Pour personnaliser la pr\u00E9sentation du composant, vous pouvez indiquer ici un nom de classe CSS. La classe est appliqu\u00E9e \u00E0 l'\u00E9l\u00E9ment HTML qui entoure le texte de la note d'ouvrage. zzz
