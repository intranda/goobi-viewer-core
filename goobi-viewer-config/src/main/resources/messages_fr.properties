searchAdvanced_widget_help_text=<p><strong>G\u00E9n\u00E9ralit\u00E9s</strong><br />Par d\u00E9faut, les mots isol\u00E9s sont reli\u00E9s par <span class\="widget-search-advanced-help__monospace">et</span>.</p><p><strong>Recherche de phrase</strong><br />La recherche de <span class\="widget-search-advanced-help__highlight">"v\u00E9lo Berlin"</span> trouve exactement cette suite de mots.</p><p><strong>Troncation</strong><br />La recherche de <span class\="widget-search-advanced-help__highlight">maison</span> trouve automatiquement maisonn\u00E9e et maisonnette. La troncation \u00E0 gauche est prise en charge lorsqu'elle est indiqu\u00E9e explicitement, par exemple <span class\="widget-search-advanced-help__highlight">*maison</span>.</p><p><strong>Recherche approximative</strong><br />Lorsque la recherche approximative est active, les r\u00E9sultats dont l'orthographe est proche sont \u00E9galement affich\u00E9s.</p><p><strong>Recherche de proximit\u00E9</strong><br />Recherchez deux termes qui ne se suivent pas n\u00E9cessairement dans le texte, par exemple <span class\="widget-search-advanced-help__highlight">"vente mus\u00E9e"~8</span>.</p> zzz
