admin__translations_description_text=Vous pouvez g\u00E9rer ici les traductions des noms de champs de l'index de recherche Solr, des collections, des types de publication et de structure ainsi que de certaines fonctions du logiciel lui-m\u00EAme. zzz
admin__translations_edit_description=Un clic sur "Entr\u00E9e suivante" enregistre la traduction en cours et passe \u00E0 l'entr\u00E9e suivante incompl\u00E8te ou non traduite. "Entr\u00E9e pr\u00E9c\u00E9dente" enregistre la traduction en cours et revient \u00E0 l'entr\u00E9e modifi\u00E9e auparavant. "Retour \u00E0 la vue d'ensemble" enregistre la traduction en cours et revient \u00E0 la vue d'ensemble. Si l'entr\u00E9e saisie diff\u00E8re de la traduction globale, l'entr\u00E9e globale est affich\u00E9e \u00E0 titre indicatif. Les entr\u00E9es marqu\u00E9es par <span class\="msgUnfinishedIdentifier">"z<span>&nbsp;</span>z<span>&nbsp;</span>z"</span> signifient qu'elles doivent encore \u00EAtre v\u00E9rifi\u00E9es. La cha\u00EEne de caract\u00E8res <span class\="msgUnfinishedIdentifier">"z<span aria-hidden\="true">&nbsp;</span>z<span aria-hidden\="true">&nbsp;</span>z"</span> est automatiquement filtr\u00E9e dans l'interface \! zzz
admin__translations_edit_overview_description=La liste suivante affiche toutes les valeurs. Un fond vert signifie enti\u00E8rement traduit, un fond jaune partiellement traduit. Les entr\u00E9es sur fond gris n'ont pas \u00E9t\u00E9 trait\u00E9es. zzz
admin__translations_entry_next=Entr\u00E9e suivante zzz
admin__translations_entry_previous=Entr\u00E9e pr\u00E9c\u00E9dente zzz
admin__translations_global=Global zzz
admin__translations_key=Cl\u00E9 zzz
admin__translations_new_entry_info_text=Les nouvelles traductions re\u00E7oivent syst\u00E9matiquement le pr\u00E9fixe <b>customer__</b> et ne sont inscrites que dans les fichiers messages.properties locaux. Elles apparaissent alors dans la rubrique "Entr\u00E9es sp\u00E9cifiques au client".<br /><br />Lorsqu'une traduction est marqu\u00E9e \u00E0 la fin par la cha\u00EEne de caract\u00E8res <span class\="msgUnfinishedIdentifier">"z<span aria-hidden\="true">&nbsp;</span>z<span aria-hidden\="true">&nbsp;</span>z"</span>, cette ligne est mise en \u00E9vidence visuellement et consid\u00E9r\u00E9e comme incompl\u00E8tement traduite. Cela permet de signaler les traductions qui doivent encore \u00EAtre v\u00E9rifi\u00E9es. zzz
