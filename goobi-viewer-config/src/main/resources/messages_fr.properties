admin__license_concurrent_views_limit_notice=La consultation simultan\u00E9e des ouvrages est limit\u00E9e \u00E0 un nombre d\u00E9fini d'utilisateurs. zzz
admin__license_concurrent_views_limit_record_count_nok=Pour pouvoir contr\u00F4ler les acc\u00E8s simultan\u00E9s \u00E0 un ouvrage, le nombre d'acc\u00E8s utilisateurs simultan\u00E9s autoris\u00E9s doit \u00EAtre index\u00E9 dans le champ ACCESSCONDITION_CONCURRENTUSE. <br />Aucune valeur n'a \u00E9t\u00E9 d\u00E9tect\u00E9e pour cette restriction. Ce r\u00E9glage est sans effet \! zzz
admin__license_concurrent_views_limit_record_count_ok=<span class\="font-weight-bold">{0} enregistrements</span> ont \u00E9t\u00E9 trouv\u00E9s pour lesquels une valeur permettant de contr\u00F4ler les acc\u00E8s simultan\u00E9s a \u00E9t\u00E9 index\u00E9e. <br />Ce r\u00E9glage est actif pour ces enregistrements \! zzz
