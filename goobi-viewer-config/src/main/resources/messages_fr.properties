admin__logviewer_sidebar__autoscroll=Fait d\u00E9filer automatiquement jusqu'\u00E0 la fin lors de l'arriv\u00E9e de nouvelles entr\u00E9es. Se d\u00E9sactive lorsque vous remontez manuellement. Le bouton bleu en bas \u00E0 droite du journal r\u00E9active le d\u00E9filement automatique. zzz
admin__logviewer_sidebar__buffer=Au maximum 2 000 lignes sont conserv\u00E9es en m\u00E9moire. Les entr\u00E9es plus anciennes sont automatiquement supprim\u00E9es. zzz
admin__logviewer_sidebar__level_filter=Filtre par niveau de journalisation. S\u00E9lectionnez un niveau pour n'afficher que les entr\u00E9es de ce type. ALL affiche tout. zzz
admin__logviewer_sidebar__live=Le visualiseur de journaux utilise une connexion WebSocket pour les mises \u00E0 jour en temps r\u00E9el. Si la connexion est interrompue, il bascule automatiquement en interrogation p\u00E9riodique et tente r\u00E9guli\u00E8rement de r\u00E9tablir la connexion. Les points de couleur \u00E0 c\u00F4t\u00E9 des onglets indiquent l'\u00E9tat \: vert \= en direct, jaune \= interrogation, rouge \= pas de connexion. zzz
admin__logviewer_sidebar__tabs=Chaque onglet correspond \u00E0 un fichier journal distinct. Les fichiers affich\u00E9s d\u00E9pendent de la configuration. zzz
