admin__license_function_cms_edit_categories__help=Lorsque cette option est active, l'acc\u00E8s \u00E0 la page "Cat\u00E9gories" est autoris\u00E9. Les cat\u00E9gories disponibles peuvent y \u00EAtre g\u00E9r\u00E9es globalement. zzz
admin__license_function_cms_edit_categories_label=Autoriser la gestion des cat\u00E9gories zzz
admin__license_function_cms_edit_collections__help=Lorsque cette option est active, l'acc\u00E8s \u00E0 la page "Collections" est autoris\u00E9. Il est possible d'y d\u00E9finir, pour les collections, des traductions, des textes descriptifs et des images de repr\u00E9sentant. zzz
admin__license_function_cms_edit_collections_label=Autoriser la modification des collections zzz
admin__license_function_cms_edit_menu__help=Lorsque cette option est active, l'acc\u00E8s \u00E0 la page "Menus" est autoris\u00E9. Elle permet de g\u00E9rer le menu principal et, le cas \u00E9ch\u00E9ant, les menus des sous-th\u00E8mes. zzz
admin__license_function_cms_edit_menu_label=Autoriser la modification du menu zzz
admin__license_function_cms_static_pages__help=Lorsque cette option est active, l'acc\u00E8s \u00E0 la page "Pages statiques" est autoris\u00E9. Il est possible d'y \u00E9craser des pages du Goobi viewer Core par une page CMS tout en conservant l'URL. zzz
admin__license_function_cms_static_pages_label=Autoriser la gestion des pages statiques zzz
admin__license_function_or_restriction=Funktionalit\u00E4t oder Zugriffsbeschr\u00E4nkung zzz
admin__license_functions=Fonctions zzz
admin__license_functions__help=Les fonctions attribu\u00E9es permettent de contr\u00F4ler la visibilit\u00E9 d'un enregistrement soumis \u00E0 une restriction d'acc\u00E8s. La signification des diff\u00E9rentes fonctions est la suivante \:<br /><br /><dl class\="row"><dt class\="col-2">Lister l'ouvrage</dt><dd class\="col-10">Contr\u00F4le l'affichage de principe de l'enregistrement. Si cette fonction est active, l'enregistrement est affich\u00E9 avec ses m\u00E9tadonn\u00E9es. Si elle ne l'est pas, l'enregistrement n'est visible que par les administrateurs.</dd><dt class\="col-2">Voir les vignettes</dt><dd class\="col-10">Cette fonction permet d'afficher les vignettes d'un enregistrement sans recourir \u00E0 la fonction "Voir les images". Le seuil jusqu'auquel une image est consid\u00E9r\u00E9e comme une vignette est d\u00E9fini dans le fichier de configuration, dans la section &lt;accessConditions&gt;. Dans la configuration par d\u00E9faut, il s'agit d'une largeur d'image de 400 px.</dd><dt class\="col-2">Voir les images</dt><dd class\="col-10">Lorsque cette fonction est active, l'acc\u00E8s aux images en haute r\u00E9solution est autoris\u00E9. Elle \u00E9crase donc la fonction "Voir les vignettes".</dd><dt class\="col-2">Regarder la vid\u00E9o</dt><dd class\="col-10">Si un enregistrement contient des vid\u00E9os, l'acc\u00E8s \u00E0 celles-ci peut \u00EAtre autoris\u00E9 ou bloqu\u00E9.</dd><dt class\="col-2">\u00C9couter le contenu audio</dt><dd class\="col-10">Si un enregistrement contient des fichiers audio, l'acc\u00E8s \u00E0 ceux-ci peut \u00EAtre autoris\u00E9 ou bloqu\u00E9.</dd><dt class\="col-2">Afficher le texte int\u00E9gral</dt><dd class\="col-10">Si des textes int\u00E9graux sont disponibles pour l'enregistrement, par exemple au format texte brut, ALTO ou TEI, l'acc\u00E8s \u00E0 ceux-ci peut \u00EAtre contr\u00F4l\u00E9.</dd><dt class\="col-2">Zoom de l'image</dt><dd class\="col-10">Lorsque cette fonction est active, le zoom peut \u00EAtre utilis\u00E9 sur l'image, dans la mesure o\u00F9 sa r\u00E9solution le permet. Si la fonction n'est pas active, les possibilit\u00E9s de zoom sont d\u00E9sactiv\u00E9es. L'affichage des images via l'API IIIF est en outre restreint.</dd><dt class\="col-2">T\u00E9l\u00E9charger les images</dt><dd class\="col-10">Lorsque cette fonction est active, un badge de t\u00E9l\u00E9chargement avec menu est affich\u00E9 dans le widget "Citer et r\u00E9utiliser".</dd><dt class\="col-2">T\u00E9l\u00E9charger des fichiers</dt><dd class\="col-10">Contr\u00F4le l'acc\u00E8s aux fichiers suppl\u00E9mentaires propos\u00E9s au t\u00E9l\u00E9chargement pour les enregistrements. Ils sont visibles dans la vue de l'ouvrage, dans le widget "T\u00E9l\u00E9chargements" de la barre lat\u00E9rale. </dd><dt class\="col-2">T\u00E9l\u00E9charger une page PDF</dt><dd class\="col-10">Cette fonction permet d'autoriser la g\u00E9n\u00E9ration de PDF de pages individuelles sans recourir \u00E0 la fonction "T\u00E9l\u00E9charger le PDF".</dd><dt class\="col-2">T\u00E9l\u00E9charger le PDF</dt><dd class\="col-10">Lorsque cette fonction est active, toutes les possibilit\u00E9s de t\u00E9l\u00E9chargement de PDF sont disponibles. Elle \u00E9crase donc la fonction "T\u00E9l\u00E9charger une page PDF".</dd><dt class\="col-2">T\u00E9l\u00E9charger les m\u00E9tadonn\u00E9es</dt><dd class\="col-10">Cette fonction permet de contr\u00F4ler le t\u00E9l\u00E9chargement des m\u00E9tadonn\u00E9es (par exemple METS, LIDO, DublinCore, MARCXML, ...) dans le widget "Citer et r\u00E9utiliser". Cette restriction est pertinente par exemple en combinaison avec une Moving Wall. Lorsque des enregistrements sont plac\u00E9s sous une licence donn\u00E9e jusqu'\u00E0 l'expiration de la Moving Wall, puis sous une autre, l'affichage dans l'interface peut \u00EAtre adapt\u00E9 ind\u00E9pendamment des valeurs contenues dans les fichiers source. Dans ce cas, il convient d'emp\u00EAcher l'acc\u00E8s aux fichiers source portant l'indication de licence non modifi\u00E9e.</dd><dt class\="col-2">G\u00E9n\u00E9rer le manifeste IIIF</dt><dd class\="col-10">Contr\u00F4le l'acc\u00E8s au manifeste IIIF d'un enregistrement. Voir \u00E9galement la description compl\u00E9mentaire de la fonction "T\u00E9l\u00E9charger les m\u00E9tadonn\u00E9es".</dd><dt class\="col-2">Voir le contenu g\u00E9n\u00E9r\u00E9 par l'utilisateur</dt><dd class\="col-10">Lorsque les r\u00E9sultats d'une campagne de crowdsourcing sont assortis d'une restriction d'acc\u00E8s, l'acc\u00E8s \u00E0 ceux-ci peut \u00EAtre contr\u00F4l\u00E9 au moyen de cette fonction. Il est ainsi possible, par exemple, de bloquer l'acc\u00E8s par principe et de n'accorder le droit correspondant qu'\u00E0 un groupe d'utilisateurs d\u00E9termin\u00E9.</dd><dt class\="col-2">T\u00E9l\u00E9charger les fichiers Born Digital</dt><dd class\="col-10">Lorsque cette fonction est active, les fichiers born digital, par exemple des publications \u00E9lectroniques, peuvent \u00EAtre t\u00E9l\u00E9charg\u00E9s. Cette fonction concerne la zone affich\u00E9e en haut de la page des m\u00E9tadonn\u00E9es. La fonctionnalit\u00E9 facultative de ticket peut \u00EAtre activ\u00E9e via les droits. Si cette fonctionnalit\u00E9 est activ\u00E9e, la fonctionnalit\u00E9 "Voir les images" doit imp\u00E9rativement \u00EAtre active elle aussi.</dd></dl> zzz
