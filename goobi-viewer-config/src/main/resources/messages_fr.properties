customer_akwien_introText_index=<p>St\u00F6bern Sie im ganzen Wissen der digitalen AK Wien. Der Arbeiterkammer ist freier Zugang zu Information sehr wichtig. Deswegen bieten wir Ihnen \u00FCber diese E-Medien kostenlosen Zugang zu arbeitnehmerInnenrelevanten Dokumenten wie Studien, Brosch\u00FCren oder Zeitschriften.</p><p><strong>Sie k\u00F6nnen\:</strong></p><ul class\="bullets"><li>Publikationen der AK Wien einsehen</li><li>Publikationen als PDF downloaden</li><li>Volltexte und Metadaten durchsuchen</li><li>In Inhaltsverzeichnissen der Publikationen bl\u00E4ttern</li><li>AutorInnen und Titel durchst\u00F6bern</li><li>und vieles mehr ...</li></ul><p>Viel Freude beim St\u00F6bern, Lesen, Durchsuchen und Herunterladen\!</p>
