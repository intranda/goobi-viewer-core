admin__licenses_description_text=Les restrictions d'acc\u00E8s permettent de contr\u00F4ler l'acc\u00E8s aux enregistrements. Pour cela, le contenu de la m\u00E9tadonn\u00E9e souhait\u00E9e doit \u00EAtre inscrit dans le champ Solr ACCESSCONDITION. Les enregistrements qui poss\u00E8dent une m\u00E9tadonn\u00E9e dans le champ ACCESSCONDITION ne sont affich\u00E9s que lorsque la restriction d'acc\u00E8s a \u00E9t\u00E9 configur\u00E9e ici. <br /><br />Les r\u00E9glages effectu\u00E9s ici r\u00E9gissent l'affichage pour un utilisateur non connect\u00E9 venant d'Internet. Ces restrictions d'acc\u00E8s peuvent \u00EAtre \u00E9cras\u00E9es sur la page "Droits" pour des utilisateurs, des groupes ou des plages IP. <br /><br />Les fonctions actives sont signal\u00E9es par un <div class\="admin__badge admin__badge-active admin__license-badge">badge vert</div>. Celles qui ne sont pas attribu\u00E9es sont gris\u00E9es. zzz
