admin__groups_description_text=Un groupe poss\u00E8de un propri\u00E9taire et un nombre quelconque de membres. Le propri\u00E9taire sert d'interlocuteur aux administrateurs du site. Sur la page "Utilisateurs", les propri\u00E9taires sont repr\u00E9sent\u00E9s par un <div class\="admin__badge admin__badge-info">badge turquoise</div> et l'appartenance au groupe par un <div class\="admin__badge admin__badge-dark">badge noir</div>. Les groupes ne peuvent \u00EAtre supprim\u00E9s que s'ils ne contiennent aucun membre. <br /><br />Sur la page "Droits", des droits \u00E9tendus peuvent \u00EAtre attribu\u00E9s aux groupes. Ils sont alors automatiquement h\u00E9rit\u00E9s par tous les membres du groupe. zzz
admin__help_crowdsourcing_campaign_description=La description est affich\u00E9e dans la vue d'ensemble des campagnes et donne aux personnes int\u00E9ress\u00E9es un aper\u00E7u des questions trait\u00E9es dans la campagne. zzz
admin__help_crowdsourcing_campaign_limit_to_group=Une campagne priv\u00E9e est visible pour le groupe d'utilisateurs s\u00E9lectionn\u00E9 ici. Le propri\u00E9taire du groupe est \u00E9galement propri\u00E9taire de la campagne et peut la modifier. zzz
admin__help_crowdsourcing_campaign_media_file=L'image est affich\u00E9e dans la vue d'ensemble des campagnes. zzz
admin__help_crowdsourcing_campaign_solr_query=Une requ\u00EAte Solr qui d\u00E9finit les ouvrages \u00E0 annoter dans le cadre de cette campagne, par exemple 'DOCSTRCT\:monograph', 'DC\:varia*' ou 'PI\:123 OR PI\:abc'. zzz
admin__help_crowdsourcing_campaign_time_pediod=Une campagne priv\u00E9e peut \u00EAtre partag\u00E9e pour une p\u00E9riode d\u00E9finie. Elle est alors visible publiquement par tous. Toutefois, si la campagne est en m\u00EAme temps limit\u00E9e \u00E0 un groupe d'utilisateurs, elle n'est visible que pour ce groupe. zzz
admin__help_crowdsourcing_campaign_visibility=Une campagne priv\u00E9e peut \u00EAtre partag\u00E9e avec un groupe d'utilisateurs ou pour une p\u00E9riode donn\u00E9e. Les campagnes publiques sont visibles par tous sans restriction. zzz
admin__help_crowdsourcing_question_metadata=Si une m\u00E9tadonn\u00E9e s\u00E9lectionn\u00E9e ici contient d\u00E9j\u00E0 une valeur, celle-ci est affich\u00E9e dans la campagne. Si elle est vide, elle peut \u00EAtre compl\u00E9t\u00E9e via un champ de saisie. zzz
admin__help_crowdsourcing_question_targetFrequency=D\u00E9finissez ici combien de r\u00E9ponses \u00E0 la question sont autoris\u00E9es. zzz
admin__help_crowdsourcing_question_targetSelector=D\u00E9terminez \u00E0 quelle partie de l'ouvrage se rapporte le r\u00E9sultat de la question, par exemple une zone de l'image, une page ou l'ouvrage entier. zzz
admin__help_crowdsourcing_question_text=La question concr\u00E8te est pos\u00E9e ici, par exemple \u00AB Quelles personnes peut-on reconna\u00EEtre ? \u00BB. zzz
admin__help_crowdsourcing_question_type=Le type de question d\u00E9termine la forme du r\u00E9sultat attendu, par exemple un texte ou un marqueur sur une carte. zzz
