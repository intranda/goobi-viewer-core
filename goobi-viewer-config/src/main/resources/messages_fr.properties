admin__highlights__description=Cette page permet de configurer des highlights. Ils peuvent avoir une date de d\u00E9but et une date de fin. Si plusieurs highlights sont publi\u00E9s sur la m\u00EAme p\u00E9riode, l'un d'entre eux est choisi au hasard \u00E0 l'ouverture de la page. Les highlights peuvent \u00EAtre affich\u00E9s sur une page CMS ou dans la barre lat\u00E9rale. Sont affich\u00E9es toutes les entr\u00E9es publi\u00E9es, ainsi que celles qui se situent dans la p\u00E9riode configur\u00E9e. zzz
