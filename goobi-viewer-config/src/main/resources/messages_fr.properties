admin__legal__cookie_banner_info=Si cette fonctionnalit\u00E9 est activ\u00E9e, les visiteurs doivent accepter le texte enregistr\u00E9 ici lors de leur premi\u00E8re visite du site. Le bandeau est affich\u00E9 sur chaque page consult\u00E9e. Il est toutefois possible de d\u00E9finir une liste de pages CMS sur lesquelles son affichage est supprim\u00E9. Cela peut \u00EAtre utile, par exemple, lorsque le bandeau renvoie \u00E0 d'autres textes tels que des conditions g\u00E9n\u00E9rales d'utilisation ou une politique de confidentialit\u00E9.<br/><br/>Si le texte est modifi\u00E9 par la suite, les utilisateurs peuvent \u00EAtre invit\u00E9s \u00E0 donner leur accord \u00E0 nouveau. zzz
