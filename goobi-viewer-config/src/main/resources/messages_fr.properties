cms__geomaps__popup_content__help=Lorsque le pointeur de la souris survole un marqueur, des informations suppl\u00E9mentaires peuvent \u00EAtre affich\u00E9es. Vous d\u00E9finissez ici si c'est le cas et, dans l'affirmative, lesquelles. zzz
