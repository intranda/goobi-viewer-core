inline_help__cms_page_type_browseTerm_select=S\u00E9lectionnez le champ Solr dont les valeurs doivent pouvoir \u00EAtre parcourues. zzz
inline_help__cms_page_type_collection_select=S\u00E9lectionnez le nom du champ Solr \u00E0 partir des valeurs duquel l'arborescence des collections sera g\u00E9n\u00E9r\u00E9e. zzz
inline_help__cms_page_type_page_list_categories_as_header=Si plusieurs cat\u00E9gories sont s\u00E9lectionn\u00E9es, les diff\u00E9rentes contributions FAQ peuvent \u00EAtre regroup\u00E9es ici par cat\u00E9gorie. Le titre de la cat\u00E9gorie est alors affich\u00E9 comme intitul\u00E9. zzz
inline_help__cms_page_type_page_list_category=Les cat\u00E9gories s\u00E9lectionn\u00E9es ici d\u00E9terminent les contributions FAQ affich\u00E9es. Elles doivent correspondre aux cat\u00E9gories auxquelles les diff\u00E9rentes contributions FAQ sont affect\u00E9es. zzz
inline_help__create_category_description=Lorsque les cat\u00E9gories sont nombreuses, la description peut aider \u00E0 pr\u00E9ciser leur usage. zzz
inline_help__create_category_title=Ce nom est affich\u00E9 dans les pages CMS et les m\u00E9dias. zzz
inline_help__edit_media_alt_text=La balise ALT d\u00E9crit une image. Si celle-ci ne peut pas \u00EAtre affich\u00E9e, ce texte appara\u00EEt. Pour les utilisateurs malvoyants, il contribue \u00E0 l'accessibilit\u00E9. zzz
inline_help__edit_media_categories=Les cat\u00E9gories servent \u00E0 la classification et au regroupement. Dans les mod\u00E8les CMS Masonry, par exemple, toutes les images d'une cat\u00E9gorie peuvent \u00EAtre affich\u00E9es. zzz
inline_help__edit_media_description=Sur certains mod\u00E8les CMS, la description est affich\u00E9e comme l\u00E9gende en compl\u00E9ment du nom. zzz
inline_help__edit_media_display_order=L'ordre d'affichage sert \u00E0 trier les listes de m\u00E9dias dans les pages CMS. zzz
inline_help__edit_media_important=Les m\u00E9dias marqu\u00E9s comme "Important" sont affich\u00E9s en priorit\u00E9 dans les pages CMS comportant des listes de m\u00E9dias. Cela signifie que si seule une partie des m\u00E9dias est affich\u00E9e, le plus grand nombre possible de m\u00E9dias marqu\u00E9s comme "Important" est pr\u00E9sent\u00E9. zzz
inline_help__edit_media_links_to=Si ce fichier m\u00E9dia est utilis\u00E9 dans le mod\u00E8le Masonry, la tuile contenant le fichier m\u00E9dia est associ\u00E9e \u00E0 ce lien. zzz
inline_help__edit_media_title=Le titre est affich\u00E9 sur les pages CMS comme nom du fichier m\u00E9dia. zzz
inline_help__group_by_field=Si un champ de regroupement est s\u00E9lectionn\u00E9, les contenus sont affich\u00E9s regroup\u00E9s selon les valeurs de ce champ, par exemple par ann\u00E9e ou par sous-th\u00E8me. Les champs pouvant contenir plusieurs valeurs ne sont pas disponibles pour le regroupement. zzz
inline_help__input_solr_query=Une requ\u00EAte Solr permettant de lister des ouvrages, par exemple 'DOCSTRCT\:monograph', 'DC\:varia*' ou 'PI\:123 OR PI\:abc'. zzz
inline_help__solr_item_count=Nombre d'ouvrages affich\u00E9s par page. Au-del\u00E0, une pagination est propos\u00E9e pour naviguer. zzz
inline_help__solr_query_danger=La requ\u00EAte Solr saisie renvoie une erreur. zzz
inline_help__solr_query_warning=La requ\u00EAte Solr saisie est valide, mais elle renvoie {0} r\u00E9sultats. zzz
inline_help__solr_sort_fields=Tri par d\u00E9faut des ouvrages. Si aucun champ de tri n'est indiqu\u00E9, l'affichage suit la pertinence interne de Solr. zzz
