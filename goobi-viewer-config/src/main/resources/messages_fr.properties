cms__geomaps__aggregate_query_results__help=Vous pouvez s\u00E9lectionner ici les types de documents dans lesquels les r\u00E9sultats doivent \u00EAtre trouv\u00E9s. Selon ce choix, un r\u00E9sultat repr\u00E9sente soit un ouvrage complet, soit un \u00E9l\u00E9ment de structure au sein d'un ouvrage, soit un groupe de m\u00E9tadonn\u00E9es. La requ\u00EAte Solr saisie doit correspondre \u00E0 des documents du type s\u00E9lectionn\u00E9. zzz
cms__geomaps__aggregate_query_results__label=Rechercher dans les sous-\u00E9l\u00E9ments zzz
cms__geomaps__description=Les cartes suivantes sont disponibles pour \u00EAtre utilis\u00E9es dans les pages CMS ou via oEmbed \: zzz
cms__geomaps__description__no_content=Aucune carte n'a encore \u00E9t\u00E9 cr\u00E9\u00E9e. zzz
cms__geomaps__feature_description__help=Lorsqu'un marqueur est cliqu\u00E9, une fen\u00EAtre contextuelle s'affiche. Le texte de cette fen\u00EAtre est d\u00E9fini ici. Les sauts de ligne (<br />) et les liens (<a href\='...' />) peuvent \u00EAtre indiqu\u00E9s en notation HTML. zzz
cms__geomaps__feature_title__help=Lorsqu'un marqueur est cliqu\u00E9, une fen\u00EAtre contextuelle s'affiche. Le titre de cette fen\u00EAtre est d\u00E9fini ici. zzz
cms__geomaps__featureset_name__help=Le nom du featureset est affich\u00E9 sur la carte comme nom d'onglet, si cela est activ\u00E9 dans le th\u00E8me. Sinon, il sert \u00E0 l'identification interne. zzz
cms__geomaps__featuresets_desc=Les contenus des cartes peuvent \u00EAtre g\u00E9n\u00E9r\u00E9s manuellement ou automatiquement \u00E0 partir de coordonn\u00E9es issues de l'index de recherche Solr. Les featuresets permettent de combiner et de visualiser diff\u00E9rents contenus sur une m\u00EAme carte. zzz
cms__geomaps__filter_type__help=La base de donn\u00E9es des lieux affich\u00E9s peut \u00EAtre limit\u00E9e ici \u00E0 certains types. zzz
cms__geomaps__heatmap__label=Heatmap zzz
cms__geomaps__item_filter__label=Filtre de marqueurs zzz
cms__geomaps__item_filters__help=Vous pouvez s\u00E9lectionner ici une configuration de filtre enregistr\u00E9e dans le fichier de configuration. Si une telle configuration est s\u00E9lectionn\u00E9e, des options apparaissent sur la carte pour filtrer les r\u00E9sultats affich\u00E9s selon certaines valeurs de m\u00E9tadonn\u00E9es. Vous trouverez plus de d\u00E9tails sur la cr\u00E9ation de configurations de filtre dans la documentation du viewer, \u00E0 la rubrique \u00AB Cartes \u00BB. zzz
cms__geomaps__map__content=Contenus zzz
cms__geomaps__map__help=Veuillez s\u00E9lectionner la portion de carte souhait\u00E9e et son facteur de zoom. La s\u00E9lection est enregistr\u00E9e automatiquement. zzz
cms__geomaps__map__title=Carte zzz
cms__geomaps__map_token__help=Pour ajouter une entr\u00E9e sur la carte, cliquez \u00E0 l'endroit souhait\u00E9 avec le bouton droit de la souris. Le marqueur peut ensuite \u00EAtre d\u00E9plac\u00E9 avec le bouton gauche. Lorsqu'un marqueur est actif, un titre et une description peuvent \u00EAtre saisis. zzz
cms__geomaps__marker__help=C'est ici qu'est d\u00E9fini le marqueur servant \u00E0 afficher un point sur la carte. La liste des marqueurs disponibles peut \u00EAtre adapt\u00E9e et \u00E9tendue dans le fichier de configuration. zzz
