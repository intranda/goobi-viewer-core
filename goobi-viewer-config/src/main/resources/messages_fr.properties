help__geomap_search__text=Zoomez sur la zone de carte souhait\u00E9e ou recherchez une adresse \u00E0 l'aide du champ de recherche int\u00E9gr\u00E9. D\u00E9limitez ensuite une zone sur la carte. Un cercle, un rectangle ou un polygone librement d\u00E9finissable sont propos\u00E9s. <br><br>Le bouton "Rechercher" permet de lancer une recherche sur la zone de carte d\u00E9limit\u00E9e. Tous les enregistrements contenant des coordonn\u00E9es situ\u00E9es dans cette zone sont alors trouv\u00E9s. <br>Le bouton "R\u00E9initialiser" annule les r\u00E9glages effectu\u00E9s sur la carte. zzz
