admin__license_allowed_categories__help=Si l'acc\u00E8s n'est pas autoris\u00E9 pour toutes les cat\u00E9gories, il est possible de s\u00E9lectionner individuellement les cat\u00E9gories autoris\u00E9es. Seuls les pages CMS et les m\u00E9dias affect\u00E9s \u00E0 ces cat\u00E9gories sont alors accessibles. Ce sont \u00E9galement ces cat\u00E9gories qui peuvent \u00EAtre attribu\u00E9es \u00E0 de nouvelles pages et \u00E0 de nouveaux m\u00E9dias. zzz
