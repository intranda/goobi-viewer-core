ie11_text=<p>Ch\u00E8re utilisatrice, cher utilisateur,</p><p>en raison des \u00E9volutions actuelles des technologies web utilis\u00E9es dans le Goobi viewer, le logiciel ne prend plus en charge le navigateur que vous utilisez.</p><p>Veuillez utiliser l'un des navigateurs suivants pour afficher correctement cette page.</p><ul><li><a href\="https\://www.google.de/chrome/">Google Chrome</a></li><li><a href\="https\://www.mozilla.org/fr/firefox/new/">Mozilla Firefox</a></li><li>Aux utilisateurs de Windows, nous recommandons Windows 10 avec le navigateur int\u00E9gr\u00E9 EDGE.</li></ul><p>Merci de votre compr\u00E9hension.</p> zzz
iePromptText=<p>Cher utilisateur, votre navigateur est obsol\u00E8te.<br />Le logiciel Goobi viewer n'est pas enti\u00E8rement compatible avec la version de votre naviguateur.<br />C'est pourquoi des erreurs peuvent survenir lors de l'affichage des pages.</p><p>Veuillez utiliser l'un des navigateurs suivants \:</p><ul><li><a href\="http\://windows.microsoft.com/fr-FR/internet-explorer/download-ie" target\="_blank">Microsoft Internet Explorer 9 ou plus</a></li><li><a href\="http\://www.mozilla.org/fr/firefox/new/" target\="_blank">Mozilla Firefox 27 ou plus</a></li><li><a href\="https\://www.google.fr/intl/fr/chrome/" target\="_blank">Google Chrome 32 ou plus</a></li></ul>
