customer_oolbib_searchEntryText=<p>Um digitalisierte Medien zu finden, stehen Ihnen sowohl eine <a href\="/viewer/search/">Stichwortsuche mit erweiterten Suchfunktionen</a> als auch ein <a href\="/viewer/term/MD_AUTHOR_UNTOKENIZED/1/">Autoren-</a> und <a href\="/viewer/term/MD_TITLE_UNTOKENIZED/1/">Titelverzeichnis</a> sowie die Auswahl \u00FCber <a href\="/viewer/browse/">Sammlungsbereiche</a> oder <a href\="/viewer/tags/">Tag Clouds</a> zur Verf\u00FCgung.</p>
