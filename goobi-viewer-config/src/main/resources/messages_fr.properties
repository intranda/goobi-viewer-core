admin__roles_description_text=Cette page permet d'attribuer des droits \u00E9tendus \u00E0 des utilisateurs, des groupes et des plages IP. Ces droits d\u00E9coulent des fonctionnalit\u00E9s du Goobi viewer ou de restrictions d'acc\u00E8s. <br /><br />Les fonctions suppl\u00E9mentaires sont signal\u00E9es par un <div class\="admin__badge admin__badge-active admin__license-badge">badge vert</div>. Une fonctionnalit\u00E9 active h\u00E9rit\u00E9e d'un autre endroit est affich\u00E9e sous la forme d'un <div class\="admin__badge admin__badge-secondary admin__license-badge">badge marron</div>. Les fonctions non attribu\u00E9es sont gris\u00E9es. <br />Les sous-th\u00E8mes autoris\u00E9s sont repr\u00E9sent\u00E9s par un <div class\="admin__badge admin__badge-dark admin__license-badge">badge fonc\u00E9</div>, les cat\u00E9gories par un <div class\="admin__badge admin__badge-violet admin__license-badge">badge violet</div> et les mod\u00E8les CMS par un <div class\="admin__badge admin__badge-primary admin__license-badge">badge bleu</div>. zzz
