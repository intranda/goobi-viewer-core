admin__cms_collections_desc=Cette page permet de g\u00E9rer l'affichage des collections. Une description, un repr\u00E9sentant ou une URL vers une page peuvent \u00EAtre indiqu\u00E9s pour chaque collection. Si plusieurs champs Solr ont \u00E9t\u00E9 configur\u00E9s pour l'affichage des collections dans le fichier de configuration, le champ Solr de l'arborescence souhait\u00E9e peut \u00EAtre s\u00E9lectionn\u00E9 dans la barre lat\u00E9rale. zzz
admin__cms_collections_image_desc=Une image peut \u00E9ventuellement \u00EAtre attribu\u00E9e aux collections. Elle peut soit \u00EAtre mise en ligne et d\u00E9pos\u00E9e dans les m\u00E9dias, soit \u00EAtre d\u00E9sign\u00E9e par l'identifiant d'un ouvrage. Dans ce cas, le repr\u00E9sentant de l'ouvrage est affich\u00E9. zzz
