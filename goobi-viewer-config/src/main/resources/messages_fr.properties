cms__geomap__description=Les cartes peuvent \u00EAtre affich\u00E9es dans la zone de contenu des pages CMS et dans la barre lat\u00E9rale. Il est en outre possible de copier un lien vers une vue oEmbed. zzz
cms__geomap_edit__description=Les cartes peuvent \u00EAtre affich\u00E9es dans la zone de contenu des pages CMS et dans la barre lat\u00E9rale. Un lien vers une vue oEmbed est disponible dans la vue d'ensemble. zzz
