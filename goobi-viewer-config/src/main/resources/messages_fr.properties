admin__license_ticket_required__help=La fonctionnalit\u00E9 <b>T\u00E9l\u00E9charger les fichiers originaux</b> a \u00E9t\u00E9 reconnue comme fonctionnalit\u00E9 attribu\u00E9e. Le Goobi viewer peut \u00E9ventuellement restreindre davantage l'acc\u00E8s, de sorte qu'un ticket suppl\u00E9mentaire soit n\u00E9cessaire. Un ticket peut \u00EAtre demand\u00E9 lors de la tentative de t\u00E9l\u00E9chargement. <br />Cette option peut \u00EAtre activ\u00E9e en compl\u00E9ment. Si elle est d\u00E9sactiv\u00E9e, les fichiers originaux peuvent \u00EAtre t\u00E9l\u00E9charg\u00E9s sans restriction suppl\u00E9mentaire. zzz
