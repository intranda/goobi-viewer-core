admin__developer__general_info_text=Si la couleur de l'autopull est verte, le th\u00E8me est r\u00E9cup\u00E9r\u00E9 automatiquement. Si la couleur est rouge, la t\u00E2che planifi\u00E9e n'est pas active. Si la couleur de fond est orange, une erreur s'est produite lors de la v\u00E9rification. Pour pouvoir ex\u00E9cuter un th\u00E8me dans son environnement de d\u00E9veloppement local exactement comme il appara\u00EEt sur le syst\u00E8me du client, diff\u00E9rentes conditions doivent \u00EAtre remplies. Toutes les informations n\u00E9cessaires sont r\u00E9unies sur cette page. Elle explique pas \u00E0 pas quels fichiers doivent \u00EAtre modifi\u00E9s localement et comment, afin que les donn\u00E9es dans Eclipse soient ensuite identiques \u00E0 celles de l'instance en production. Les commandes se rapportent \u00E0 Linux et doivent \u00EAtre adapt\u00E9es \u00E0 votre propre syst\u00E8me d'exploitation si n\u00E9cessaire. zzz
admin__developer__local_messages_config_code=mv /tmp/viewerconfig/messages_* /opt/digiverso/viewer/config/<br>mv /tmp/viewerconfig/config_viewer* /opt/digiverso/viewer/config/<br>rm -rf /tmp/viewerconfig*
