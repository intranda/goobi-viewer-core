admin__legal__disclaimer_info=Si cette fonctionnalit\u00E9 est activ\u00E9e, un texte d'information comportant des pr\u00E9cisions est pr\u00E9sent\u00E9 aux visiteurs. Ce texte peut par exemple signaler des contenus sensibles. L'affichage a lieu au choix dans des enregistrements s\u00E9lectionn\u00E9s ou de mani\u00E8re globale. Le texte peut uniquement \u00EAtre confirm\u00E9. Cette confirmation peut valoir au choix pour une session de navigation ou pour un nombre de jours d\u00E9termin\u00E9. <br /> <br /> Si le texte est modifi\u00E9 par la suite, les utilisateurs peuvent \u00EAtre invit\u00E9s \u00E0 le confirmer \u00E0 nouveau. zzz
admin__legal__disclaimer_properties__label=Autres param\u00E8tres zzz
admin__legal__disclaimer_properties_description=Vous pouvez choisir ici si l'avertissement doit \u00EAtre affich\u00E9 sur chaque page du Goobi viewer ou seulement pour certains enregistrements. Dans ce dernier cas, une requ\u00EAte Solr restrictive peut \u00EAtre indiqu\u00E9e. Par ailleurs, la validit\u00E9 de la confirmation peut \u00EAtre fix\u00E9e soit \u00E0 une session de navigation, soit \u00E0 un nombre de jours. zzz
