admin__crowdsourcing_campaign_statistic_mode__help=Les statistiques d'une campagne peuvent \u00EAtre calcul\u00E9es de deux mani\u00E8res. Le calcul bas\u00E9 sur les ouvrages prend en compte tous les ouvrages contenus dans la campagne. Le calcul bas\u00E9 sur les images se fonde sur le nombre d'images de tous les ouvrages contenus dans la campagne. Des statistiques bas\u00E9es sur les images sont pertinentes lorsqu'une campagne ne contient que peu d'ouvrages, mais que chaque image doit \u00EAtre examin\u00E9e individuellement. zzz
